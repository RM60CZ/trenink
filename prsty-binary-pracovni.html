<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TEST prsty</title>
  <style>
    body { margin:0; background:#0b1020; color:#d7defa; font-family:system-ui, sans-serif; padding:16px; }
    .grid { display:grid; grid-template-columns: repeat(15, 30px); gap:8px; margin-top:12px; }
    .sq { width:30px; height:30px; background:#ff4d6d; border-radius:8px; }
    .sq.on { background:#4dffb2; }
  </style>
</head>
<body>
  <h1>TEST prsty - viditelnost</h1>
  <div id="grid" class="grid"></div>

  <script>
    const grid = document.getElementById('grid');
    const N = 15;
    for (let i=0; i<N; i++){
      const el = document.createElement('div');
      el.className = 'sq';
      el.textContent = '';
      el.title = 'i=' + i;
      el.onclick = () => el.classList.toggle('on');
      grid.appendChild(el);
    }
  </script>
</body>
</html>
