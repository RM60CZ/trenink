<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pyramida čísel</title><style>
:root{--bg:#dfe3ea;--card:rgba(238,241,245,.92);--text:#172033;--muted:#5d6b86;--primary:#4f46e5;--primary-light:#818cf8;--input-bg:#f5f6f8;--input-border:#b9c1d1;--disabled-bg:#e1e5ec;--disabled-border:#c4cad5;--bottom-border:#facc15;--bottom-bg:#f3efd7;--success:#16a34a;--error:#dc2626;--active-bg:#eef2ff;--shadow:0 24px 60px rgba(60,70,95,.18)}

#overlayLevy,#overlayPravy{padding-left:4px;padding-right:4px}.prekryv-input:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 5px rgba(129,140,248,.22)}#overlayAktivni{background:var(--active-bg);border-color:var(--primary);box-shadow:0 0 0 5px rgba(129,140,248,.22)}#overlayLevy{border-radius:15px 0 0 15px}#overlayPravy{border-radius:0 15px 15px 0}.prekryv-input.spatne{color:var(--text)!important;border:2px solid var(--error)!important;box-shadow:0 0 0 5px rgba(220,38,38,.35)!important}.prekryv-input.spravne{color:var(--text)!important;border:2px solid var(--success)!important;box-shadow:0 0 0 5px rgba(34,197,94,.25)!important}

@media(max-width:760px){.herni-plocha{padding-top:54px}.postranni-tlacitko{top:0}.postranni-tlacitko.vlevo{right:calc(50% + 22px)}.postranni-tlacitko.vpravo{left:calc(50% + 22px)}}
@media(max-width:480px){body{padding:10px 6px}.aplikace{padding:14px 8px 24px;border-radius:22px;overflow:visible}.hlavicka{padding:0 74px 0 0;gap:6px}.nastaveni-kolo,.rezim{width:34px;height:34px}.nastaveni-kolo{right:38px}.rezim{font-size:24px}h1{font-size:clamp(24px,7vw,30px)}.mazani-historie{width:66px;height:32px;font-size:13px;padding:5px 6px}.nastaveni{margin-bottom:6px}.panel-nastaveni{max-height:180px}.nastaveni-radky{gap:7px 6px;margin-top:6px}.nastaveni-popisek{font-size:clamp(15px,4.1vw,18px)}.pole{width:clamp(116px,32vw,138px);padding:1px 2px}select{font-size:clamp(14px,3.8vw,17px);padding:7px 4px}.radek{gap:4px}.bunka-slot{flex:0 0 calc((100vw - 56px)/7);width:calc((100vw - 56px)/7);height:calc((100vw - 56px)/7);max-width:52px;max-height:52px;min-width:0}.bunka-slot input{font-size:clamp(13px,3.6vw,17px);border-radius:10px;padding:0 2px}.prekryv-panel{gap:6px}.prekryv-input{height:clamp(52px,15vw,72px);font-size:clamp(17px,4.4vw,24px);padding:0 6px}#overlayLevy,#overlayPravy{font-size:clamp(15px,4vw,22px);padding-left:2px;padding-right:2px}.akce{min-width:136px;font-size:15px;padding:11px 18px}}
</style></head>
<body><main class="aplikace"><header class="hlavicka"><h1>Pyramida čísel</h1><div class="mazani-wrap"><input id="mazaniHistorie" class="mazani-historie" type="text" autocomplete="off" spellcheck="false" aria-label="Zde můžete odstranit historii" placeholder="Vymazat"></div><button id="nastaveniToggle" class="nastaveni-kolo" type="button" aria-label="Otevřít nastavení">⚙️</button><button id="rezim" class="rezim" type="button" aria-label="Přepnout tmavý/světlý režim">🌙</button></header>
<section id="nastaveni" class="nastaveni zavreno"><div id="panelNastaveni" class="panel-nastaveni"><div class="nastaveni-radky"><label class="nastaveni-popisek" for="vyska">výška pyramidy</label><div class="pole"><select id="vyska" aria-label="Počet poschodí pyramidy"><option value="2">2 poschodí</option><option value="3">3 poschodí</option><option value="4">4 poschodí</option><option value="5">5 poschodí</option><option value="6">6 poschodí</option><option value="7" selected>7 poschodí</option></select></div><label class="nastaveni-popisek" for="cifry">počet cifer</label><div class="pole"><select id="cifry" aria-label="Počet cifer spodního řádku"><option value="1">1 cifra</option><option value="2" selected>2 cifry</option><option value="3">3 cifry</option><option value="4">4 cifry</option><option value="5">5 cifer</option><option value="6">6 cifer</option><option value="7">7 cifer</option><option value="8">8 cifer</option></select></div><label class="nastaveni-popisek" for="znamenko">sčítání - sčítání+odčítání</label><div class="pole"><select id="znamenko" aria-label="Typ čísel spodního řádku"><option value="p">+</option><option value="pm">+ -</option></select></div></div></div></section>
<div id="hlaska" class="hlaska"></div><div class="herni-plocha" id="herniPlocha"><div class="postranni-tlacitko vlevo"><button id="start" class="akce" type="button">S T A R T</button></div><div class="pyramida" id="pyramida"></div><div id="prekryvPanel" class="prekryv-panel"><div class="prekryv-horni-wrap"><input id="overlayAktivni" class="prekryv-input" type="text" inputmode="numeric"></div><div class="prekryv-spodni-wrap"><input id="overlayLevy" class="prekryv-input" type="text" readonly tabindex="-1"><input id="overlayPravy" class="prekryv-input" type="text" readonly tabindex="-1"></div></div><div class="postranni-tlacitko vpravo"><button id="konec" class="akce konec" type="button">K O N E C</button></div></div><div id="historie" class="historie"></div></main>
<script>
const $=id=>document.getElementById(id),pyramida=$('pyramida'),herniPlocha=$('herniPlocha'),prekryvPanel=$('prekryvPanel'),overlayAktivni=$('overlayAktivni'),overlayLevy=$('overlayLevy'),overlayPravy=$('overlayPravy'),vyska=$('vyska'),cifry=$('cifry'),znamenko=$('znamenko'),rezim=$('rezim'),start=$('start'),konec=$('konec'),nastaveni=$('nastaveni'),nastaveniToggle=$('nastaveniToggle'),mazaniHistorie=$('mazaniHistorie'),hlaska=$('hlaska'),historie=$('historie'),SR='pyramida_rezim',SV='pyramida_vyska',SC='pyramida_cifry',SZ='pyramida_znamenko',SH='pyramida_historie',SD='pyramida_historie_datum';
let hraBezi=0,aktivniRadek=null,aktivniIndex=null,vysledky=[],akceBezi=false,pocetChyb=0;
const dnes=()=>{let d=new Date;return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},fmt=v=>{if(v===''||v==null)return'';let s=String(v).replace(/\s/g,''),m=s[0]=='-'?'-':'';s=s.replace('-','');return m+s.replace(/\B(?=(\d{3})+(?!\d))/g,' ')},cis=v=>Number(String(v).replace(/\s/g,'')),pole=(r,i)=>pyramida.querySelector(`input[data-r="${r}"][data-i="${i}"]`);
function jeMobil(){return window.matchMedia('(pointer: coarse)').matches}function jeNastaveniOtevrene(){return !nastaveni.classList.contains('zavreno')}
function nastavStavNastaveni(){let otevreno=jeNastaveniOtevrene();start.disabled=otevreno;konec.disabled=otevreno;nastaveniToggle.classList.toggle('aktivni',otevreno);nastaveniToggle.setAttribute('aria-label',otevreno?'Zavřít nastavení':'Otevřít nastavení')}
function kurzorNaKonecInputu(){overlayAktivni.focus({preventScroll:false});let k=overlayAktivni.value.length;try{overlayAktivni.setSelectionRange(k,k)}catch(e){}}
function prepniMinusVInputu(){if(jeNastaveniOtevrene()||!jeMobil()||znamenko.value!=='pm'||!hraBezi||aktivniRadek==null)return;let v=overlayAktivni.value.replace(/\s/g,'');v=v.startsWith('-')?v.slice(1):'-'+v;overlayAktivni.value=fmt(v);overlayAktivni.classList.remove('spatne');nastavPismoOverlay();overlayAktivni.style.width=sirkaProText(vysledky[aktivniRadek][aktivniIndex])+'px';requestAnimationFrame(kurzorNaKonecInputu)}
function zvetseniPismaOverlay(){let krok=window.innerWidth<=480?1:2;return(8-Number(cifry.value))*krok}function nastavPismoOverlay(){let z=zvetseniPismaOverlay(),mobil=innerWidth<=480;overlayAktivni.style.fontSize=(mobil?24+z:30+z)+'px';overlayLevy.style.fontSize=(mobil?22+z:30+z)+'px';overlayPravy.style.fontSize=(mobil?22+z:30+z)+'px'}
function uloz(){localStorage.setItem(SV,vyska.value);localStorage.setItem(SC,cifry.value);localStorage.setItem(SZ,znamenko.value);localStorage.setItem(SR,document.body.classList.contains('dark')?'dark':'light')}
function nactiHistorii(){let d=dnes();if(localStorage.getItem(SD)!==d){localStorage.setItem(SD,d);localStorage.setItem(SH,'')}historie.innerHTML=localStorage.getItem(SH)||''}
function pridej(z,ch){let d=dnes();if(localStorage.getItem(SD)!==d){localStorage.setItem(SD,d);localStorage.setItem(SH,'')}let tr=`${z}/${ch}`,h=(localStorage.getItem(SH)||'')+`<span class="${ch===0?'hist-ok':''}">${tr}</span>&nbsp;&nbsp;`;localStorage.setItem(SH,h);historie.innerHTML=h}
function vymazHistorii(){localStorage.setItem(SD,dnes());localStorage.setItem(SH,'');historie.innerHTML=''}function mazani(){if(mazaniHistorie.value.trim().toLowerCase()==='vymazat')vymazHistorii();mazaniHistorie.value=''}
function ohnostroj(){let o=document.createElement('div');o.className='ohnostroj';document.body.appendChild(o);[{x:28,y:28},{x:50,y:20},{x:72,y:30},{x:40,y:42},{x:62,y:45}].forEach((v,k)=>{setTimeout(()=>{for(let i=0;i<28;i++){let s=document.createElement('span'),u=Math.random()*Math.PI*2,d=70+Math.random()*90;s.className='jiskra';s.style.setProperty('--x',v.x+'vw');s.style.setProperty('--y',v.y+'vh');s.style.setProperty('--dx',Math.cos(u)*d+'px');s.style.setProperty('--dy',Math.sin(u)*d+'px');s.style.setProperty('--hue',Math.random()*360|0);o.appendChild(s);setTimeout(()=>s.remove(),1e3)}},k*180)});setTimeout(()=>o.remove(),1800)}
function oznacChybnyVysledek(puvodniText){let text=String(puvodniText??'');overlayAktivni.value=text;overlayAktivni.classList.add('spatne');nastavPismoOverlay();if(aktivniRadek!=null)overlayAktivni.style.width=sirkaProText(vysledky[aktivniRadek][aktivniIndex])+'px';requestAnimationFrame(()=>{overlayAktivni.value=text;overlayAktivni.classList.add('spatne');overlayAktivni.focus({preventScroll:false});try{overlayAktivni.setSelectionRange(0,overlayAktivni.value.length)}catch(e){overlayAktivni.select()}})}
function sirkaTextu(text,typ='cela'){text=fmt(String(text??0));let jeMobil=innerWidth<480,meric=document.createElement('span');meric.style.position='fixed';meric.style.left='-9999px';meric.style.top='-9999px';meric.style.visibility='hidden';meric.style.whiteSpace='nowrap';meric.style.fontFamily='Arial, sans-serif';meric.style.fontWeight='800';meric.style.fontSize=getComputedStyle(overlayAktivni).fontSize;meric.textContent=text;document.body.appendChild(meric);let realna=Math.ceil(meric.getBoundingClientRect().width);meric.remove();let w=realna+(jeMobil?50:70);if(typ==='pulka'){let zakladna=pole(+vyska.value,0)?.closest('.radek'),sirkaZakladny=zakladna?Math.floor(zakladna.getBoundingClientRect().width):Math.floor(innerWidth*.9),max=Math.floor(sirkaZakladny/2),min=jeMobil?120:150;return Math.min(Math.max(w,min),max)}let max=Math.min(innerWidth-20,jeMobil?380:620),min=jeMobil?130:160;return Math.min(Math.max(w,min),max)}
function sirkaProText(h){return sirkaTextu(h,'cela')}function sirkaPoloviny(h){return sirkaTextu(h,'pulka')}
function nastavPrekryvPozici(){let vrchol=pole(1,0);if(!vrchol)return;let pr=herniPlocha.getBoundingClientRect(),br=vrchol.getBoundingClientRect(),mezera=innerWidth<=480?8:10;prekryvPanel.style.top=(innerWidth<=480?br.top-pr.top:br.bottom-pr.top+mezera)+'px'}
function zobrazPrekryv(){if(jeNastaveniOtevrene()||aktivniRadek==null)return;nastavPismoOverlay();let a=pole(aktivniRadek,aktivniIndex),l=pole(aktivniRadek+1,aktivniIndex),p=pole(aktivniRadek+1,aktivniIndex+1);if(!a||!l||!p)return;overlayAktivni.value=a.value;overlayLevy.value=l.value;overlayPravy.value=p.value;overlayAktivni.classList.remove('spatne','spravne');let wA=sirkaProText(vysledky[aktivniRadek][aktivniIndex]),wSpodni=Math.max(sirkaPoloviny(l.value),sirkaPoloviny(p.value));overlayAktivni.style.width=wA+'px';overlayLevy.style.width=wSpodni+'px';overlayPravy.style.width=wSpodni+'px';nastavPrekryvPozici();prekryvPanel.classList.add('zobrazen');setTimeout(()=>{if(!jeNastaveniOtevrene()){start.blur();overlayAktivni.focus({preventScroll:false});overlayAktivni.select()}},80)}
function skryjPrekryv(){prekryvPanel.classList.remove('zobrazen');overlayAktivni.value=overlayLevy.value=overlayPravy.value='';overlayAktivni.classList.remove('spatne','spravne')}
function spocitejVysledky(){let R=+vyska.value;vysledky=[];for(let r=1;r<=R;r++)vysledky[r]=[];for(let i=0;i<R;i++)vysledky[R][i]=cis(pole(R,i).value);for(let r=R-1;r>=1;r--)for(let i=0;i<r;i++)vysledky[r][i]=vysledky[r+1][i]+vysledky[r+1][i+1]}
