<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pyramida čísel</title><style>
:root{--bg:#dfe3ea;--card:#eef1f5;--text:#172033;--primary:#4f46e5;--primary2:#818cf8;--inp:#f5f6f8;--bd:#b9c1d1;--dis:#e1e5ec;--bot:#facc15;--botbg:#f3efd7;--ok:#16a34a;--err:#dc2626;--act:#eef2ff}body.dark{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--primary:#818cf8;--primary2:#a5b4fc;--inp:#111827;--bd:#475569;--dis:#1e293b;--bot:#eab308;--botbg:#292517;--ok:#22c55e;--err:#f87171;--act:#1e1b4b}*{box-sizing:border-box}body{font-family:Arial,sans-serif;min-height:100vh;margin:0;color:var(--text);background:linear-gradient(135deg,var(--bg),#cfd5df);display:flex;justify-content:center;padding:18px 10px}.aplikace{position:relative;width:min(100%,860px);background:var(--card);border-radius:28px;padding:24px 14px 30px;box-shadow:0 24px 60px #0002}.hlavicka{position:relative;display:flex;align-items:center;gap:10px;margin-bottom:4px;padding-right:88px}h1{margin:0;font-size:clamp(26px,6vw,42px);letter-spacing:-.04em;white-space:nowrap}.nastaveni-kolo,.rezim{position:absolute;top:0;width:36px;height:36px;border:0;font-size:25px;cursor:pointer;color:inherit;background:transparent;display:flex;align-items:center;justify-content:center}.nastaveni-kolo{right:42px}.rezim{right:0}.nastaveni-kolo.aktivni{color:var(--primary)}.panel-nastaveni{overflow:hidden;max-height:190px;opacity:1;transition:.25s}.nastaveni.zavreno .panel-nastaveni{max-height:0;opacity:0}.nastaveni-radky{display:grid;grid-template-columns:max-content max-content;justify-content:center;align-items:center;gap:8px 10px;margin:8px auto 0}.nastaveni-popisek{font-size:clamp(17px,4.4vw,22px);font-weight:900}.pole{border:1px solid #94a3b880;border-radius:999px;padding:2px 3px;width:clamp(132px,34vw,168px)}select{width:100%;color:var(--text);background:var(--inp);border:1px solid var(--bd);border-radius:999px;font-size:clamp(16px,4vw,20px);font-weight:800;padding:8px;text-align:center}.mazani-historie{width:76px;height:34px;border-radius:999px;border:1px solid var(--bd);background:var(--inp);color:var(--inp);caret-color:var(--primary);font-size:14px;text-align:center}.mazani-historie::placeholder{color:var(--inp)}.mazani-historie:focus{outline:0;border-color:var(--primary)}.hlaska{min-height:22px;margin:2px 0 8px;color:var(--err);font-size:15px;font-weight:800;text-align:center}.herni-plocha{position:relative;width:100%;overflow:visible}.postranni-tlacitko{position:absolute;top:0;z-index:5}.postranni-tlacitko.vlevo{right:calc(50% + 82px)}.postranni-tlacitko.vpravo{left:calc(50% + 82px)}.pyramida{display:flex;flex-direction:column;align-items:center;gap:clamp(5px,1.5vw,10px);min-height:40px}.radek{display:flex;justify-content:center;gap:clamp(3px,1vw,8px);width:100%}.bunka-slot{flex:0 0 clamp(34px,11vw,80px);width:clamp(34px,11vw,80px);height:clamp(40px,11vw,58px)}.bunka-slot input{width:100%;height:100%;color:var(--text);background:var(--inp);font-size:clamp(14px,3.8vw,20px);font-weight:700;text-align:center;border:2px solid var(--bd);border-radius:14px;padding:0 4px}.bunka-slot input.spodni{border-color:var(--bot);background:var(--botbg)}.bunka-slot input.zamcene{background:var(--dis);opacity:.45}.bunka-slot input.spravne{border-color:var(--ok);box-shadow:0 0 0 4px #22c55e2e;opacity:1}.prekryv-panel{position:absolute;left:50%;transform:translateX(-50%);z-index:80;display:none;flex-direction:column;align-items:center;gap:8px;pointer-events:none}.prekryv-panel.zobrazen{display:flex}.prekryv-spodni-wrap{display:flex}.prekryv-input{height:clamp(58px,15vw,82px);color:var(--text);background:var(--inp);font-size:clamp(20px,4.7vw,30px);font-weight:800;text-align:center;border:2px solid var(--bd);border-radius:15px;padding:0 10px;box-shadow:0 8px 20px #0002;pointer-events:auto}.prekryv-input:focus{outline:0;border-color:var(--primary)}#overlayAktivni{background:var(--act);border-color:var(--primary)}#overlayLevy{border-radius:15px 0 0 15px}#overlayPravy{border-radius:0 15px 15px 0}.prekryv-input.spatne{border-color:var(--err)!important;box-shadow:0 0 0 5px #dc262659!important}.prekryv-input.spravne{border-color:var(--ok)!important}.akce{min-width:150px;border:0;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));border-radius:999px;font-size:17px;font-weight:900;letter-spacing:.28em;cursor:pointer;padding:12px 24px}.konec{background:linear-gradient(135deg,#64748b,#94a3b8)}.akce:disabled{opacity:.45}.historie{min-height:24px;margin:14px 0 0;text-align:center;font-size:16px;font-weight:900;color:var(--text);word-spacing:8px}.historie .hist-ok{color:var(--ok)}.ohnostroj{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999}.jiskra{position:absolute;left:var(--x);top:var(--y);width:8px;height:8px;border-radius:50%;background:hsl(var(--h),95%,60%);animation:j .9s ease-out forwards}@keyframes j{to{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}@media(max-width:760px){.herni-plocha{padding-top:54px}.postranni-tlacitko.vlevo{right:calc(50% + 22px)}.postranni-tlacitko.vpravo{left:calc(50% + 22px)}}@media(max-width:480px){body{padding:10px 6px}.aplikace{padding:14px 8px 24px}.hlavicka{padding-right:74px}h1{font-size:clamp(24px,7vw,30px)}.bunka-slot{flex:0 0 calc((100vw - 56px)/7);width:calc((100vw - 56px)/7);height:calc((100vw - 56px)/7);max-width:52px;max-height:52px}.akce{min-width:136px;font-size:15px;padding:11px 18px}}
</style></head><body><main class="aplikace"><header class="hlavicka"><h1>Pyramida čísel</h1><input id="mazaniHistorie" class="mazani-historie" placeholder="Vymazat"><button id="nastaveniToggle" class="nastaveni-kolo">⚙️</button><button id="rezim" class="rezim">🌙</button></header><section id="nastaveni" class="nastaveni zavreno"><div class="panel-nastaveni"><div class="nastaveni-radky"><label class="nastaveni-popisek">výška pyramidy</label><div class="pole"><select id="vyska"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option selected>7</option></select></div><label class="nastaveni-popisek">počet cifer</label><div class="pole"><select id="cifry"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div><label class="nastaveni-popisek">sčítání - sčítání+odčítání</label><div class="pole"><select id="znamenko"><option value="p">+</option><option value="pm">+ -</option></select></div></div></div></section><div id="hlaska" class="hlaska"></div><div class="herni-plocha" id="herniPlocha"><div class="postranni-tlacitko vlevo"><button id="start" class="akce">S T A R T</button></div><div class="pyramida" id="pyramida"></div><div id="prekryvPanel" class="prekryv-panel"><input id="overlayAktivni" class="prekryv-input" inputmode="numeric"><div class="prekryv-spodni-wrap"><input id="overlayLevy" class="prekryv-input" readonly><input id="overlayPravy" class="prekryv-input" readonly></div></div><div class="postranni-tlacitko vpravo"><button id="konec" class="akce konec">K O N E C</button></div></div><div id="historie" class="historie"></div></main><script>
const $=i=>document.getElementById(i),pyramida=$('pyramida'),herniPlocha=$('herniPlocha'),prekryvPanel=$('prekryvPanel'),overlayAktivni=$('overlayAktivni'),overlayLevy=$('overlayLevy'),overlayPravy=$('overlayPravy'),vyska=$('vyska'),cifry=$('cifry'),znamenko=$('znamenko'),rezim=$('rezim'),start=$('start'),konec=$('konec'),nastaveni=$('nastaveni'),nastaveniToggle=$('nastaveniToggle'),mazaniHistorie=$('mazaniHistorie'),hlaska=$('hlaska'),historie=$('historie'),SR='pyramida_rezim',SV='pyramida_vyska',SC='pyramida_cifry',SZ='pyramida_znamenko',SH='pyramida_historie',SD='pyramida_historie_datum';let hraBezi=0,aktivniRadek=null,aktivniIndex=null,vysledky=[],akceBezi=false,pocetChyb=0;
const dnes=()=>{let d=new Date;return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},fmt=v=>{if(v===''||v==null)return'';let s=String(v).replace(/\s/g,''),m=s[0]=='-'?'-':'';s=s.replace('-','');return m+s.replace(/\B(?=(\d{3})+(?!\d))/g,' ')},cis=v=>Number(String(v).replace(/\s/g,'')),pole=(r,i)=>pyramida.querySelector(`input[data-r="${r}"][data-i="${i}"]`),jeNastaveniOtevrene=()=>!nastaveni.classList.contains('zavreno'),jeMobil=()=>matchMedia('(pointer: coarse)').matches;
function uloz(){localStorage.setItem(SV,vyska.value);localStorage.setItem(SC,cifry.value);localStorage.setItem(SZ,znamenko.value);localStorage.setItem(SR,document.body.classList.contains('dark')?'dark':'light')}function nacti(){let v=localStorage.getItem(SV),c=localStorage.getItem(SC),z=localStorage.getItem(SZ),r=localStorage.getItem(SR);if(v)vyska.value=v;if(c)cifry.value=Math.min(+c,8);if(z)znamenko.value=z;document.body.classList.toggle('dark',r==='dark');rezim.textContent=r==='dark'?'☀️':'🌙'}function nactiHistorii(){if(localStorage.getItem(SD)!==dnes()){localStorage.setItem(SD,dnes());localStorage.setItem(SH,'')}historie.innerHTML=localStorage.getItem(SH)||''}function pridej(z,ch){if(localStorage.getItem(SD)!==dnes()){localStorage.setItem(SD,dnes());localStorage.setItem(SH,'')}let tr=`${z}/${ch}`,h=(localStorage.getItem(SH)||'')+`<span class="${ch===0?'hist-ok':''}">${tr}</span>&nbsp;&nbsp;`;localStorage.setItem(SH,h);historie.innerHTML=h}function mazani(){if(mazaniHistorie.value.trim().toLowerCase()==='vymazat'){localStorage.setItem(SD,dnes());localStorage.setItem(SH,'');historie.innerHTML=''}mazaniHistorie.value=''}function nastavStavNastaveni(){let o=jeNastaveniOtevrene();start.disabled=o;konec.disabled=o;nastaveniToggle.classList.toggle('aktivni',o)}
function nahoda(c){let n=Math.floor(Math.random()*(10**c-1))+1;if(znamenko.value==='pm'&&Math.random()<.5)n=-n;return n}function spocitejVysledky(){let R=+vyska.value;vysledky=[];for(let r=1;r<=R;r++)vysledky[r]=[];for(let i=0;i<R;i++)vysledky[R][i]=cis(pole(R,i).value);for(let r=R-1;r>=1;r--)for(let i=0;i<r;i++)vysledky[r][i]=vysledky[r+1][i]+vysledky[r+1][i+1]}function sirkaTextu(t){return Math.min(Math.max(String(fmt(t)).length*18+80,130),innerWidth-20)}function nastavPrekryvPozici(){let v=pole(1,0);if(!v)return;let a=herniPlocha.getBoundingClientRect(),b=v.getBoundingClientRect();prekryvPanel.style.top=(innerWidth<=480?b.top-a.top:b.bottom-a.top+10)+'px'}function zobrazPrekryv(){if(jeNastaveniOtevrene()||aktivniRadek==null)return;let a=pole(aktivniRadek,aktivniIndex),l=pole(aktivniRadek+1,aktivniIndex),p=pole(aktivniRadek+1,aktivniIndex+1);overlayAktivni.value=a.value;overlayLevy.value=l.value;overlayPravy.value=p.value;overlayAktivni.classList.remove('spatne','spravne');overlayAktivni.style.width=sirkaTextu(vysledky[aktivniRadek][aktivniIndex])+'px';overlayLevy.style.width=overlayPravy.style.width=Math.max(sirkaTextu(l.value),sirkaTextu(p.value),120)+'px';nastavPrekryvPozici();prekryvPanel.classList.add('zobrazen');setTimeout(()=>{overlayAktivni.focus();overlayAktivni.select()},50)}function skryjPrekryv(){prekryvPanel.classList.remove('zobrazen');overlayAktivni.value=overlayLevy.value=overlayPravy.value='';overlayAktivni.classList.remove('spatne','spravne')}
function aktivuj(r,i){aktivniRadek=r;aktivniIndex=i;pyramida.querySelectorAll('input').forEach(x=>{if(!x.classList.contains('spodni')&&!x.classList.contains('spravne'))x.classList.add('zamcene')});let a=pole(r,i);a.classList.remove('zamcene','spatne');zobrazPrekryv()}function dalsi(){if(aktivniIndex+1<aktivniRadek)return{r:aktivniRadek,i:aktivniIndex+1};if(aktivniRadek-1>=1)return{r:aktivniRadek-1,i:0};return null}
function vytvor(gen){pyramida.innerHTML='';hlaska.textContent='';skryjPrekryv();vysledky=[];if(gen)pocetChyb=0;let R=+vyska.value,C=Math.min(+cifry.value,8);cifry.value=C;for(let r=1;r<=R;r++){let row=document.createElement('div');row.className='radek';for(let i=0;i<r;i++){let s=document.createElement('div'),x=document.createElement('input');s.className='bunka-slot';x.type='text';x.inputMode='numeric';x.dataset.r=r;x.dataset.i=i;if(r===R){x.className='spodni';x.readOnly=1;x.value=gen?fmt(nahoda(C)):''}else if(gen){x.className='zamcene';x.readOnly=1} s.appendChild(x);row.appendChild(s)}pyramida.appendChild(row)}hraBezi=!!gen;start.textContent=gen?'D A L Š Í':'S T A R T';aktivniRadek=aktivniIndex=null;if(gen){spocitejVysledky();aktivuj(R-1,0)}}
function oznac(t){overlayAktivni.value=t;overlayAktivni.classList.add('spatne');setTimeout(()=>{overlayAktivni.focus();overlayAktivni.select()},20)}
function kontrola(){if(jeNastaveniOtevrene())return;hlaska.textContent='';let h=overlayAktivni.value;overlayAktivni.classList.remove('spatne');if(!h.trim()||h.trim()==='-')return;if(!/^-?[0-9 ]*$/.test(h)){hlaska.textContent='Nepovolený znak!';oznac(h);return}let ok=vysledky[aktivniRadek][aktivniIndex],z=cis(h);if(z===ok){let s=pole(aktivniRadek,aktivniIndex);s.value=fmt(z);s.classList.add('spravne');overlayAktivni.value=fmt(z);overlayAktivni.classList.add('spravne');let d=dalsi();if(d)aktivuj(d.r,d.i);else{skryjPrekryv();hraBezi=0;aktivniRadek=aktivniIndex=null;start.textContent='S T A R T';pridej(`${vyska.value}/${cifry.value}/${znamenko.value==='pm'?'+-':'+'}`,pocetChyb);ohnostroj()}}else{pocetChyb++;oznac(h)}}
function konecHry(){hraBezi=0;aktivniRadek=aktivniIndex=null;start.textContent='S T A R T';skryjPrekryv();vytvor(0)}function akce(){if(jeNastaveniOtevrene()||akceBezi)return;akceBezi=1;mazani();uloz();hraBezi?kontrola():vytvor(1);setTimeout(()=>akceBezi=0,80)}function ohnostroj(){let o=document.createElement('div');o.className='ohnostroj';document.body.appendChild(o);for(let k=0;k<5;k++)setTimeout(()=>{for(let i=0;i<28;i++){let s=document.createElement('span'),u=Math.random()*6.28,d=70+Math.random()*90;s.className='jiskra';s.style.setProperty('--x',20+Math.random()*60+'vw');s.style.setProperty('--y',20+Math.random()*30+'vh');s.style.setProperty('--dx',Math.cos(u)*d+'px');s.style.setProperty('--dy',Math.sin(u)*d+'px');s.style.setProperty('--h',Math.random()*360);o.appendChild(s);setTimeout(()=>s.remove(),1e3)}},k*180);setTimeout(()=>o.remove(),1800)}
overlayAktivni.oninput=function(){this.classList.remove('spatne');let b=this.value.replace(/\s/g,'');if(/^-?\d*$/.test(b))this.value=fmt(b)};overlayAktivni.onpointerdown=e=>{if(jeMobil()&&znamenko.value==='pm'&&hraBezi&&aktivniRadek!=null){e.preventDefault();let v=overlayAktivni.value.replace(/\s/g,'');overlayAktivni.value=fmt(v.startsWith('-')?v.slice(1):'-'+v);overlayAktivni.focus()}};nastaveniToggle.onclick=()=>{mazani();nastaveni.classList.toggle('zavreno');nastavStavNastaveni();jeNastaveniOtevrene()?skryjPrekryv():hraBezi&&zobrazPrekryv();uloz()};[vyska,cifry,znamenko].forEach(e=>e.onchange=()=>{mazani();uloz();konecHry()});mazaniHistorie.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();mazani()}};start.onclick=akce;konec.onclick=()=>{if(!jeNastaveniOtevrene()){mazani();konecHry()}};rezim.onclick=()=>{mazani();document.body.classList.toggle('dark');rezim.textContent=document.body.classList.contains('dark')?'☀️':'🌙';uloz()};document.onkeydown=e=>{if(e.key==='Enter'&&document.activeElement!==mazaniHistorie){e.preventDefault();akce()}};onresize=()=>{if(hraBezi&&!jeNastaveniOtevrene())zobrazPrekryv()};nacti();nactiHistorii();vytvor(0);nastavStavNastaveni();
</script></body></html>
