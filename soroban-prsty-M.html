<!DOCTYPE html>
<!-- Verze nahrána: 21.08.2026 08:19 -->
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1c1e">
<title>Soroban-prsty-M</title>
<style>
  :root{--bg:#000;--t:#f5f5f7;--c:#1c1c1e;}
  *{box-sizing:border-box;font-family:-apple-system,sans-serif;margin:0;padding:0;}
  body{background:var(--c);color:var(--t);display:flex;justify-content:center;align-items:center;min-height:100vh;}

  .app-wrap{
    display:flex;flex-direction:column;align-items:center;
    gap:240px;
  }

  .sum-block{
    display:flex;flex-direction:column;align-items:center;
    gap:14px;
    margin-top:170px;
  }
  .sum-total{
    font-size:88px;font-weight:bold;color:var(--t);
    text-align:center;min-height:1.2em;
  }
  .sum-formula{
    display:flex;align-items:baseline;justify-content:center;
    font-size:44px;font-weight:bold;color:var(--t);
    text-align:center;min-height:1.2em;
    letter-spacing:.5px;
  }
  .sum-tens{color:#5ac8fa;}
  .sum-ones{color:#ff9f0a;}
  .sum-gap{
    display:inline-flex;justify-content:center;
    width:140px;flex-shrink:0;
  }

  .finger-grid{
    display:flex;
    flex-direction:row;
    align-items:flex-end;
    justify-content:center;
    column-gap:132px;
    touch-action:manipulation;
  }
  .finger-group{
    display:flex;
    flex-direction:row;
    align-items:flex-end;
    column-gap:21px;
    height:calc(60px * 2);
  }
  .finger-sq{
    width:84px;height:60px;background:#e0ac8b;border:none;border-radius:18px;
    user-select:none;-webkit-tap-highlight-color:transparent;
    transform-origin:bottom center;
    transition:transform .18s ease,background-color .18s ease,box-shadow .18s ease;
    box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 3px 10px rgba(0,0,0,.28);
    cursor:pointer;
  }
  .finger-sq.on{
    background:#c98a63;transform:scaleY(4);
    box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 8px 18px rgba(0,0,0,.35);
  }
  .finger-sq.finger-big.on{
    transform:scaleY(5);
  }
  .finger-sq.finger-small.on{
    transform:scaleY(3.4);
  }
  .finger-sq.finger-first{
    transform:translateY(270%) rotate(-45deg);
  }
  .finger-sq.finger-first.on{
    transform:translateY(270%) rotate(-45deg) scaleY(4);
  }
  .finger-sq.finger-last{
    transform:translateY(270%) rotate(45deg);
  }
  .finger-sq.finger-last.on{
    transform:translateY(270%) rotate(45deg) scaleY(4);
  }
  .finger-sq.finger-first,
  .finger-sq.finger-last{
    width:101px;
  }

  .finger-col{position:relative;}
  .finger-value{
    position:absolute;top:100%;left:50%;
    transform:translateX(-50%);
    margin-top:12px;
    font-size:24px;font-weight:bold;
    color:#ffd60a;
    opacity:0;transition:opacity .18s ease;
    pointer-events:none;white-space:nowrap;
  }
  .finger-value.finger-value-thumb{
    margin-top:calc(12px + (60px * 2.7));
  }
  .finger-value.finger-value-first{
    transform:translateX(calc(-50% + 20px));
  }
  .finger-value.finger-value-last{
    transform:translateX(calc(-50% - 20px));
  }
  .finger-sq.on ~ .finger-value{opacity:1;}

  @media (max-width:520px){
    .finger-grid{column-gap:96px;}
    .finger-group{column-gap:15px;height:calc(54px * 2);}
    .finger-sq{width:72px;height:54px;}
    .finger-sq.finger-first,
    .finger-sq.finger-last{width:86px;}
    .finger-value{font-size:21px;}
    .finger-value.finger-value-thumb{margin-top:calc(12px + (54px * 2.7));}
    .sum-total{font-size:68px;}
    .sum-formula{font-size:34px;}
    .sum-gap{width:100px;}
    .app-wrap{gap:200px;}
  }
  @media (max-width:390px){
    .finger-grid{column-gap:66px;}
    .finger-group{column-gap:12px;height:calc(51px * 2);}
    .finger-sq{width:63px;height:51px;}
    .finger-sq.finger-first,
    .finger-sq.finger-last{width:76px;}
    .finger-value{font-size:19px;}
    .finger-value.finger-value-thumb{margin-top:calc(12px + (51px * 2.7));}
    .sum-total{font-size:58px;}
    .sum-formula{font-size:30px;}
    .sum-gap{width:84px;}
    .app-wrap{gap:190px;}
  }

  .addend-btn{
    position:fixed;
    top:0;left:0;
    background:#2c2c2e;color:var(--t);
    border:1px solid #48484a;border-radius:16px;
    font-size:30px;font-weight:bold;
    padding:16px 10px;
    text-align:center;white-space:nowrap;
    cursor:pointer;
  }
  .addend-btn:active{background:#3a3a3c;}

  .addend-part{
    position:fixed;top:0;left:0;
    font-size:110px;font-weight:bold;color:var(--t);
    white-space:nowrap;
    pointer-events:none;
  }
  #addend-plus{
    pointer-events:auto;cursor:pointer;
    user-select:none;-webkit-tap-highlight-color:transparent;
  }

  @media (max-width:520px){
    .addend-btn{font-size:23px;padding:12px 8px;}
    .addend-part{font-size:84px;}
  }
  @media (max-width:390px){
    .addend-btn{font-size:19px;padding:10px 6px;}
    .addend-part{font-size:70px;}
  }

  .fs-btn{
    position:fixed;top:14px;right:14px;
    width:44px;height:44px;
    background:#2c2c2e;border:1px solid #48484a;border-radius:12px;
    color:var(--t);font-size:20px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:1000;
    opacity:.55;transition:opacity .15s ease;
  }
  .fs-btn:hover,.fs-btn:active{opacity:1;}

  #fw-layer{
    position:fixed;inset:0;
    pointer-events:none;z-index:2000;
    overflow:hidden;
  }
  .fw-particle{
    position:fixed;width:10px;height:10px;border-radius:50%;
    pointer-events:none;
  }
</style>
</head>
<body data-theme="dark">
  <button id="fs-btn" class="fs-btn" title="Celá obrazovka">⛶</button>
  <div id="fw-layer"></div>
  <button id="btn-left" class="addend-btn">dvouciferné číslo</button>
  <button id="btn-right" class="addend-btn">jednociferné číslo</button>
  <button id="btn-reset" class="addend-btn">vynulovat</button>
  <span id="addend-a" class="addend-part"></span>
  <span id="addend-plus" class="addend-part">+</span>
  <span id="addend-b" class="addend-part"></span>
  <div class="app-wrap">
    <div class="sum-block">
      <div class="sum-total" id="sum-total">0</div>
      <div class="sum-formula" id="sum-formula"></div>
    </div>
    <div class="finger-grid" id="finger-grid"></div>
  </div>

  <script>
    const grid = document.getElementById('finger-grid');
    const sumTotal = document.getElementById('sum-total');
    const sumFormula = document.getElementById('sum-formula');
    const topValues = [50,10,10,10,10];
    const bottomValues = [1,1,1,1,5];

    function updateSum(){
      const squares = document.querySelectorAll('.finger-sq');
      let thumb50=false, tensCount=0, thumb5=false, onesCount=0;

      squares.forEach(el=>{
        if(!el.classList.contains('on')) return;
        const v = Number(el.dataset.value);
        if(v===50) thumb50=true;
        else if(v===10) tensCount++;
        else if(v===5) thumb5=true;
        else if(v===1) onesCount++;
      });

      const total = (thumb50?50:0) + tensCount*10 + (thumb5?5:0) + onesCount*1;

      const tensParts=[];
      if(thumb50) tensParts.push('<span class="sum-tens">50</span>');
      if(tensCount>0) tensParts.push(tensCount>1?`${tensCount} x&nbsp;<span class="sum-tens">10</span>`:'<span class="sum-tens">10</span>');

      const onesParts=[];
      if(thumb5) onesParts.push('<span class="sum-ones">5</span>');
      if(onesCount>0) onesParts.push(onesCount>1?`${onesCount} x&nbsp;<span class="sum-ones">1</span>`:'<span class="sum-ones">1</span>');

      const groups=[tensParts.join('&nbsp;+&nbsp;'), onesParts.join('&nbsp;+&nbsp;')].filter(Boolean);

      sumTotal.textContent = String(total);
      sumFormula.innerHTML = groups.join('<span class="sum-gap">+</span>');

      if(targetSum!==null && total===targetSum){
        if(!celebrated){
          celebrated = true;
          triggerFireworks();
        }
      } else {
        celebrated = false;
      }
    }

    let targetSum = null;
    let celebrated = false;

    function triggerFireworks(){
      const layer = document.getElementById('fw-layer');
      const originX = window.innerWidth/2;
      const originY = window.innerHeight/2;
      const colors = ['#ff453a','#ff9f0a','#ffd60a','#32d74b','#5ac8fa','#bf5af2'];
      const count = 60;
      for(let i=0;i<count;i++){
        const el = document.createElement('div');
        el.className = 'fw-particle';
        const angle = Math.random()*Math.PI*2;
        const dist = 220 + Math.random()*340;
        const dx = Math.cos(angle)*dist;
        const dy = Math.sin(angle)*dist;
        const size = 10 + Math.random()*8;
        el.style.width = size+'px';
        el.style.height = size+'px';
        el.style.background = colors[Math.floor(Math.random()*colors.length)];
        el.style.left = originX+'px';
        el.style.top = originY+'px';
        layer.appendChild(el);
        const anim = el.animate([
          { transform:'translate(-50%,-50%) translate(0,0) scale(1)', opacity:1 },
          { transform:`translate(-50%,-50%) translate(${dx}px, ${dy}px) scale(.3)`, opacity:0 }
        ], { duration: 1200+Math.random()*500, easing:'cubic-bezier(.15,.6,.25,1)' });
        anim.onfinish = () => el.remove();
      }
    }

    function buildGroup(values, bigIndex, smallIndices, firstIndex, lastIndex){
      const group = document.createElement('div');
      group.className = 'finger-group';
      values.forEach((v, i) => {
        const col = document.createElement('div');
        col.className = 'finger-col';

        const el = document.createElement('div');
        el.className = 'finger-sq';
        if(i === bigIndex) el.classList.add('finger-big');
        if(smallIndices.includes(i)) el.classList.add('finger-small');
        if(i === firstIndex) el.classList.add('finger-first');
        if(i === lastIndex) el.classList.add('finger-last');
        el.dataset.value = String(v);
        el.addEventListener('click', () => {
          el.classList.toggle('on');
          updateSum();
        });

        const label = document.createElement('div');
        label.className = 'finger-value';
        if(i === firstIndex) label.classList.add('finger-value-thumb', 'finger-value-first');
        if(i === lastIndex) label.classList.add('finger-value-thumb', 'finger-value-last');
        label.textContent = String(v);

        col.appendChild(el);
        col.appendChild(label);
        group.appendChild(col);
      });
      return group;
    }

    grid.appendChild(buildGroup(topValues, 2, [4], 0, null));
    grid.appendChild(buildGroup(bottomValues, 2, [0], null, 4));

    function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

    function generatePair(minSum,maxSum,minAddend,maxAddend){
      const sum = randInt(minSum,maxSum);
      const lo = Math.max(minAddend, sum-maxAddend);
      const hi = Math.min(maxAddend, sum-minAddend);
      const a = randInt(lo,hi);
      const b = sum-a;
      return [a,b];
    }

    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnReset = document.getElementById('btn-reset');
    const addendA = document.getElementById('addend-a');
    const addendPlus = document.getElementById('addend-plus');
    const addendB = document.getElementById('addend-b');

    function resetFingers(){
      document.querySelectorAll('.finger-sq.on').forEach(el => el.classList.remove('on'));
      updateSum();
    }

    function resetExercise(){
      resetFingers();
      addendA.textContent = '';
      addendB.textContent = '';
      targetSum = null;
      celebrated = false;
      layoutAddendButtons();
    }

    function showPair(a, b){
      if(operatorOn){
        const hi = Math.max(a,b), lo = Math.min(a,b);
        addendA.textContent = String(hi);
        addendB.textContent = String(lo);
        targetSum = hi-lo;
      } else {
        addendA.textContent = String(a);
        addendB.textContent = String(b);
        targetSum = a+b;
      }
      celebrated = false;
      layoutAddendButtons();
    }

    function generateAndShow(minSum,maxSum,minAddend,maxAddend){
      resetFingers();
      let a,b;
      if(operatorOn){
        do {
          [a,b] = generatePair(minSum,maxSum,minAddend,maxAddend);
        } while(a===b);
      } else {
        [a,b] = generatePair(minSum,maxSum,minAddend,maxAddend);
      }
      showPair(a,b);
    }

    function rollLeft(){
      generateAndShow(10,99,1,98);
    }
    function rollRight(){
      generateAndShow(2,9,1,8);
    }
    btnLeft.addEventListener('click', rollLeft);
    btnRight.addEventListener('click', rollRight);

    function layoutAddendButtons(){
      const thumb50 = document.querySelector('.finger-sq.finger-first');
      const thumb5 = document.querySelector('.finger-sq.finger-last');
      if(!thumb50 || !thumb5) return;

      const rect50 = thumb50.getBoundingClientRect();
      const rect5 = thumb5.getBoundingClientRect();
      const sumRect = sumTotal.getBoundingClientRect();

      const fontSize = parseFloat(getComputedStyle(btnLeft).fontSize);
      const lineHeight = fontSize * 1.4;
      const gap = 2 * lineHeight;

      btnLeft.style.minWidth = '';
      btnRight.style.minWidth = '';
      const width = Math.max(btnLeft.offsetWidth, btnRight.offsetWidth);
      btnLeft.style.minWidth = width+'px';
      btnRight.style.minWidth = width+'px';

      const height = Math.max(btnLeft.offsetHeight, btnRight.offsetHeight);
      const formulaRect = sumFormula.getBoundingClientRect();
      const buttonsTop = formulaRect.top + formulaRect.height/2 - height/2;

      btnLeft.style.top = buttonsTop+'px';
      btnRight.style.top = buttonsTop+'px';
      btnLeft.style.left = rect50.left+'px';
      btnRight.style.left = (rect5.right - width)+'px';

      const exerciseTop = sumRect.top - gap - height;
      const centerX = sumRect.left + sumRect.width/2;
      const centerY = exerciseTop + height/2;
      const plusFontSize = parseFloat(getComputedStyle(addendPlus).fontSize);
      const numGap = plusFontSize * 0.35;

      addendPlus.style.left = centerX+'px';
      addendPlus.style.top = centerY+'px';
      addendPlus.style.transform = 'translate(-50%,-50%)';

      const plusHalfWidth = addendPlus.offsetWidth/2;

      addendA.style.left = 'auto';
      addendA.style.right = (window.innerWidth - (centerX - plusHalfWidth - numGap))+'px';
      addendA.style.top = centerY+'px';
      addendA.style.transform = 'translateY(-50%)';

      addendB.style.right = 'auto';
      addendB.style.left = (centerX + plusHalfWidth + numGap)+'px';
      addendB.style.top = centerY+'px';
      addendB.style.transform = 'translateY(-50%)';

      const resetCenterX = (rect50.right + rect5.left) / 2;
      const resetCenterY = (rect50.top + rect50.bottom) / 2;
      btnReset.style.left = (resetCenterX - btnReset.offsetWidth/2)+'px';
      btnReset.style.top = (resetCenterY - btnReset.offsetHeight/2)+'px';
    }

    btnReset.addEventListener('click', resetFingers);

    let operatorOn = false;
    addendPlus.addEventListener('click', () => {
      operatorOn = !operatorOn;
      addendPlus.textContent = operatorOn ? '-' : '+';
      resetExercise();
    });

    layoutAddendButtons();
    window.addEventListener('resize', layoutAddendButtons);
    window.addEventListener('load', layoutAddendButtons);

    const fsBtn = document.getElementById('fs-btn');
    fsBtn.addEventListener('click', () => {
      if(!document.fullscreenElement){
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        document.exitFullscreen();
      }
    });
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? '✕' : '⛶';
    });
  </script>
</body>
</html>
