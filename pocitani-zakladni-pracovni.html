<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Trénink počítání</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', '"Courier New"', 'monospace'],
                    },
                },
            },
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .zelene {
            background-color: #15803d !important;
            border-color: #22c55e !important;
            color: #ffffff !important;
        }
        .cervene {
            background-color: #b91c1c !important;
            border-color: #ef4444 !important;
            color: #ffffff !important;
        }
        input {
            /* Ponecháno výchozí */
        }
        /* Skrytí "x" pro mazání ve vstupním poli */
        #odpoved::-webkit-search-cancel-button {
            -webkit-appearance: none;
            appearance: none;
            display: none;
        }
        #odpoved::-webkit-search-decoration,
        #odpoved::-webkit-search-results-button,
        #odpoved::-webkit-search-results-decoration {
            display: none;
        }
        .math-text {
            white-space: pre;
            line-height: 1.25;
            display: block;
            font-variant-numeric: tabular-nums;
        }
        .worksheet-bg {
            background-color: #e2e8f0;
            background-image: radial-gradient(circle, #94a3b8 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .dark .worksheet-bg {
            background-color: rgba(30, 41, 59, 0.4);
            background-image: radial-gradient(circle, #334155 1px, transparent 1px);
        }
        .btn-pulse {
            animation: pulse-blue 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-blue {
            0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.45); }
            50% { box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
        }
        .btn-glow-emerald {
            animation: glow-emerald 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes glow-emerald {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.45); }
            50% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
        }
        #tlacitko { position: relative; }
        #tlacitko.state-start::before {
            content: '▶';
            display: inline-block;
            margin-right: 0.4rem;
            font-size: 0.8em;
        }
        #tlacitko.state-result::before {
            content: '✓';
            display: inline-block;
            margin-right: 0.4rem;
            font-size: 0.85em;
            font-weight: 900;
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
            40%, 60% { transform: translate3d(3px, 0, 0); }
        }
        .slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pop {
            animation: pop 0.2s ease-out;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .settings-panel {
            max-height: 150px;
            opacity: 1;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.25s ease, margin 0.3s ease;
        }
        .settings-panel.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            pointer-events: none;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @media (prefers-reduced-motion: reduce) {
            .shake, .pop, .slide-up, .fade-in { animation: none !important; }
            #tlacitko.btn-pulse, #tlacitko.btn-glow-emerald { animation: none !important; }
        }

        .score-bar {
            position: sticky;
            top: 0;
            z-index: 40;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>

    <!-- ═══════ GLOBÁLNÍ FUNKCE PRO HISTORII (Dostupné okamžitě) ═══════ -->
    <script>
        // Pomocné funkce – dostupné globálně
        function formatujCislo(x) {
            if (typeof x === 'bigint') return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            if (typeof x !== 'number') return String(x);
            if (Number.isInteger(x)) return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            const [cela, des] = x.toString().split('.');
            const celaFmt = cela.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return des ? `${celaFmt}.${des}` : celaFmt;
        }

        function zkratNa4Desetinna(cislo) {
            const str = cislo.toString();
            const [cela, des] = str.split('.');
            if (!des) return cela;
            const desZkracena = des.substring(0, 4); // Jen ořízne, NEZAOKROUHLUJE!
            return desZkracena ? `${cela}.${desZkracena}` : cela;
        }

        // Globální proměnná pro aktuální příklad
        let aktualniPriklad = null;

        // === HISTORIE – Ukládání a načítání ===
        const STORAGE_KEY = 'matika_trenink_v2';

        function getTodayString() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return null;
                const state = JSON.parse(raw);
                if (state.date !== getTodayString()) {
                    localStorage.removeItem(STORAGE_KEY);
                    return null;
                }
                return state;
            } catch (e) {
                return null;
            }
        }

        function saveState(correct, wrong, streak, history) {
            const state = {
                date: getTodayString(),
                correct,
                wrong,
                streak,
                history
            };
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {}
        }

        // Globální funkce pro přidání do historie (volána z logiky)
        window.addHistory = function(isCorrect) {
            if (!aktualniPriklad) return;
            const p = aktualniPriklad;
            const vysl = p.vysledekZobrazeny !== undefined ? p.vysledekZobrazeny : p.vysledek;
            const text = `${formatujCislo(p.a)} ${p.op} ${formatujCislo(p.b)} = ${formatujCislo(vysl)}`;
            // Načteme aktuální stav
            const state = loadState() || { correct: 0, wrong: 0, streak: 0, history: [] };
            if (isCorrect) {
                state.correct++;
                state.streak++;
            } else {
                state.wrong++;
                state.streak = 0;
            }
            state.history.unshift({ text, correct: isCorrect });
            saveState(state.correct, state.wrong, state.streak, state.history);
            // Pokud je DOM připraven, aktualizujeme UI
            if (document.readyState === 'loading') return;
            renderHistory(state.history);
            updateScores(state.correct, state.wrong, state.streak);
        };

        window.clearHistory = function() {
            localStorage.removeItem(STORAGE_KEY);
            if (document.readyState === 'loading') return;
            renderHistory([]);
            updateScores(0, 0, 0);
        };

        // Tyto funkce budou volány až po načtení DOM
        function renderHistory(history) {
            const container = document.getElementById('historyContainer');
            const list = document.getElementById('historyList');
            const empty = document.getElementById('historyEmpty');
            if (!container || !list || !empty) return;

            if (history.length === 0) {
                empty.style.display = 'block';
                container.style.opacity = '0';
                while (list.firstChild) list.removeChild(list.firstChild);
                return;
            }
            empty.style.display = 'none';
            container.style.opacity = '1';
            while (list.firstChild) list.removeChild(list.firstChild);
            history.forEach((h, i) => {
                const item = document.createElement('div');
                item.className = `history-item px-2.5 py-1 rounded-md text-[11px] font-mono font-bold border ${
                    h.correct
                        ? 'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300'
                        : 'bg-rose-50 dark:bg-rose-900/20 border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300'
                }`;
                item.textContent = h.text;
                list.appendChild(item);
            });
        }

        function updateScores(correct, wrong, streak) {
            const scoreCorrect = document.getElementById('scoreCorrect');
            const scoreWrong = document.getElementById('scoreWrong');
            const streakCount = document.getElementById('streakCount');
            if (scoreCorrect) scoreCorrect.textContent = correct;
            if (scoreWrong) scoreWrong.textContent = wrong;
            if (streakCount) {
                streakCount.textContent = streak;
                streakCount.parentElement.classList.add('pop');
                setTimeout(() => {
                    if (streakCount.parentElement) streakCount.parentElement.classList.remove('pop');
                }, 200);
            }
        }

        // Načtení historie po načtení stránky
        document.addEventListener('DOMContentLoaded', function() {
            const state = loadState() || { correct: 0, wrong: 0, streak: 0, history: [] };
            updateScores(state.correct, state.wrong, state.streak);
            renderHistory(state.history);

            const currentDateEl = document.getElementById('currentDate');
            if (currentDateEl) {
                const today = getTodayString();
                const [year, month, day] = today.split('-');
                const months = ['ledna', 'února', 'března', 'dubna', 'května', 'června', 'července', 'srpna', 'září', 'října', 'listopadu', 'prosince'];
                const dayNum = parseInt(day, 10);
                const monthIndex = parseInt(month, 10) - 1;
                const weekdays = ['Neděle', 'Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota'];
                const weekday = weekdays[new Date(year, monthIndex, dayNum).getDay()];
                currentDateEl.textContent = `${weekday} ${dayNum}. ${months[monthIndex]} ${year}`;
            }
        });
    </script>

    <!-- ═══════ HLAVNÍ LOGIKA APLIKACE ═══════ -->
    <script>
        let isProcessing = false;
        let zobrazitVysledek = false;

        const operaceEl = document.getElementById('operace');
        const cislice1El = document.getElementById('cislice1');
        const cislice2El = document.getElementById('cislice2');
        const chybaEl = document.getElementById('chyba');
        const prikladEl = document.getElementById('priklad');
        const caraEl = document.getElementById('cara');
        const odpovedEl = document.getElementById('odpoved');
        const tlacitkoEl = document.getElementById('tlacitko');
        const divisionInfo = document.getElementById('divisionInfo');

        function normalizuj(vstup) {
            return vstup.trim().replace(/\s+/g, '').replace(',', '.');
        }

        function generujCislo(n) {
            const min = Math.pow(10, n - 1);
            const max = Math.pow(10, n) - 1;
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function aktualizujCislici2() {
            const op = operaceEl.value;
            const firstVal = parseInt(cislice1El.value);
            const options = cislice2El.options;
            for (let i = 0; i < options.length; i++) {
                const val = parseInt(options[i].value);
                options[i].disabled = (op === '-' && val > firstVal);
            }
            if (parseInt(cislice2El.value) > firstVal && op === '-') {
                cislice2El.value = firstVal;
            }
        }

        function naplnSelecty() {
            for (let i = 1; i <= 9; i++) {
                cislice1El.innerHTML += `<option value="${i}">${i}</option>`;
                cislice2El.innerHTML += `<option value="${i}">${i}</option>`;
            }
            cislice1El.value = '2';
            cislice2El.value = '1';
            aktualizujCislici2();
        }

        operaceEl.addEventListener('change', () => {
            aktualizujCislici2();
            chybaEl.textContent = '';
            if (operaceEl.value === '/') {
                divisionInfo.classList.remove('hidden');
            } else {
                divisionInfo.classList.add('hidden');
            }
        });

        cislice1El.addEventListener('change', () => {
            aktualizujCislici2();
        });

        function vygenerujPriklad() {
            const op = operaceEl.value;
            const n1 = parseInt(cislice1El.value);
            const n2 = parseInt(cislice2El.value);
            chybaEl.textContent = '';

            if (op === '-' && n1 < n2) {
                chybaEl.textContent = '❌ Při odčítání musí mít první číslo alespoň tolik cifer jako druhé.';
                return null;
            }

            let a, b, pokusy = 0;
            while (pokusy < 1000) {
                pokusy++;
                a = generujCislo(n1);
                b = n2 === 1 ? Math.floor(Math.random() * 8) + 2 : generujCislo(n2);
                if (op === '-' && a <= b) continue;
                if (op === '/' && b === 0) continue;
                break;
            }
            let vysledek, vysledekZobrazeny;
            if (op === '+') {
                vysledek = a + b;
                vysledekZobrazeny = vysledek;
            } else if (op === '-') {
                vysledek = a - b;
                vysledekZobrazeny = vysledek;
            } else if (op === '*') {
                vysledek = BigInt(a) * BigInt(b);
                vysledekZobrazeny = vysledek;
            } else if (op === '/') {
                vysledek = a / b;
                vysledekZobrazeny = zkratNa4Desetinna(vysledek); // Jen ořízne!
            }
            aktualniPriklad = { a, b, op, vysledek, vysledekZobrazeny };
            return aktualniPriklad;
        }

        function zobrazPriklad(p) {
            const fa = formatujCislo(p.a);
            const fb = formatujCislo(p.b);
            const fv = formatujCislo(p.vysledekZobrazeny !== undefined ? p.vysledekZobrazeny : p.vysledek);
            const max = Math.max(fa.length, (p.op + ' ' + fb).length, fv.length);
            prikladEl.textContent = `${fa.padStart(max)}\n${(p.op + ' ' + fb).padStart(max)}`;
            caraEl.style.opacity = '0';
        }

        function ukazCaru() {
            caraEl.style.opacity = '1';
        }

        function aktivujPole() {
            odpovedEl.focus();
        }

        function updateBtnDisable() {
            tlacitkoEl.disabled = false;
        }

        function aktualizujTextTlacitka() {
            if (!aktualniPriklad) {
                tlacitkoEl.textContent = 'ZAČÍT';
            } else if (!zobrazitVysledek) {
                tlacitkoEl.textContent = 'DALŠÍ PŘÍKLAD';
            } else {
                tlacitkoEl.textContent = 'VÝSLEDEK(kontrola)';
            }
            updateBtnDisable();
        }

        odpovedEl.addEventListener('input', updateBtnDisable);

        function jePlatneCislo(vstup) {
            if (vstup === '') return false;
            const norm = normalizuj(vstup);
            if (norm === '') return false;
            return /^-?\d+([.,]\d*)?$/.test(norm);
        }

        function zkontrolujOdpoved(uzivatelskaOdpoved, priklad) {
            const norm = normalizuj(uzivatelskaOdpoved);
            if (norm === '') return false;
            
            if (priklad.op === '/') {
                const userNum = parseFloat(norm);
                if (isNaN(userNum)) return false;
                
                const trueTruncated = zkratNa4Desetinna(priklad.vysledek);
                const trueNum = parseFloat(trueTruncated);
                
                const userStr = norm;
                const [userCela, userDes = ''] = userStr.split('.');
                const userDesTruncated = userDes.substring(0, 4);
                
                const userNumTruncated = parseFloat(userDesTruncated ? `${userCela}.${userDesTruncated}` : userCela);
                
                const userDecimals = userDes.length;
                if (userDecimals >= 3 && userDecimals <= 4) {
                    const trueDesTruncated = zkratNa4Desetinna(priklad.vysledek).split('.')[1] || '';
                    const trueDesToMatch = trueDesTruncated.substring(0, userDecimals);
                    const trueToMatch = parseFloat(`${zkratNa4Desetinna(priklad.vysledek).split('.')[0]}.${trueDesToMatch}`);
                    const userToMatch = userNumTruncated;
                    
                    return Math.abs(userToMatch - trueToMatch) < 1e-9;
                }
                
                return Math.abs(userNumTruncated - trueNum) < 1e-9;
            } else if (typeof priklad.vysledek === 'bigint') {
                try {
                    return BigInt(norm) === priklad.vysledek;
                } catch {
                    return false;
                }
            } else {
                const num = parseFloat(norm);
                return !isNaN(num) && Math.abs(num - priklad.vysledek) < 1e-9;
            }
        }

        function handleTlacitko(e) {
            if (isProcessing) return;
            isProcessing = true;

            if (e && e.preventDefault) {
                e.preventDefault();
                e.stopPropagation();
            }
            odpovedEl.classList.remove('zelene', 'cervene');

            const btnText = tlacitkoEl.textContent.trim();
            const inputText = odpovedEl.value.trim();

            if (!zobrazitVysledek) {
                if (btnText === 'ZAČÍT' && normalizuj(inputText) === 'smazat') {
                    window.clearHistory();
                    isProcessing = false;
                    return;
                }
                
                const p = vygenerujPriklad();
                if (!p) {
                    isProcessing = false;
                    return;
                }
                zobrazPriklad(p);
                odpovedEl.value = '';
                odpovedEl.placeholder = 'Váš výsledek';
                zobrazitVysledek = true;
                aktualizujTextTlacitka();
                if (p.op === '/') {
                    divisionInfo.classList.remove('hidden');
                } else {
                    divisionInfo.classList.add('hidden');
                }
                setTimeout(() => {
                    ukazCaru();
                    aktivujPole();
                    isProcessing = false;
                }, 50);
            } 
            else {
                const uziv = inputText;
                
                if (uziv === '') {
                    const vysl = aktualniPriklad.vysledekZobrazeny !== undefined ? aktualniPriklad.vysledekZobrazeny : aktualniPriklad.vysledek;
                    odpovedEl.value = formatujCislo(vysl);
                    zobrazitVysledek = false;
                    aktualizujTextTlacitka();
                    divisionInfo.classList.add('hidden');
                    setTimeout(() => {
                        odpovedEl.focus();
                        isProcessing = false;
                    }, 50);
                } else if (!jePlatneCislo(uziv)) {
                    chybaEl.textContent = '⚠️ Vložil jste nepovolený znak, opravte!';
                    isProcessing = false;
                    setTimeout(() => odpovedEl.focus(), 100);
                } else {
                    const spravne = zkontrolujOdpoved(uziv, aktualniPriklad);
                    odpovedEl.classList.add(spravne ? 'zelene' : 'cervene');
                    zobrazitVysledek = false;
                    aktualizujTextTlacitka();
                    divisionInfo.classList.add('hidden');
                    // Přidáme do historie
                    window.addHistory(spravne);
                    setTimeout(() => isProcessing = false, 150);
                }
            }
        }

        tlacitkoEl.addEventListener('touchstart', handleTlacitko, { passive: false });
        tlacitkoEl.addEventListener('click', (e) => {
            if (e.pointerType !== 'touch') handleTlacitko(e);
        });
        odpovedEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleTlacitko(e);
        });

        naplnSelecty();
        aktualizujTextTlacitka();
        updateBtnDisable();
        setTimeout(aktivujPole, 100);
    </script>

    <!-- ═══════ UI ENHANCEMENT (bez ikon, s funkcí ozubeného kolečka) ═══════ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const settingsToggle = document.getElementById('settingsToggle');
            const settingsPanel = document.getElementById('settingsPanel');
            const divisionInfo = document.getElementById('divisionInfo');
            const chybaEl = document.getElementById('chyba');
            const btn = document.getElementById('tlacitko');
            const enterHint = document.getElementById('enterHint');
            const input = document.getElementById('odpoved');

            // Ozubené kolečko
            if (settingsToggle && settingsPanel) {
                settingsToggle.addEventListener('click', () => {
                    settingsPanel.classList.toggle('collapsed');
                    if (!settingsPanel.classList.contains('collapsed') && document.getElementById('operace').value === '/') {
                        divisionInfo?.classList.remove('hidden');
                    } else if (settingsPanel.classList.contains('collapsed')) {
                        divisionInfo?.classList.add('hidden');
                    }
                });
            }

            // Chyba otevře nastavení
            if (chybaEl) {
                const observer = new MutationObserver(() => {
                    if (chybaEl.textContent.trim() && settingsPanel?.classList.contains('collapsed')) {
                        settingsPanel.classList.remove('collapsed');
                    }
                });
                observer.observe(chybaEl, { childList: true });
            }

            // Enter hint
            if (input && enterHint && btn) {
                input.addEventListener('focus', () => {
                    if (btn.textContent.trim() === 'VÝSLEDEK(kontrola)') {
                        enterHint.style.opacity = '1';
                    }
                });
                input.addEventListener('blur', () => enterHint.style.opacity = '0');
                input.addEventListener('input', () => {
                    if (input.value.length > 0) enterHint.style.opacity = '0';
                });
            }

            // Tlačítko animace
            if (btn) {
                const observer = new MutationObserver(() => {
                    const text = btn.textContent.trim();
                    btn.classList.remove('state-start', 'state-result', 'btn-pulse', 'btn-glow-emerald');
                    if (text === 'VÝSLEDEK(kontrola)') {
                        btn.classList.add('state-result', 'btn-glow-emerald');
                    } else {
                        btn.classList.add('state-start', 'btn-pulse');
                    }
                });
                observer.observe(btn, { childList: true, characterData: true, subtree: true });
            }
        });
    </script>
