<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Trénink počítání</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', '"Courier New"', 'monospace'],
          },
        },
      },
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .zelene { background-color: #15803d !important; border-color: #22c55e !important; color: white !important; }
    .cervene { background-color: #b91c1c !important; border-color: #ef4444 !important; color: white !important; }
    input#odpoved::-webkit-search-cancel-button,
    input#odpoved::-webkit-search-decoration,
    input#odpoved::-webkit-search-results-button,
    input#odpoved::-webkit-search-results-decoration {
      display: none;
    }
    .settings-panel {
      max-height: 150px;
      opacity: 1;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.25s ease;
    }
    .settings-panel.collapsed {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-200 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen font-sans">

<div class="w-full max-w-md mx-auto p-4 space-y-4">
  <!-- Hlavička -->
  <div class="flex justify-between items-center">
    <h1 class="text-lg font-bold">Trénink počítání</h1>
    <button id="settingsToggle" class="p-1.5 rounded hover:bg-slate-300 dark:hover:bg-slate-800">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
    </button>
  </div>

  <!-- Nastavení -->
  <div id="settingsPanel" class="settings-panel collapsed">
    <select id="operace" class="w-full p-2 mb-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded">
      <option value="+">+</option>
      <option value="-">−</option>
      <option value="*">×</option>
      <option value="/">÷</option>
    </select>
    <input type="number" id="cislice1" value="2" min="1" max="9" class="w-full p-2 mb-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded">
    <input type="number" id="cislice2" value="1" min="1" max="9" class="w-full p-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded">
    <div id="divisionInfo" class="hidden mt-2 text-[10px] text-slate-500 dark:text-slate-400">Dělení zobrazí přesně 4 desetinná místa.</div>
  </div>

  <!-- Příklad -->
  <div id="priklad" class="font-mono text-xl whitespace-pre-wrap text-center py-4 bg-slate-100 dark:bg-slate-800/50 rounded">Zvolte nastavení a stiskněte ZAČÍT</div>

  <!-- Odpověď -->
  <input type="text" id="odpoved" class="w-full p-3 text-right font-mono text-lg rounded-lg border-2 border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-blue-500 outline-none" placeholder="Váš výsledek">

  <!-- Tlačítko -->
  <button id="tlacitko" class="w-full p-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition">ZAČÍT</button>

  <!-- Historie -->
  <div id="historyContainer" class="mt-6">
    <h3 class="text-xs font-bold uppercase text-slate-500 mb-2">Historie</h3>
    <div id="historyList" class="space-y-2"></div>
  </div>
</div>

<script>
// === GLOBÁLNÍ PROMĚNNÉ === //
let currentProblem = null;
const STORAGE_KEY = 'matika_final_v1';

// === POMOCNÉ FUNKCE === //
function getToday() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}

function loadState() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (data && data.date === getToday()) return data;
  } catch(e) {}
  localStorage.removeItem(STORAGE_KEY);
  return { history: [], correct: 0, wrong: 0 };
}

function saveState(state) {
  state.date = getToday();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function formatNumber(x) {
  if (typeof x === 'bigint') return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  if (typeof x !== 'number') return String(x);
  if (Number.isInteger(x)) return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  let [cela, des] = x.toString().split('.');
  cela = cela.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return des ? `${cela}.${des}` : cela;
}

function cleanDivisionResult(numStr) {
  // Přijme řetězec ve tvaru "12.3400" → vrátí "12.34"
  if (!numStr.includes('.')) return numStr;
  let [cela, des] = numStr.split('.');
  des = des.padEnd(4, '0').substring(0, 4); // zajistí 4 místa, pak ořízne
  // Odstraní koncové nuly
  des = des.replace(/0+$/, '');
  if (des === '') return cela;
  return `${cela}.${des}`;
}

function addHistory(text, isCorrect) {
  const state = loadState();
  state.history.push({ text, correct: isCorrect });
  saveState(state);
  renderHistory();
}

function renderHistory() {
  const state = loadState();
  const container = document.getElementById('historyList');
  if (!container) return;
  container.innerHTML = '';
  if (state.history.length === 0) {
    container.innerHTML = '<div class="text-sm text-slate-400 italic">Žádné záznamy</div>';
    return;
  }
  state.history.slice().reverse().forEach(h => {
    const div = document.createElement('div');
    div.className = `p-2 rounded font-mono text-sm ${
      h.correct
        ? 'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-800 dark:text-emerald-200'
        : 'bg-rose-100 dark:bg-rose-900/30 text-rose-800 dark:text-rose-200'
    }`;
    div.textContent = h.text;
    container.appendChild(div);
  });
}

// === HLAVNÍ LOGIKA === //
document.addEventListener('DOMContentLoaded', () => {
  // UI elementy
  const settingsToggle = document.getElementById('settingsToggle');
  const settingsPanel = document.getElementById('settingsPanel');
  const operaceEl = document.getElementById('operace');
  const divisionInfo = document.getElementById('divisionInfo');
  const prikladEl = document.getElementById('priklad');
  const odpovedEl = document.getElementById('odpoved');
  const tlacitkoEl = document.getElementById('tlacitko');

  // Ozubené kolečko
  settingsToggle.addEventListener('click', () => {
    settingsPanel.classList.toggle('collapsed');
  });

  // Dělení info
  operaceEl.addEventListener('change', () => {
    if (operaceEl.value === '/') {
      divisionInfo.classList.remove('hidden');
    } else {
      divisionInfo.classList.add('hidden');
    }
  });

  // Načtení historie
  renderHistory();

  // Generování čísla
  function generateNumber(digits) {
    const min = Math.pow(10, digits - 1);
    const max = Math.pow(10, digits) - 1;
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // Hlavní tlačítko
  tlacitkoEl.addEventListener('click', () => {
    const mode = tlacitkoEl.textContent.trim();

    if (mode === 'ZAČÍT' || mode === 'DALŠÍ PŘÍKLAD') {
      const op = operaceEl.value;
      const n1 = parseInt(document.getElementById('cislice1').value) || 2;
      const n2 = parseInt(document.getElementById('cislice2').value) || 1;

      let a = generateNumber(n1);
      let b = n2 === 1 ? Math.floor(Math.random() * 9) + 1 : generateNumber(n2);

      if (op === '-' && a < b) {
        [a, b] = [b, a];
      }

      let result, displayResult;
      if (op === '+') {
        result = a + b;
        displayResult = result;
      } else if (op === '-') {
        result = a - b;
        displayResult = result;
      } else if (op === '*') {
        result = BigInt(a) * BigInt(b);
        displayResult = result;
      } else if (op === '/') {
        result = a / b;
        // Zobrazíme jako řetězec s přesně 4 des. místy, pak vyčistíme
        const temp = result.toFixed(10); // dostatek desetinných míst
        const truncated = temp.split('.')[0] + '.' + temp.split('.')[1].substring(0, 4);
        displayResult = cleanDivisionResult(truncated);
      }

      currentProblem = { a, b, op, result, displayResult };
      prikladEl.textContent = `${formatNumber(a)} ${op} ${formatNumber(b)} = ?`;
      odpovedEl.value = '';
      odpovedEl.classList.remove('zelene', 'cervene');
      tlacitkoEl.textContent = 'KONTROLA';
      odpovedEl.focus();
    }

    else if (mode === 'KONTROLA') {
      const userAnswer = odpovedEl.value.trim();
      if (!userAnswer) {
        // Uživatel nic nezadal → ukážeme správný výsledek, ale NEUKLÁDÁME do historie
        if (currentProblem) {
          odpovedEl.value = formatNumber(currentProblem.displayResult);
          tlacitkoEl.textContent = 'DALŠÍ PŘÍKLAD';
        }
        return;
      }

      // Validace vstupu
      const normalized = userAnswer.replace(',', '.');
      if (!/^[-+]?\d+(\.\d*)?$/.test(normalized)) {
        alert('Neplatný vstup!');
        return;
      }

      // Kontrola správnosti
      let isCorrect = false;
      if (currentProblem.op === '/') {
        const userNum = parseFloat(normalized);
        const expectedStr = currentProblem.displayResult.toString();
        const expectedClean = cleanDivisionResult(expectedStr);
        const userClean = cleanDivisionResult(normalized);
        isCorrect = userClean === expectedClean;
      } else if (typeof currentProblem.result === 'bigint') {
        try {
          isCorrect = BigInt(normalized) === currentProblem.result;
        } catch {
          isCorrect = false;
        }
      } else {
        const userNum = parseFloat(normalized);
        isCorrect = Math.abs(userNum - currentProblem.result) < 1e-9;
      }

      // Barevné označení
      odpovedEl.classList.add(isCorrect ? 'zelene' : 'cervene');

      // Uložení do historie – JEN pokud byla zadána odpověď!
      const fullText = `${formatNumber(currentProblem.a)} ${currentProblem.op} ${formatNumber(currentProblem.b)} = ${formatNumber(currentProblem.displayResult)}`;
      addHistory(fullText, isCorrect);

      // Změna tlačítka
      tlacitkoEl.textContent = isCorrect ? '✓ SPRÁVNĚ!' : '✗ CHYBA!';
      setTimeout(() => {
        tlacitkoEl.textContent = 'DALŠÍ PŘÍKLAD';
      }, 1500);
    }
  });

  // Enter klávesa
  odpovedEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      tlacitkoEl.click();
    }
  });
});
</script>
</body>
</html>
