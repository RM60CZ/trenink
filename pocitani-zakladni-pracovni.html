<!DOCTYPE html><html lang="cs" class="dark"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/><title>Trénink počítání</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:"class",theme:{extend:{fontFamily:{sans:["Inter","system-ui","sans-serif"]}}}}</script><style>*{margin:0;padding:0;box-sizing:border-box}.zelene{background:#15803d!important;border-color:#22c55e!important;color:#fff!important}.cervene{background:#b91c1c!important;border-color:#ef4444!important;color:#fff!important}input{-webkit-appearance:none;border-radius:.75rem}#inputWrapper{position:relative;overflow:hidden}#odpoved{position:relative;right:0;transition:right .15s ease}#odpoved::placeholder{text-align:center!important;font-size:1.5rem}@media(max-width:400px){#odpoved::placeholder{font-size:1rem}}#odpoved.hidden-text{color:transparent!important;caret-color:transparent!important;-webkit-text-fill-color:transparent!important}.math-text{white-space:pre;line-height:1.25;display:block;font-variant-numeric:tabular-nums}.worksheet-bg{background:#e2e8f0 radial-gradient(circle,#94a3b8 1px,transparent 1px)/24px 24px}.dark .worksheet-bg{background:rgba(30,41,59,.4) radial-gradient(circle,#334155 1px,transparent 1px)}.btn-pulse{animation:pulse-blue 2.5s infinite}@keyframes pulse-blue{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}50%{box-shadow:0 0 0 10px rgba(37,99,235,0)}}.btn-glow{animation:glow 2.5s infinite}@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}50%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}.shake{animation:shake .5s both}@keyframes shake{10%,90%{transform:translate3d(-1px,0,0)}20%,80%{transform:translate3d(2px,0,0)}30%,50%,70%{transform:translate3d(-3px,0,0)}40%,60%{transform:translate3d(3px,0,0)}}.slide-up{animation:slideUp .3s forwards}@keyframes slideUp{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}.pop{animation:pop .2s}@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}.settings-panel{max-height:150px;opacity:1;overflow:hidden;transition:all .3s ease}.settings-panel.collapsed{max-height:0;opacity:0;margin:0!important;pointer-events:none}.scrollbar-hide::-webkit-scrollbar{display:none}.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}.score-bar{position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}#micBtn,#homeBtn{transition:opacity .2s}#micBtn{visibility:hidden;opacity:0;pointer-events:none}#micBtn.shown{visibility:visible;opacity:1;pointer-events:auto}@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}#micBtn.listening{animation:mic-pulse 1.2s infinite;border-color:#ef4444!important}#homeBtn.hidden-btn{visibility:hidden;opacity:0;pointer-events:none}</style></head><body class="bg-slate-200 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300 font-sans"><div class="w-full max-w-md mx-auto flex flex-col min-h-[100dvh]"><div class="score-bar bg-slate-300/80 dark:bg-slate-900/80 border-b border-slate-300 dark:border-slate-800 shadow-sm"><div class="px-4 py-2.5 flex items-center justify-between select-none"><div class="flex items-center gap-3"><div class="flex items-center gap-1.5"><span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">✓</span><output id="scoreCorrect" class="text-lg font-black text-emerald-600 dark:text-emerald-400 tabular-nums">0</output></div><div class="w-px h-5 bg-slate-300 dark:bg-slate-700"></div><div class="flex items-center gap-1.5"><span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">✗</span><output id="scoreWrong" class="text-lg font-black text-rose-600 dark:text-rose-400 tabular-nums">0</output></div></div>
<div class="flex items-center gap-3"><label class="flex items-center gap-1.5 cursor-pointer select-none"><span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">Hlas</span><div class="relative"><input type="checkbox" id="hlasCheck" class="sr-only peer"/><div class="w-8 h-4 bg-slate-400 dark:bg-slate-600 peer-checked:bg-blue-600 rounded-full transition-colors duration-200"></div><div class="absolute top-0.5 left-0.5 w-3 h-3 bg-white rounded-full transition-transform duration-200 peer-checked:translate-x-4 shadow"></div></div></label><div class="w-px h-5 bg-slate-300 dark:bg-slate-700"></div><div class="flex items-center gap-2"><span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">Série</span><div class="flex items-center gap-1"><output id="streakCount" class="text-lg font-black text-amber-500 dark:text-amber-400 tabular-nums">0</output><svg class="w-4 h-4 text-amber-500 dark:text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1011.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 017 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A2.99 2.99 0 0113 13a2.99 2.99 0 01-.879 2.121z" clip-rule="evenodd"/></svg></div></div></div></div></div><div class="flex-1 flex flex-col p-4 gap-4 overflow-y-auto scrollbar-hide"><div id="problemBox" class="worksheet-bg rounded-xl p-6 shadow-inner border border-slate-300 dark:border-slate-700"><div id="example" class="math-text text-4xl font-black text-center text-slate-800 dark:text-slate-100 select-none"></div></div><div id="inputWrapper" class="relative"><input id="odpoved" autocomplete="off" inputmode="numeric" class="w-full text-center text-3xl font-black py-4 px-4 rounded-xl border-2 border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all placeholder-slate-400" placeholder="Řekni nebo napiš odpověď"/><button id="micBtn" class="absolute right-3 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full border-2 border-slate-400 dark:border-slate-600 bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-slate-700 dark:text-slate-300 transition-all"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a2 2 0 00-2 2v6a2 2 0 104 0V4a2 2 0 00-2-2z"/><path fill-rule="evenodd" d="M5 10a5 5 0 0010 0h-1a4 4 0 11-8 0H5z" clip-rule="evenodd"/><path d="M4 10a6 6 0 0012 0h-1a5 5 0 11-10 0H4z"/><path d="M9 18h2v-2H9v2z"/></svg></button></div><button id="checkBtn" class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-black text-xl shadow btn-pulse transition-all">Zkontrolovat</button><button id="nextBtn" class="w-full py-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xl shadow btn-glow transition-all hidden">Další příklad</button><div id="history" class="mt-4 space-y-2"></div></div>
</div><div class="p-4 flex flex-col gap-3 border-t border-slate-300 dark:border-slate-800 bg-slate-100/70 dark:bg-slate-900/70"><button id="homeBtn" class="w-full py-3 rounded-xl bg-slate-500 hover:bg-slate-600 text-white font-black text-lg shadow transition-all hidden-btn">Domů</button></div></div><script>
"use strict";

let currentA = 0;
let currentB = 0;
let correctAnswer = 0;
let afterDecimal = false;
let buildingNumber = "";
let thousandsMode = false;
let firstNumberDone = false;

const exampleEl = document.getElementById("example");
const inputEl = document.getElementById("odpoved");
const checkBtn = document.getElementById("checkBtn");
const nextBtn = document.getElementById("nextBtn");
const historyEl = document.getElementById("history");
const scoreCorrectEl = document.getElementById("scoreCorrect");
const scoreWrongEl = document.getElementById("scoreWrong");
const streakCountEl = document.getElementById("streakCount");
const micBtn = document.getElementById("micBtn");
const hlasCheck = document.getElementById("hlasCheck");
const homeBtn = document.getElementById("homeBtn");

let scoreCorrect = 0;
let scoreWrong = 0;
let streak = 0;

function formatNumber(num) {
    const parts = num.toString().split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return parts.join(",");
}

function newProblem() {
    currentA = Math.floor(Math.random() * 900) + 100;
    currentB = Math.floor(Math.random() * 900) + 100;
    correctAnswer = currentA + currentB;

    exampleEl.textContent = `${formatNumber(currentA)} + ${formatNumber(currentB)}`;
    inputEl.value = "";
    inputEl.classList.remove("hidden-text");
    inputEl.placeholder = "Řekni nebo napiš odpověď";

    afterDecimal = false;
    buildingNumber = "";
    thousandsMode = false;
    firstNumberDone = false;

    checkBtn.classList.remove("hidden");
    nextBtn.classList.add("hidden");
    micBtn.classList.add("shown");
    homeBtn.classList.add("hidden-btn");
}
function checkAnswer() {
    const userInput = inputEl.value.replace(/\s+/g, "").replace(",", ".");
    const userNumber = parseFloat(userInput);

    if (isNaN(userNumber)) return;

    const isCorrect = Math.abs(userNumber - correctAnswer) < 0.0001;

    const historyItem = document.createElement("div");
    historyItem.className = "p-3 rounded-lg border text-sm flex justify-between items-center " +
        (isCorrect ? "border-emerald-500 bg-emerald-100 dark:bg-emerald-900/40" :
                     "border-rose-500 bg-rose-100 dark:bg-rose-900/40");

    historyItem.innerHTML =
        `<span>${formatNumber(currentA)} + ${formatNumber(currentB)}</span>
         <span class="font-black">${isCorrect ? "✓" : "✗"} ${formatNumber(userNumber)}</span>`;

    historyEl.prepend(historyItem);

    if (isCorrect) {
        scoreCorrect++;
        streak++;
        inputEl.classList.add("zelene");
    } else {
        scoreWrong++;
        streak = 0;
        inputEl.classList.add("cervene");
        inputEl.classList.add("shake");
        setTimeout(() => inputEl.classList.remove("shake"), 500);
    }

    scoreCorrectEl.textContent = scoreCorrect;
    scoreWrongEl.textContent = scoreWrong;
    streakCountEl.textContent = streak;

    checkBtn.classList.add("hidden");
    nextBtn.classList.remove("hidden");
    micBtn.classList.remove("shown");
    homeBtn.classList.remove("hidden-btn");
}

checkBtn.addEventListener("click", checkAnswer);
nextBtn.addEventListener("click", newProblem);

inputEl.addEventListener("input", () => {
    inputEl.classList.remove("zelene", "cervene");
});

newProblem();

/* ---------------------- HLASOVÉ OVLÁDÁNÍ ---------------------- */

let recognition;
let listening = false;

if ("webkitSpeechRecognition" in window) {
    recognition = new webkitSpeechRecognition();
    recognition.lang = "cs-CZ";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
        let transcript = event.results[0][0].transcript.toLowerCase().trim();

        transcript = transcript
            .replace("čárka", ",")
            .replace("tečka", ",")
            .replace("minus", "-")
            .replace("mínus", "-")
            .replace(/\s+/g, "");

        inputEl.value = transcript;
        inputEl.classList.remove("hidden-text");
    };

    recognition.onend = () => {
        listening = false;
        micBtn.classList.remove("listening");
    };
}

micBtn.addEventListener("click", () => {
    if (!hlasCheck.checked) return;

    if (!recognition) return;

    if (!listening) {
        listening = true;
        micBtn.classList.add("listening");
        inputEl.classList.add("hidden-text");
        recognition.start();
    } else {
        listening = false;
        micBtn.classList.remove("listening");
        inputEl.classList.remove("hidden-text");
        recognition.stop();
    }
});
</script></body></html>
