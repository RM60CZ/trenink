<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Počítání – základní úroveň</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .controls {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .top-right-icons {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .icon {
            width: 32px;
            height: 32px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .icon:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        #priklad {
            font-size: 2.8em;
            margin: 25px 0;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            min-width: 300px;
        }

        #odpoved {
            font-size: 1.8em;
            padding: 12px;
            width: 200px;
            text-align: center;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
        }

        #vysledek {
            font-size: 1.4em;
            min-height: 1.8em;
            margin: 15px 0;
            font-weight: bold;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .spravne { color: #4CAF50; text-shadow: 0 0 10px #4CAF50; }
        .spatne { color: #F44336; text-shadow: 0 0 10px #F44336; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .pulse {
            animation: pulse 0.5s;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label style="display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 20px;">
            <input type="checkbox" id="hlas-switch" style="width: 20px; height: 20px; cursor: pointer;">
            <span style="font-weight: bold;">Hlas</span>
        </label>
    </div>

    <div class="top-right-icons">
        <div class="icon" title="GitHub">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
        </div>
        <div class="icon" title="Nápověda">
            <span style="color: white; font-weight: bold; font-size: 18px;">?</span>
        </div>
    </div>

    <div id="priklad">Načítání...</div>
    <input type="text" id="odpoved" autofocus>
    <div id="vysledek"></div>
    <button onclick="novyPriklad()">Nový příklad</button>

    <script>
        // === GENEROVÁNÍ PŘÍKLADU ===
        function generujPriklad() {
            const a = Math.floor(Math.random() * 20) + 1;
            const b = Math.floor(Math.random() * 20) + 1;
            return { a, b, spravne: a + b };
        }

        let aktualniPriklad = generujPriklad();

        function zobrazPriklad() {
            document.getElementById('priklad').textContent = `${aktualniPriklad.a} + ${aktualniPriklad.b} = ?`;
            document.getElementById('odpoved').value = '';
            document.getElementById('vysledek').textContent = '';
            document.getElementById('odpoved').focus();
            document.getElementById('odpoved').classList.remove('pulse');
        }

        // === POKROČILÝ PŘEVOD ŘEČI NA ČÍSLA ===
        function extractNumber(text) {
            if (!text) return null;
            const trimmed = text.trim();

            if (/^\d+$/.test(trimmed)) {
                const num = parseInt(trimmed, 10);
                return (num >= 0 && num <= 999) ? num : null;
            }

            let norm = text.toLowerCase()
                .replace(/[^a-z0-9áčďéěíňóřšťúůýž\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            norm = norm.replace(/\ba\b/g, '');
            const words = norm.split(' ').filter(w => w);

            if (words.length === 1 && (words[0] === 'nula' || words[0] === 'nůla')) {
                return 0;
            }

            const jednotky = {
                'jedna': 1, 'jeden': 1,
                'dva': 2, 'dvě': 2,
                'tri': 3, 'tři': 3,
                'ctyri': 4, 'čtyři': 4,
                'pet': 5, 'pět': 5,
                'sest': 6, 'šest': 6,
                'sedm': 7,
                'osm': 8,
                'devet': 9, 'devět': 9
            };

            const teens = {
                'deset': 10,
                'jedenact': 11, 'jedenáct': 11,
                'dvanact': 12, 'dvanáct': 12,
                'trinact': 13, 'třináct': 13,
                'ctrnact': 14, 'čtrnáct': 14,
                'patnact': 15, 'patnáct': 15,
                'sestnact': 16, 'šestnáct': 16,
                'sedmnact': 17, 'sedmnáct': 17,
                'osmnact': 18, 'osmnáct': 18,
                'devatenact': 19, 'devatenáct': 19
            };

            const desitky = {
                'dvacet': 20,
                'tricet': 30, 'třicet': 30,
                'ctyricet': 40, 'čtyřicet': 40,
                'padesat': 50, 'padesát': 50,
                'šedesát': 60,
                'sedmdesat': 70, 'sedmdesát': 70,
                'osmdesat': 80, 'osmdesát': 80,
                'devadesat': 90, 'devadesát': 90
            };

            const stovky = {
                'sto': 100,
                'dveste': 200, 'dvě stě': 200, 'dvěste': 200,
                'trista': 300, 'tři sta': 300,
                'ctyrista': 400, 'čtyři sta': 400,
                'petset': 500, 'pět set': 500,
                'sestset': 600, 'šest set': 600,
                'sedmset': 700, 'sedm set': 700,
                'osmset': 800, 'osm set': 800,
                'devetset': 900, 'devět set': 900
            };

            let total = 0;
            let remaining = words.join(' ');

            for (const [phrase, value] of Object.entries(stovky)) {
                if (remaining.includes(phrase)) {
                    total += value;
                    remaining = remaining.replace(phrase, '').replace(/\s+/g, ' ').trim();
                    break;
                }
            }

            const restWords = remaining.split(' ').filter(w => w);
            let restValue = 0;

            if (restWords.length === 1) {
                const w = restWords[0];
                if (teens[w] !== undefined) restValue = teens[w];
                else if (desitky[w] !== undefined) restValue = desitky[w];
                else if (jednotky[w] !== undefined) restValue = jednotky[w];
            } else if (restWords.length === 2) {
                const d = desitky[restWords[0]] || 0;
                const j = jednotky[restWords[1]] || 0;
                if (d >= 20 && d <= 90 && j >= 1 && j <= 9) {
                    restValue = d + j;
                }
            }

            total += restValue;
            return (total >= 0 && total <= 999) ? total : null;
        }

        // === CONTINUOUS RECOGNITION S ÚPRAVOU ZA ČÁRKOU ===
        let recognition = null;
        let isListening = false;

        function spustHlasoveRozpoznani() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert("Hlasové rozpoznávání funguje pouze v Chrome nebo Edge.");
                document.getElementById('hlas-switch').checked = false;
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = "cs-CZ";
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[event.resultIndex][0].transcript.trim();
                console.log("🗣️", transcript);

                const inputEl = document.getElementById('odpoved');
                let currentRaw = inputEl.value.replace(/ /g, '');

                // === ČÁRKA ===
                if (/\b(cel[áaé]|celych|cely|cel[ýy]|čárka|carka)\b/i.test(transcript)) {
                    if (currentRaw === "") {
                        inputEl.value = "0,";
                    } else if (!currentRaw.endsWith(',')) {
                        inputEl.value = currentRaw + ',';
                    }
                    return;
                }

                const number = extractNumber(transcript);
                if (number === null) return;

                // === ZA ČÁRKOU → JEDNOTLIVÉ ČÍSLICE ===
                if (currentRaw.endsWith(',')) {
                    if (number >= 0 && number <= 9) {
                        inputEl.value = currentRaw + number.toString();
                    }
                    return;
                }

                // === PŘED ČÁRKOU → TROJBLOKY ===
                if (currentRaw === "") {
                    inputEl.value = number.toString();
                } else {
                    const padded = String(number).padStart(3, '0');
                    const newRaw = currentRaw + padded;
                    inputEl.value = newRaw.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
                }

                // === Ověření ===
                const celkovaDelka = aktualniPriklad.spravne.toString().length;
                if (inputEl.value.replace(/\D/g, '').length >= celkovaDelka) {
                    overitOdpoved();
                }
            };

            recognition.onerror = (e) => console.error("❌", e.error);

            recognition.onend = () => {
                if (isListening) setTimeout(() => recognition.start(), 300);
            };

            recognition.start();
            isListening = true;
        }

        // === OVĚŘENÍ ODPOVĚDI ===
        function overitOdpoved() {
            const inputEl = document.getElementById('odpoved');
            const zadano = inputEl.value.trim();
            const vysledekEl = document.getElementById('vysledek');
            
            if (zadano === '') return;

            const cislo = parseInt(zadano.replace(/\D/g, ''), 10);
            if (isNaN(cislo)) {
                vysledekEl.textContent = 'Zadejte prosím číslo.';
                vysledekEl.className = 'spatne pulse';
                inputEl.classList.add('pulse');
                return;
            }

            if (cislo === aktualniPriklad.spravne) {
                vysledekEl.textContent = '✓ Správně!';
                vysledekEl.className = 'spravne pulse';
                inputEl.classList.add('pulse');
                setTimeout(novyPriklad, 1500);
            } else {
                vysledekEl.textContent = `✗ Špatně. Správně je ${aktualniPriklad.spravne}.`;
                vysledekEl.className = 'spatne pulse';
                inputEl.classList.add('pulse');
            }
        }

        function novyPriklad() {
            aktualniPriklad = generujPriklad();
            zobrazPriklad();
        }

        // === EVENT LISTENERS ===
        document.getElementById('odpoved').addEventListener
