<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
    <title>Trénink počítání</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}.zelene{background:#15803d!important;border-color:#22c55e!important;color:#fff!important}.cervene{background:#b91c1c!important;border-color:#ef4444!important;color:#fff!important}input{-webkit-appearance:none;border-radius:.75rem}#inputWrapper{position:relative;overflow:hidden}#odpoved{position:relative;right:0;transition:right 0.15s ease}#odpoved::placeholder{text-align:center!important;font-size:1.5rem}@media(max-width:400px){#odpoved::placeholder{font-size:1rem}}#odpoved.hidden-text{color:transparent!important;caret-color:transparent!important;-webkit-text-fill-color:transparent!important}.math-text{white-space:pre;line-height:1.25;display:block;font-variant-numeric:tabular-nums}.worksheet-bg{background-color:#e2e8f0;background-image:radial-gradient(circle,#94a3b8 1px,transparent 1px);background-size:24px 24px}.dark .worksheet-bg{background-color:rgba(30,41,59,.4);background-image:radial-gradient(circle,#334155 1px,transparent 1px)}.btn-pulse{animation:pulse-blue 2.5s infinite}@keyframes pulse-blue{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}50%{box-shadow:0 0 0 10px rgba(37,99,235,0)}}.btn-glow{animation:glow 2.5s infinite}@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}50%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}.shake{animation:shake .5s both}@keyframes shake{10%,90%{transform:translate3d(-1px,0,0)}20%,80%{transform:translate3d(2px,0,0)}30%,50%,70%{transform:translate3d(-3px,0,0)}40%,60%{transform:translate3d(3px,0,0)}}.slide-up{animation:slideUp .3s forwards}@keyframes slideUp{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}.pop{animation:pop .2s}@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}.settings-panel{max-height:150px;opacity:1;overflow:hidden;transition:all .3s ease}.settings-panel.collapsed{max-height:0;opacity:0;margin:0!important;pointer-events:none}.scrollbar-hide::-webkit-scrollbar{display:none}.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}.score-bar{position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}#micBtn{transition:opacity .2s;visibility:hidden;opacity:0;pointer-events:none}#micBtn.shown{visibility:visible;opacity:1;pointer-events:auto}@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}#micBtn.listening{animation:mic-pulse 1.2s infinite;border-color:#ef4444!important}#homeBtn{transition:opacity .2s,visibility .2s}#homeBtn.hidden-btn{visibility:hidden;opacity:0;pointer-events:none}
    </style>
</head>
<body class="bg-slate-200 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300 font-sans">
    <div class="w-full max-w-md mx-auto flex flex-col min-h-[100dvh]">
        <div class="score-bar bg-slate-300/80 dark:bg-slate-900/80 border-b border-slate-300 dark:border-slate-800 shadow-sm">
            <div class="px-4 py-2.5 flex items-center justify-between select-none">
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-1.5"><span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">✓</span><output id="scoreCorrect" class="text-lg font-black text-emerald-600 dark:text-emerald-400 tabular-nums">0</output></div>
                    <div class="w-px h-5 bg-slate-300 dark:bg-slate-700"></div>
                    <div class="flex items-center gap-1.5"><span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">✗</span><output id="scoreWrong" class="text-lg font-black text-rose-600 dark:text-rose-400 tabular-nums">0</output></div>
                </div>
                <div class="flex items-center gap-3">
                    <label class="flex items-center gap-1.5 cursor-pointer select-none">
                        <span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">Hlas</span>
                        <div class="relative"><input type="checkbox" id="hlasCheck" class="sr-only peer"><div class="w-8 h-4 bg-slate-400 dark:bg-slate-600 peer-checked:bg-blue-600 rounded-full transition-colors duration-200"></div><div class="absolute top-0.5 left-0.5 w-3 h-3 bg-white rounded-full transition-transform duration-200 peer-checked:translate-x-4 shadow"></div></div>
                    </label>
                    <div class="w-px h-5 bg-slate-300 dark:bg-slate-700"></div>
                    <div class="flex items-center gap-2">
                        <span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">Série</span>
                        <div class="flex items-center gap-1"><output id="streakCount" class="text-lg font-black text-amber-500 dark:text-amber-400 tabular-nums">0</output><svg class="w-4 h-4 text-amber-500 dark:text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1011.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 017 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A2.99 2.99 0 0113 13a2.99 2.99 0 01-.879 2.121z" clip-rule="evenodd"/></svg></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto px-4 py-3 space-y-3 scrollbar-hide">
            <div class="bg-slate-200 dark:bg-slate-900 rounded-2xl shadow-lg border border-slate-300 dark:border-slate-800 p-4">
                <div class="flex items-start justify-between mb-3">
                    <div><h1 class="text-lg font-black tracking-tight text-slate-800 dark:text-white uppercase">Trénink počítání</h1><div class="flex items-center gap-1.5 mt-0.5"><span id="currentDate" class="text-[11px] font-medium text-slate-400 dark:text-slate-500"></span></div></div>
                    <div class="flex items-center gap-1">
                        <button id="homeBtn" class="p-1.5 rounded-lg hover:bg-slate-300 dark:hover:bg-slate-800 transition-colors text-slate-400 text-lg leading-none hidden-btn">🏠</button>
                        <button id="settingsToggle" class="p-1.5 rounded-lg hover:bg-slate-300 dark:hover:bg-slate-800 transition-colors text-slate-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></button>
                        <button id="themeToggle" class="p-1.5 rounded-lg hover:bg-slate-300 dark:hover:bg-slate-800 transition-colors"><svg id="themeIconMoon" class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg><svg id="themeIconSun" class="hidden w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
                    </div>
                </div>
                <div id="settingsPanel" class="settings-panel mb-3 collapsed">
                    <div class="grid grid-cols-3 gap-2">
                        <div class="flex flex-col"><label class="text-[9px] font-bold uppercase text-slate-500 mb-1 ml-1">Operace</label><select id="operace" class="bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 font-bold text-xs"><option value="+">+</option><option value="-">−</option><option value="*">x</option><option value="/">:</option></select></div>
                        <div class="flex flex-col"><label class="text-[9px] font-bold uppercase text-slate-500 mb-1 ml-1">1. Číslo</label><select id="cislice1" class="bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-xs"></select></div>
                        <div class="flex flex-col"><label class="text-[9px] font-bold uppercase text-slate-500 mb-1 ml-1">2. Číslo</label><select id="cislice2" class="bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-xs"></select></div>
                    </div>
                </div>
                <div id="chyba" class="text-red-500 text-[10px] font-bold text-center h-4 overflow-hidden mb-1" role="alert"></div>
                <div id="upperBox" class="bg-slate-200 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-800 rounded-xl pt-4 pl-4 pr-4 pb-1 mb-3 worksheet-bg relative overflow-hidden flex flex-col justify-center">
                    <div id="problemContainer" class="w-full overflow-x-auto scrollbar-hide flex flex-col items-end relative z-10 transition-all">
                        <div id="priklad" class="math-text text-4xl font-semibold tracking-normal text-slate-700 dark:text-slate-200 tabular-nums" style="white-space: break-spaces;"></div>
                        <div id="cara" class="math-text text-4xl text-slate-400 dark:border-slate-600 border-t-[3px] w-full mt-1 opacity-0 transition-opacity duration-300"></div>
                    </div>
                </div>
                <div class="space-y-2.5">
                    <div id="inputBox" class="relative bg-white dark:bg-slate-800 rounded-xl border-2 border-slate-300 dark:border-slate-700 focus-within:border-blue-500 transition-all shadow-inner overflow-hidden flex">
                        <div id="inputWrapper" class="w-full"><input type="text" id="odpoved" inputmode="text" enterkeyhint="done" autocomplete="off" placeholder="historie" class="w-full pl-4 pr-4 py-1 text-4xl sm:text-4xl font-semibold bg-transparent text-slate-800 dark:text-white outline-none text-center tabular-nums tracking-normal"></div>
                        <div id="inputIcon" class="absolute right-3 top-1/2 -translate-y-1/2 opacity-0 transition-all duration-200 scale-75 pointer-events-none"></div>
                    </div>
                    <div class="flex gap-2.5 items-stretch">
                        <button id="micBtn" type="button" class="flex-shrink-0 px-4 py-3 flex items-center justify-center gap-2 rounded-xl border-2 border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 font-bold text-sm transition-all touch-manipulation whitespace-nowrap"><svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4M12 3a4 4 0 014 4v4a4 4 0 01-8 0V7a4 4 0 014-4z"/></svg><span id="micLabel">Mikrofon</span></button>
                        <button id="tlacitko" type="button" class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-black text-base rounded-xl shadow-lg shadow-blue-500/20 transition-all uppercase tracking-widest touch-manipulation btn-pulse flex items-center justify-center">START</button>
                    </div>
                </div>
            </div>
            <div id="historyContainer" class="px-1 opacity-0 transition-opacity duration-500 select-none">
                <div class="text-[9px] font-bold uppercase text-slate-400 tracking-wider mb-1.5">Historie</div>
                <div id="historyList" class="flex flex-wrap gap-1.5"><div id="historyEmpty" class="text-[11px] text-slate-400 italic">Zatím jste nevyřešil(a) žádný příklad</div></div>
            </div>
            <div class="h-4"></div>
        </div>
    </div>
    <script>
    (function(){
        const UI = {};
        ['odpoved','operace','cislice1','cislice2','chyba','priklad','cara','tlacitko','scoreCorrect','scoreWrong','streakCount','historyContainer','historyList','historyEmpty','themeToggle','themeIconSun','themeIconMoon','hlasCheck','micBtn','micLabel','inputBox','homeBtn','settingsToggle','settingsPanel','currentDate'].forEach(id => UI[id] = document.getElementById(id));
        const KEY = 'matika_trenink_v4', today = new Date(), todayStr = today.toISOString().slice(0,10);
        let correct = 0, wrong = 0, streak = 0, history = [], aktualniPriklad = null, zobrazitVysledek = false, isProcessing = false;
        
        UI.currentDate.textContent = ['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'][today.getDay()] + ' ' + today.getDate() + '. ' + ['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'][today.getMonth()] + ' ' + today.getFullYear();
        
        // Hlasový slovník
        const WV = {'žádná':0,'zadna':0,'nula':0,'nulu':0,'jedna':1,'jeden':1,'jedno':1,'dvě':2,'dva':2,'tři':3,'čtyři':4,'pět':5,'šest':6,'sedm':7,'osm':8,'devět':9,'deset':10,'jedenáct':11,'dvanáct':12,'třináct':13,'čtrnáct':14,'patnáct':15,'šestnáct':16,'sedmnáct':17,'osmnáct':18,'devatenáct':19,'dvacet':20,'třicet':30,'čtyřicet':40,'padesát':50,'šedesát':60,'sedmdesát':70,'osmdesát':80,'devadesát':90,'sto':100,'dvěstě':200,'třista':300,'čtyřista':400};
        const IGNORE_WORDS = {'tisíc':1,'tisíce':1,'milion':1,'miliony':1,'milionu':1};
        let micListening = false, spBuf = [], recognition;
        
        function updateTheme(){
            const isDark = document.documentElement.classList.toggle('dark');
            UI.themeIconSun.classList.toggle('hidden', !isDark);
            UI.themeIconMoon.classList.toggle('hidden', isDark);
        }
        UI.themeToggle.onclick = updateTheme;

        function fmt(x){
            if(typeof x !== 'number') return String(x);
            let p = x.toString().split('.');
            let c = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
            return p[1] ? c + ',' + p[1] : c;
        }
        function fmtInputStr(s){ return s.replace(/\s|\u00A0/g, '').replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1\u00A0'); }
        function norm(s){ return s.trim().replace(/[\s\u00A0]+/g, '').replace(',', '.'); }
        function save(){ localStorage.setItem(KEY, JSON.stringify({date:todayStr, correct, wrong, streak, history, operace:UI.operace.value, cislice1:UI.cislice1.value, cislice2:UI.cislice2.value})); }
        
        function load(){
            try {
                let s = JSON.parse(localStorage.getItem(KEY));
                if(s && s.date === todayStr){ ({correct, wrong, streak, history} = s); UI.operace.value = s.operace; UI.cislice1.value = s.cislice1; UI.cislice2.value = s.cislice2; }
            } catch(e){}
        }
        
        for(let i=1;i<=9;i++){ UI.cislice1.innerHTML += `<option value="${i}">${i}</option>`; UI.cislice2.innerHTML += `<option value="${i}">${i}</option>`; }
        load();
        
        function updateCis2(){
            let v1 = +UI.cislice1.value;
            Array.from(UI.cislice2.options).forEach(o => o.disabled = (UI.operace.value === '-' && +o.value > v1));
            if(+UI.cislice2.value > v1 && UI.operace.value === '-') UI.cislice2.value = v1;
        }
        updateCis2();
        [UI.operace, UI.cislice1].forEach(el => el.onchange = () => { updateCis2(); UI.chyba.textContent = ''; save(); });
        UI.cislice2.onchange = save;

        function genNum(n){ return Math.floor(Math.random() * (Math.pow(10, n) - Math.pow(10, n-1) + 1)) + Math.pow(10, n-1); }
        function generate(){
            let op = UI.operace.value, n1 = +UI.cislice1.value, n2 = +UI.cislice2.value;
            if(op === '-' && n1 < n2){ UI.chyba.textContent = '❌ 1. číslo musí být ≥ 2. při odčítání'; return null; }
            let a, b;
            for(let i=0; i<1000; i++){
                a = genNum(n1); b = n2 === 1 ? Math.floor(Math.random()*8)+2 : genNum(n2);
                if(op === '-' && a <= b) continue;
                if(op === '/' && b === 0) continue;
                break;
            }
            let res = (op==='+')?a+b:(op==='-')?a-b:(op==='*')?BigInt(a)*BigInt(b):a/b;
            return {a, b, op, vysledek: res, vysledekZ: (op==='/') ? (Math.round(res*10000)/10000).toFixed(4) : res};
        }

        // Hlasová logika (zkrácená verze)
        function spFlush(){
            if(!spBuf.length){ UI.odpoved.value = ''; return; }
            UI.odpoved.value = fmtInputStr(spBuf.join('').replace(/(\d{3})\.?/g,'$1'));
        }
        function buildMic(){
            const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!Rec) return;
            recognition = new Rec();
            recognition.lang = 'cs-CZ';
            recognition.continuous = true;
            recognition.onstart = () => { micListening = true; UI.micBtn.classList.add('listening'); UI.micLabel.textContent = 'Mluvte…'; };
            recognition.onend = () => { micListening = false; UI.micBtn.classList.remove('listening'); UI.micLabel.textContent = 'Mikrofon'; if(UI.hlasCheck.checked && zobrazitVysledek) recognition.start(); };
            recognition.onresult = (e) => {
                let text = e.results[e.results.length-1][0].transcript.toLowerCase();
                if(text.includes('zpět')) { spBuf.pop(); spFlush(); }
                else {
                    text.split(' ').forEach(w => { if(WV[w]!==undefined) spBuf.push(WV[w]); });
                    spFlush();
                    if(text.includes('ano') || text.includes('hotovo')) handle();
                }
            };
        }

        function startNewProblem(){
            let p = generate(); if(!p) return false;
            aktualniPriklad = p;
            UI.priklad.innerHTML = `<div class="flex justify-end gap-3 w-full"><div class="flex flex-col text-right select-none"><div class="invisible">0</div><div>${p.op==='*'? 'x':p.op==='/'?':':p.op==='-'?'−':'+'}</div></div><div class="flex flex-col text-right"><div>${fmt(p.a)}</div><div>${fmt(p.b)}</div></div></div>`;
            UI.cara.style.opacity = '1'; UI.odpoved.value = ''; UI.odpoved.classList.remove('hidden-text'); UI.odpoved.focus();
            zobrazitVysledek = true; updateUIState(); return true;
        }

        function updateUIState(){
            UI.homeBtn.classList.toggle('hidden-btn', !aktualniPriklad);
            UI.micBtn.classList.toggle('shown', !!(UI.hlasCheck.checked && zobrazitVysledek && aktualniPriklad));
            UI.tlacitko.textContent = zobrazitVysledek ? '✓ VÝSLEDEK' : 'START';
            UI.tlacitko.className = `flex-1 py-3 ${zobrazitVysledek?'bg-emerald-600 btn-glow':'bg-blue-600 btn-pulse'} text-white font-black text-base rounded-xl shadow-lg transition-all uppercase tracking-widest`;
        }

        function check(){
            let val = norm(UI.odpoved.value);
            let ok = (aktualniPriklad.op === '/') ? (Math.abs(parseFloat(val) - aktualniPriklad.vysledek) < 0.001) : (BigInt(val) === BigInt(aktualniPriklad.vysledek));
            if(ok){ correct++; streak++; } else { wrong++; streak = 0; }
            UI.scoreCorrect.textContent = correct; UI.scoreWrong.textContent = wrong; UI.streakCount.textContent = streak;
            save(); renderHistory(ok); zobrazitVysledek = false; updateUIState();
            if(recognition && micListening) recognition.stop();
        }

        function renderHistory(ok){
            UI.historyEmpty.style.display = 'none'; UI.historyContainer.style.opacity = '1';
            let d = document.createElement('div');
            d.className = `slide-up px-2.5 py-1 rounded-md text-[12px] tabular-nums font-bold border ${ok?'bg-emerald-50 border-emerald-200 text-emerald-700':'bg-rose-50 border-rose-200 text-rose-700'}`;
            d.textContent = `${fmt(aktualniPriklad.a)} ${aktualniPriklad.op} ${fmt(aktualniPriklad.b)} = ${aktualniPriklad.vysledekZ} ${ok?'✓':'✗'}`;
            UI.historyList.prepend(d);
        }

        function handle(){
            if(zobrazitVysledek) check(); 
            else startNewProblem();
        }

        UI.tlacitko.onclick = handle;
        UI.homeBtn.onclick = () => { aktualniPriklad = null; zobrazitVysledek = false; UI.odpoved.value=''; UI.priklad.innerHTML=''; updateUIState(); };
        UI.settingsToggle.onclick = () => UI.settingsPanel.classList.toggle('collapsed');
        UI.hlasCheck.onchange = () => { updateUIState(); if(UI.hlasCheck.checked) { if(!recognition) buildMic(); recognition.start(); } else if(recognition) recognition.stop(); };
    })();
    </script>
</body>
</html>
