<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Trénink počítání</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
.zelene{background:#15803d!important;border-color:#22c55e!important;color:#fff!important}
.cervene{background:#b91c1c!important;border-color:#ef4444!important;color:#fff!important}
input{-webkit-appearance:none;border-radius:.75rem}
#inputWrapper{position:relative;overflow:hidden}
#odpoved{position:relative;right:0;transition:right .15s ease}
#odpoved::placeholder{text-align:center!important;font-size:1.5rem}
@media(max-width:400px){#odpoved::placeholder{font-size:1rem}}
#odpoved.hidden-text{color:transparent!important;caret-color:transparent!important;-webkit-text-fill-color:transparent!important}
.math-text{white-space:pre;line-height:1.25;display:block;font-variant-numeric:tabular-nums}
.worksheet-bg{background:#e2e8f0 radial-gradient(circle,#94a3b8 1px,transparent 1px)/24px 24px}
.dark .worksheet-bg{background:rgba(30,41,59,.4) radial-gradient(circle,#334155 1px,transparent 1px)}
.btn-pulse{animation:pulse-blue 2.5s infinite}
@keyframes pulse-blue{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}50%{box-shadow:0 0 0 10px rgba(37,99,235,0)}}
.btn-glow{animation:glow 2.5s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}50%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}
.shake{animation:shake .5s both}
@keyframes shake{10%,90%{transform:translate3d(-1px,0,0)}20%,80%{transform:translate3d(2px,0,0)}30%,50%,70%{transform:translate3d(-3px,0,0)}40%,60%{transform:translate3d(3px,0,0)}}
.slide-up{animation:slideUp .3s forwards}
@keyframes slideUp{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.pop{animation:pop .2s}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.settings-panel{max-height:150px;opacity:1;overflow:hidden;transition:all .3s ease}
.settings-panel.collapsed{max-height:0;opacity:0;margin:0!important;pointer-events:none}
.scrollbar-hide::-webkit-scrollbar{display:none}
.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
.score-bar{position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#micBtn,#homeBtn{transition:opacity .2s}
#micBtn{visibility:hidden;opacity:0;pointer-events:none}
#micBtn.shown{visibility:visible;opacity:1;pointer-events:auto}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
#micBtn.listening{animation:mic-pulse 1.2s infinite;border-color:#ef4444!important}
#homeBtn.hidden-btn{visibility:hidden;opacity:0;pointer-events:none}
</style>
</head>
<body class="bg-slate-200 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300 font-sans">
<div class="w-full max-w-md mx-auto flex flex-col min-h-[100dvh]">
<div class="score-bar bg-slate-300/80 dark:bg-slate-900/80 border-b border-slate-300 dark:border-slate-800 shadow-sm">
<div class="px-4 py-2.5 flex items-center justify-between select-none">
  <div class="flex items-center gap-3">
    <div class="flex items-center gap-1.5"><span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">✓</span><output id="scoreCorrect" class="text-lg font-black text-emerald-600 dark:text-emerald-400 tabular-nums">0</output></div>
    <div class="w-px h-5 bg-slate-300 dark:bg-slate-700"></div>
    <div class="flex items-center gap-1.5"><span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">✗</span><output id="scoreWrong" class="text-lg font-black text-rose-600 dark:text-rose-400 tabular-nums">0</output></div>
  </div>
  <div class="flex items-center gap-3">
    <label class="flex items-center gap-1.5 cursor-pointer select-none">
      <span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">Hlas</span>
      <div class="relative"><input type="checkbox" id="hlasCheck" class="sr-only peer"/><div class="w-8 h-4 bg-slate-400 dark:bg-slate-600 peer-checked:bg-blue-600 rounded-full transition-colors duration-200"></div><div class="absolute top-0.5 left-0.5 w-3 h-3 bg-white rounded-full transition-transform duration-200 peer-checked:translate-x-4 shadow"></div></div>
    </label>
    <div class="w-px h-5 bg-slate-300 dark:bg-slate-700"></div>
    <div class="flex items-center gap-2">
      <span class="text-[9px] font-bold uppercase text-slate-400 tracking-wider">Série</span>
      <div class="flex items-center gap-1"><output id="streakCount" class="text-lg font-black text-amber-500 dark:text-amber-400 tabular-nums">0</output><svg class="w-4 h-4 text-amber-500 dark:text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1011.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 017 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A2.99 2.99 0 0113 13a2.99 2.99 0 01-.879 2.121z" clip-rule="evenodd"/></svg></div>
    </div>
  </div>
</div>
</div>
<div class="flex-1 overflow-y-auto px-4 py-3 space-y-3 scrollbar-hide">
<div class="bg-slate-200 dark:bg-slate-900 rounded-2xl shadow-lg border border-slate-300 dark:border-slate-800 p-4">
<div class="flex items-start justify-between mb-3">
<div>
  <h1 class="text-lg font-black tracking-tight text-slate-800 dark:text-white uppercase">Trénink počítání</h1>
  <div class="flex items-center gap-1.5 mt-0.5"><span id="currentDate" class="text-[11px] font-medium text-slate-400 dark:text-slate-500"></span></div>
</div>
<div class="flex items-center gap-1">
  <button id="homeBtn" class="p-1.5 rounded-lg hover:bg-slate-300 dark:hover:bg-slate-800 transition-colors text-slate-400 text-lg leading-none hidden-btn">🏠</button>
  <button id="settingsToggle" class="p-1.5 rounded-lg hover:bg-slate-300 dark:hover:bg-slate-800 transition-colors text-slate-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></button>
  <button id="themeToggle" class="p-1.5 rounded-lg hover:bg-slate-300 dark:hover:bg-slate-800 transition-colors"><svg id="themeIconMoon" class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg><svg id="themeIconSun" class="hidden w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
</div>
</div>
<div id="settingsPanel" class="settings-panel mb-3 collapsed">
<div class="grid grid-cols-3 gap-2">
  <div class="flex flex-col"><label class="text-[9px] font-bold uppercase text-slate-500 mb-1 ml-1">Operace</label><select id="operace" class="bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 font-bold text-xs"><option value="+">+</option><option value="-">−</option><option value="*">x</option><option value="/">:</option></select></div>
  <div class="flex flex-col"><label class="text-[9px] font-bold uppercase text-slate-500 mb-1 ml-1">1. Číslo</label><select id="cislice1" class="bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-xs"></select></div>
  <div class="flex flex-col"><label class="text-[9px] font-bold uppercase text-slate-500 mb-1 ml-1">2. Číslo</label><select id="cislice2" class="bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-xs"></select></div>
</div>
</div>
<div id="chyba" class="text-red-500 text-[10px] font-bold text-center h-4 overflow-hidden mb-1" role="alert"></div>
<div id="upperBox" class="bg-slate-200 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-800 rounded-xl pt-4 pl-4 pr-4 pb-1 mb-3 worksheet-bg relative overflow-hidden flex flex-col justify-center">
<div id="problemContainer" class="w-full overflow-x-auto scrollbar-hide flex flex-col items-end relative z-10 transition-all">
  <div id="priklad" class="math-text text-4xl font-semibold tracking-normal text-slate-700 dark:text-slate-200 tabular-nums" style="white-space:break-spaces;"></div>
  <div id="cara" class="math-text text-4xl text-slate-400 dark:text-slate-600 border-t-[3px] border-slate-400 dark:border-slate-600 w-full mt-1 opacity-0 transition-opacity duration-300"></div>
</div>
</div>
<div class="space-y-2.5">
  <div id="inputBox" class="relative bg-white dark:bg-slate-800 rounded-xl border-2 border-slate-300 dark:border-slate-700 focus-within:border-blue-500 transition-all shadow-inner overflow-hidden flex">
    <div id="inputWrapper" class="w-full"><input type="text" id="odpoved" inputmode="text" enterkeyhint="done" autocomplete="off" placeholder="historie" class="w-full pl-4 pr-4 py-1 text-4xl sm:text-4xl font-semibold bg-transparent text-slate-800 dark:text-white outline-none text-center tabular-nums tracking-normal"/></div>
    <div id="inputIcon" class="absolute right-3 top-1/2 -translate-y-1/2 opacity-0 transition-all duration-200 scale-75 pointer-events-none"></div>
  </div>
  <div class="flex gap-2.5 items-stretch">
    <button id="micBtn" type="button" class="flex-shrink-0 px-4 py-3 flex items-center justify-center gap-2 rounded-xl border-2 border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 font-bold text-sm transition-all touch-manipulation whitespace-nowrap"><svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4M12 3a4 4 0 014 4v4a4 4 0 01-8 0V7a4 4 0 014-4z"/></svg><span id="micLabel">Mikrofon</span></button>
    <button id="tlacitko" type="button" class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-black text-base rounded-xl shadow-lg shadow-blue-500/20 transition-all uppercase tracking-widest touch-manipulation btn-pulse flex items-center justify-center">START</button>
  </div>
</div>
</div>
<div id="historyContainer" class="px-1 opacity-0 transition-opacity duration-500 select-none">
<div class="text-[9px] font-bold uppercase text-slate-400 tracking-wider mb-1.5">Historie</div>
<div id="historyList" class="flex flex-wrap gap-1.5"><div id="historyEmpty" class="text-[11px] text-slate-400 italic">Zatím jste nevyřešil(a) žádný příklad</div></div>
</div>
<div class="h-4"></div>
</div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),odpovedEl=$('odpoved'),operaceEl=$('operace'),cis1=$('cislice1'),cis2=$('cislice2'),chybaEl=$('chyba'),prikladEl=$('priklad'),caraEl=$('cara'),btnEl=$('tlacitko'),scoreC=$('scoreCorrect'),scoreW=$('scoreWrong'),streakEl=$('streakCount'),histCont=$('historyContainer'),histList=$('historyList'),histEmpty=$('historyEmpty'),themeToggle=$('themeToggle'),themeIconSun=$('themeIconSun'),themeIconMoon=$('themeIconMoon'),hlasCheck=$('hlasCheck'),micBtn=$('micBtn'),micLabel=$('micLabel'),inputBox=$('inputBox'),homeBtn=$('homeBtn');
const KEY='matika_trenink_v4';
let correct=0,wrong=0,streak=0,history=[],aktualniPriklad=null,zobrazitVysledek=false,isProcessing=false,micListening=false,micAutoRestart=true,spBuf=[],recognition=null;

const today=new Date(),czM='ledna,února,března,dubna,května,června,července,srpna,září,října,listopadu,prosince'.split(','),czD='Neděle,Pondělí,Úterý,Středa,Čtvrtek,Pátek,Sobota'.split(',');
$('currentDate').textContent=`${czD[today.getDay()]} ${today.getDate()}. ${czM[today.getMonth()]} ${today.getFullYear()}`;
const todayStr=today.toISOString().slice(0,10);

const updateThemeIcons=()=>{const d=document.documentElement.classList.contains('dark');themeIconSun.classList.toggle('hidden',!d);themeIconMoon.classList.toggle('hidden',d)};
themeToggle.addEventListener('click',()=>{document.documentElement.classList.toggle('dark');updateThemeIcons()});
updateThemeIcons();

const updateHomeBtn=()=>homeBtn.classList.toggle('hidden-btn',!aktualniPriklad&&!zobrazitVysledek);
homeBtn.addEventListener('click',()=>{if(micListening)stopMic(false);aktualniPriklad=null;zobrazitVysledek=false;isProcessing=false;chybaEl.textContent='';resetToInitialState()});

const fmt=x=>{if(typeof x==='bigint')return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0');if(typeof x!=='number')return String(x);const[c,d]=x.toString().split('.');return c.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0')+(d?','+d:'')};
const fmtInputStr=s=>{s=s.replace(/\s|\u00A0/g,'');const neg=s[0]==='-',abs=neg?s.slice(1):s,[ip,dp]=abs.split('.');return(neg?'-':'')+ip.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0')+(dp!==undefined?','+dp:'')};
const norm=s=>s.trim().replace(/[\s\u00A0]+/g,'').replace(',','.');
const genNum=n=>{const mn=10**(n-1),mx=10**n-1;return Math.floor(Math.random()*(mx-mn+1))+mn};
const trunc4=n=>{const[c,d]=String(n).split('.');return d?c+'.'+d.slice(0,4):c};

const load=()=>{try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(s.date===todayStr){correct=s.correct||0;wrong=s.wrong||0;streak=s.streak||0;history=s.history||[]}if(s.operace)operaceEl.value=s.operace;if(s.cislice1)cis1.value=s.cislice1;if(s.cislice2)cis2.value=s.cislice2}}catch(e){}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({date:todayStr,correct,wrong,streak,history,operace:operaceEl.value,cislice1:cis1.value,cislice2:cis2.value}))}catch(e){}};

for(let i=1;i<=9;i++)cis1.innerHTML+=`<option value="${i}">${i}</option>`,cis2.innerHTML+=`<option value="${i}">${i}</option>`;
if(!localStorage.getItem(KEY)){cis1.value='2';cis2.value='1';operaceEl.value='+'}else load();

const updateCis2=()=>{const op=operaceEl.value,v1=+cis1.value;[...cis2.options].forEach(o=>o.disabled=op==='-'&&+o.value>v1);if(+cis2.value>v1&&op==='-')cis2.value=v1};
updateCis2();
operaceEl.addEventListener('change',()=>{updateCis2();chybaEl.textContent='';save()});
cis1.addEventListener('change',()=>{updateCis2();save()});
cis2.addEventListener('change',save);

const generate=()=>{
  const op=operaceEl.value,n1=+cis1.value,n2=+cis2.value;
  chybaEl.textContent='';
  if(op==='-'&&n1<n2){chybaEl.textContent='❌ Při odčítání musí mít 1. číslo ≥ cifer než 2.';return null}
  let a,b,iter=0;
  while(iter++<1000){a=genNum(n1);b=n2===1?Math.floor(Math.random()*8)+2:genNum(n2);if(op==='-'&&a<=b)continue;if(op==='/'&&b===0)continue;break}
  let vysledek,vysledekZ;
  if(op==='+')vysledek=vysledekZ=a+b;
  else if(op==='-')vysledek=vysledekZ=a-b;
  else if(op==='*')vysledek=vysledekZ=BigInt(a)*BigInt(b);
  else{vysledek=a/b;vysledekZ=trunc4(vysledek)}
  return{a,b,op,vysledek,vysledekZ};
};

const showProblem=p=>{
  const fa=fmt(p.a),fb=fmt(p.b),opUI=p.op==='*'?'x':p.op==='/'?':':p.op==='-'?'−':'+';
  prikladEl.style.whiteSpace='normal';prikladEl.classList.remove('math-text');
  prikladEl.innerHTML=`<div class="flex justify-end gap-3 w-full"><div class="flex flex-col text-right select-none"><div class="invisible">0</div><div>${opUI}</div></div><div class="flex flex-col text-right"><div>${fa}</div><div>${fb}</div></div></div>`;
  caraEl.style.opacity='0';
  odpovedEl.setAttribute('inputmode','decimal');odpovedEl.placeholder='Váš výsledek';odpovedEl.style.textAlign='right';
};

const startNewProblem=()=>{
  const p=generate();if(!p)return false;
  aktualniPriklad=p;showProblem(p);odpovedEl.value='';odpovedEl.classList.remove('hidden-text');spReset();
  zobrazitVysledek=true;updateBtn();updateMicVisibility();updateHomeBtn();
  setTimeout(()=>{caraEl.style.opacity='1';if(hlasCheck.checked)setTimeout(()=>startMic(),100);else odpovedEl.focus();isProcessing=false},50);
  return true;
};

const resetToInitialState=()=>{
  aktualniPriklad=null;zobrazitVysledek=false;odpovedEl.value='';odpovedEl.classList.add('hidden-text');
  odpovedEl.setAttribute('inputmode','text');odpovedEl.placeholder='historie';odpovedEl.style.textAlign='center';
  prikladEl.innerHTML='';caraEl.style.opacity='0';updateMicVisibility();updateBtn();updateHomeBtn();btnEl.focus();
};

const checkDivision=(userStr,p)=>{
  const n=norm(userStr),trueStr=trunc4(p.vysledek),[tc,td=trueStr.split('.')[1]||'']=trueStr.split('.'),[uc,ud=n.split('.')[1]||'']=n.split('.');
  if(uc!==tc)return{ok:false,bracket:0};
  let userDec=ud;while(userDec.length>td.length&&userDec.at(-1)==='0')userDec=userDec.slice(0,-1);
  let truePadded=td;while(truePadded.length<Math.max(userDec.length,td.length))truePadded+='0';
  for(let i=0;i<userDec.length;i++)if(userDec[i]!==truePadded[i])return{ok:false,bracket:i+1};
  return{ok:true,bracket:userDec.length};
};

const check=(input,p)=>{
  const n=norm(input);if(!n)return false;
  if(p.op==='/')return checkDivision(input,p).ok;
  if(typeof p.vysledek==='bigint'){try{return BigInt(n)===p.vysledek}catch(e){return false}}
  const num=parseFloat(n);return!isNaN(num)&&Math.abs(num-p.vysledek)<1e-9;
};

const findFirstWrongDigit=(userInput,p)=>{
  const n=norm(userInput);let cs,us;
  if(typeof p.vysledek==='bigint'){cs=p.vysledek.toString();try{us=BigInt(n).toString()}catch(e){return 1}}
  else{cs=String(p.vysledek);us=String(parseFloat(n))}
  const ml=Math.max(cs.length,us.length);
  for(let i=0;i<ml;i++)if((cs[i]||'')!==(us[i]||''))return i+1;
  return 0;
};

const updateScores=()=>{scoreC.textContent=correct;scoreW.textContent=wrong;streakEl.textContent=streak;streakEl.parentElement.classList.add('pop');setTimeout(()=>streakEl.parentElement.classList.remove('pop'),200)};
const updateBtn=()=>{btnEl.classList.remove('btn-pulse','btn-glow');if(!zobrazitVysledek){btnEl.textContent='START';btnEl.classList.add('btn-pulse')}else{btnEl.textContent='✓ VÝSLEDEK (kontrola)';btnEl.classList.add('btn-glow')}};

const renderHistory=()=>{
  if(!history.length){histEmpty.style.display='block';histCont.style.opacity='0';histList.querySelectorAll('.hi').forEach(e=>e.remove());return}
  histEmpty.style.display='none';histCont.style.opacity='1';histList.querySelectorAll('.hi').forEach(e=>e.remove());
  history.forEach((h,i)=>{const d=document.createElement('div');d.className='hi slide-up px-2.5 py-1 rounded-md text-[12px] tabular-nums font-bold border '+(h.correct?'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300':'bg-rose-50 dark:bg-rose-900/20 border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300');d.style.animationDelay=i*50+'ms';d.textContent=h.text+' '+(h.correct?'✓':'✗');histList.appendChild(d)});
};

const addHist=(ok,userInput)=>{
  if(!aktualniPriklad)return;
  const p=aktualniPriklad,v=p.vysledekZ!==undefined?p.vysledekZ:p.vysledek,opStr=p.op==='*'?'x':p.op==='/'?':':p.op==='-'?'−':'+';
  let bracketStr='';
  if(p.op==='/')bracketStr='('+checkDivision(userInput,p).bracket+')';
  else if(!ok){const pos=findFirstWrongDigit(userInput,p);if(pos>0)bracketStr='('+pos+')'}
  history.unshift({text:`${fmt(p.a)} ${opStr} ${fmt(p.b)} = ${fmt(v)}${bracketStr}`,correct:ok});
  renderHistory();
};

const WV=(s=>{const o={};s.split(';').forEach(p=>{const[v,w]=p.split(':');w.split(',').forEach(x=>o[x]=+v)});return o})('0:žádná,zadna,nula,nulu,nuly;1:jedna,jeden,jedno,jednu,jedné;2:dvě,dva,dvou;3:tři,třech;4:čtyři,čtyřech;5:pět,pěti;6:šest,šesti;7:sedm,sedmi;8:osm,osmi;9:devět,devíti;10:deset,deseti;11:jedenáct,jedenácti;12:dvanáct,dvanácti;13:třináct,třinácti;14:čtrnáct,čtrnácti;15:patnáct,patnácti;16:šestnáct,šestnácti;17:sedmnáct,sedmnácti;18:osmnáct,osmnácti;19:devatenáct,devatenácti;20:dvacet,dvaceti;30:třicet,třiceti;40:čtyřicet,čtyřiceti;50:padesát,padesáti;60:šedesát,šedesáti;70:sedmdesát,sedmdesáti;80:osmdesát,osmdesáti;90:devadesát,devadesáti;100:sto,sta,stu,stem,stě;200:dvěstě,dvěsta;300:třista,třísta;400:čtyřista,čtyřsta');
const IGNORE_WORDS=(s=>{const o={};s.split(',').forEach(x=>o[x]=1);return o})('tisíc,tisíce,tisíců,tisíci,tisícům,tisícem,tisících,milion,milión,miliony,milióny,milionu,miliónu,milionů,miliónů,miliarda,miliardy,miliard,miliardě,miliardám,miliardou,miliardách');
const DEC_RE=/(?:^|\s)(celá|celé|celých|celych|cely|celi|cela|čárka|čárku|carka|carku|tečka|tečku|tecka|tecku)(?:\s|$)/;

const evalPhrase=(phrase,words,startIdx,len)=>{
  if(/^\d+$/.test(phrase))return phrase;
  if(WV[phrase]!==undefined)return WV[phrase];
  const w0=words[startIdx],w1=words[startIdx+1],w2=words[startIdx+2],w3=words[startIdx+3];
  if(len>=2){
    if(['set','sto','sta','stu','stě'].includes(w1)&&WV[w0]>=2&&WV[w0]<=9)return WV[w0]*100;
    if(WV[w0]>=20&&WV[w0]<=90&&WV[w1]>=1&&WV[w1]<=9)return WV[w0]+WV[w1];
    if(['sto','sta','stu','stě'].includes(w0)){
      if(WV[w1]!==undefined&&WV[w1]<=99)return 100+WV[w1];
      if(/^\d+$/.test(w1))return 100+parseInt(w1,10);
    }
  }
  if(len>=3){
    const isH=['set','sto','sta','stu','stě'].includes(w1)&&WV[w0]>=2&&WV[w0]<=9;
    if(isH){
      const h=WV[w0]*100;
      if(len===3){if(WV[w2]!==undefined&&WV[w2]<=99)return h+WV[w2];if(/^\d+$/.test(w2))return h+parseInt(w2,10)}
      if(len===4&&WV[w2]>=20&&WV[w2]<=90&&WV[w3]>=1&&WV[w3]<=9)return h+WV[w2]+WV[w3];
    }
    if(['sto','sta','stu','stě'].includes(w0)&&len===3&&WV[w1]>=20&&WV[w1]<=90&&WV[w2]>=1&&WV[w2]<=9)return 100+WV[w1]+WV[w2];
  }
  return null;
};

const parseVoiceTokens=words=>{
  const result=[];let i=0;
  while(i<words.length){
    const w=words[i];
    if(!w||IGNORE_WORDS[w]){i++;continue}
    let matched=false;
    for(let len=4;len>=1;len--){
      if(i+len>words.length)continue;
      const phrase=words.slice(i,i+len).join(' '),val=evalPhrase(phrase,words,i,len);
      if(val!==null&&((typeof val==='number'&&val>=0)||(typeof val==='string'&&/^\d+$/.test(val)))){result.push(val);i+=len;matched=true;break}
    }
    if(!matched)i++;
  }
  return result;
};

const expandCompound=t=>t.replace(/dvěstě/g,'dvě stě').replace(/třista/g,'tři sta').replace(/čtyřista/g,'čtyři sta').replace(/([a-záčďéěíňóřšťúůýž]+)set\b/g,'$1 set').replace(/(dvacet|třicet|čtyřicet|padesát|šedesát|sedmdesát|osmdesát|devadesát)(jedna|jeden|dvě|dva|tři|čtyři|pět|šest|sedm|osm|devět)/g,'$1 $2');

const updateMicVisibility=()=>{const show=hlasCheck.checked&&zobrazitVysledek&&aktualniPriklad;micBtn.classList.toggle('shown',!!show);if(!show&&micListening)stopMic(false)};

const buildRecognition=()=>{
  if(!SpeechRecognition)return null;
  const r=new SpeechRecognition();
  r.lang='cs-CZ';r.continuous=true;r.interimResults=false;r.maxAlternatives=1;
  r.onstart=()=>{micListening=true;micBtn.classList.add('listening');micLabel.textContent='Mluvte…';inputBox.style.borderColor='#ef4444'};
  r.onend=()=>{micListening=false;micBtn.classList.remove('listening');micLabel.textContent='Mikrofon';inputBox.style.borderColor='';if(micAutoRestart&&hlasCheck.checked&&zobrazitVysledek)setTimeout(()=>{if(!micListening&&hlasCheck.checked&&zobrazitVysledek)r.start()},300)};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-available'){micAutoRestart=false;hlasCheck.checked=false;updateMicVisibility();chybaEl.textContent='⚠️ Mikrofon není dostupný'}micListening=false};
  r.onresult=e=>{
    let finalText='';
    for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)finalText+=e.results[i][0].transcript+' ';
    if(!finalText.trim())return;
    let raw=finalText.trim().toLowerCase().replace(/(\d)\s+(?=\d)/g,'$1').replace(/[,.]/g,' čárka ').replace(/[?!;:_]/g,'').replace(/\b(ukázat|ukazat|ukažte|ukazte|ukaž|ukaš)\b/g,' ');
    if(/chyba/.test(raw)){spReset();return}
    const zpetPocet=(raw.match(/\b(zpět|spjet)\b/g)||[]).length;
    for(let z=0;z<zpetPocet;z++)spBackspace();
    if(zpetPocet>0){raw=raw.replace(/\b(zpět|spjet)\b/g,'').trim();if(!raw)return}
    let hasZero=false;
    if(/\b(zero|zirou|zírou)\b/.test(raw)){hasZero=true;const m=raw.match(/\b(zero|zirou|zírou)\b/g);for(let i=0;i<m.length;i++)spAppendZeros();raw=raw.replace(/\b(zero|zirou|zírou)\b/g,'').trim();if(!raw)return}
    let shouldSubmit=false;
    if(/\b(ano|jo|joo)\b/.test(raw)){shouldSubmit=true;raw=raw.replace(/\b(ano|jo|joo)\b/g,'')}
    raw=expandCompound(raw).trim();
    if(raw){
      const decMatch=raw.match(DEC_RE);
      if(decMatch){
        const before=raw.slice(0,decMatch.index).trim();
        const bTokens=before?parseVoiceTokens(before.split(/\s+/).filter(Boolean)):[];
        const after=raw.slice(decMatch.index+decMatch[0].length).trim();
        const aTokens=after?parseVoiceTokens(after.split(/\s+/).filter(Boolean)):[];
        spApplyTokens([...bTokens,'.',...aTokens]);
      }else spApplyTokens(parseVoiceTokens(raw.split(/\s+/).filter(Boolean)));
    }
    if(shouldSubmit){micAutoRestart=false;stopMic(false);setTimeout(()=>handle(null,true),100)}
  };
  return r;
};

const startMic=()=>{if(!SpeechRecognition){chybaEl.textContent='⚠️ Prohlížeč nepodporuje hlasový vstup';return}if(micListening)return;micAutoRestart=true;if(!recognition)recognition=buildRecognition();try{recognition.start()}catch(e){}};
const stopMic=reset=>{micAutoRestart=false;if(recognition&&micListening)try{recognition.stop()}catch(e){}if(reset)recognition=null;micListening=false;micBtn.classList.remove('listening');micLabel.textContent='Mikrofon';inputBox.style.borderColor=''};

hlasCheck.addEventListener('change',()=>{updateMicVisibility();if(!hlasCheck.checked)stopMic(true);else if(zobrazitVysledek&&aktualniPriklad)setTimeout(()=>startMic(),100)});
micBtn.addEventListener('click',()=>micListening?stopMic(false):startMic());
micBtn.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});

const spReset=()=>{odpovedEl.value=''};
const spBackspace=()=>{const cur=norm(odpovedEl.value);if(!cur)return;const nv=cur.slice(0,-1);odpovedEl.value=nv?fmtInputStr(nv):''};
const spFlush=()=>{};
const spAppendZeros=()=>{const cur=norm(odpovedEl.value);const di=cur?cur.indexOf('.'):-1;if(di!==-1){odpovedEl.value=fmtInputStr(cur.slice(0,di+1)+cur.slice(di+1)+'000')}else if(!cur){odpovedEl.value='000'}else{odpovedEl.value=fmtInputStr(cur+'000')}};
const spApplyTokens=tokens=>{let cur=norm(odpovedEl.value)||'';for(const tok of tokens){if(tok==='.'){if(!cur.includes('.'))cur=(cur||'0')+'.';continue}const di=cur.indexOf('.');if(di!==-1){cur=cur.slice(0,di+1)+cur.slice(di+1)+String(tok)}else if(!cur){cur=String(tok)}else if(cur==='0'){cur=String(tok)}else{cur+=String(tok).padStart(3,'0')}}odpovedEl.value=cur?fmtInputStr(cur):''};

const handle=(e,fromVoice)=>{
  if(isProcessing)return;
  isProcessing=true;
  if(e)e.preventDefault();
  if(!fromVoice&&micListening)stopMic(false);
  const P=odpovedEl.parentElement.parentElement;
  P.classList.remove('zelene','cervene');odpovedEl.classList.remove('text-white');

  if(!aktualniPriklad&&!zobrazitVysledek){
    const inputVal=odpovedEl.value.trim();
    if(!inputVal){if(startNewProblem())return;isProcessing=false;return}
    if(inputVal.toLowerCase()==='vymazat'){
      history=[];correct=0;wrong=0;streak=0;
      updateScores();renderHistory();save();
      chybaEl.textContent='✅ Historie smazána';
      setTimeout(()=>chybaEl.textContent='',2000);
      if(startNewProblem())return;
      isProcessing=false;return;
    }
    chybaEl.textContent='⚠️ Špatné heslo';
    setTimeout(()=>chybaEl.textContent='',2000);
    resetToInitialState();
    isProcessing=false;return;
  }

  if(zobrazitVysledek&&aktualniPriklad){
    const val=odpovedEl.value.trim(),normVal=norm(val);
    if(!val){
      const vv=aktualniPriklad.vysledekZ!==undefined?aktualniPriklad.vysledekZ:aktualniPriklad.vysledek;
      odpovedEl.value=fmt(vv);odpovedEl.classList.remove('hidden-text');
      zobrazitVysledek=false;updateBtn();updateMicVisibility();btnEl.focus();
      setTimeout(()=>isProcessing=false,50);
      return;
    }
    if(!/^-?\d+([.,]\d*)?$/.test(normVal)){chybaEl.textContent='⚠️ Nepovolený znak!';isProcessing=false;if(!fromVoice)odpovedEl.focus();return}
    odpovedEl.value=fmtInputStr(normVal);
    const ok=aktualniPriklad.op==='/'?checkDivision(normVal,aktualniPriklad).ok:check(normVal,aktualniPriklad);
    P.classList.add(ok?'zelene':'cervene');odpovedEl.classList.add('text-white');
    if(ok){correct++;streak++}else{wrong++;streak=0;P.classList.add('shake');setTimeout(()=>P.classList.remove('shake'),500)}
    updateScores();addHist(ok,normVal);save();
    zobrazitVysledek=false;updateBtn();updateMicVisibility();btnEl.focus();
    setTimeout(()=>isProcessing=false,150);
    return;
  }

  if(aktualniPriklad&&!zobrazitVysledek){if(startNewProblem())return;isProcessing=false}
};

btnEl.addEventListener('touchstart',e=>handle(e,false),{passive:false});
btnEl.addEventListener('click',e=>{if(e.pointerType!=='touch')handle(e,false)});
odpovedEl.addEventListener('keydown',e=>{if(e.key==='Enter')handle(e,false)});
$('settingsToggle').addEventListener('click',()=>$('settingsPanel').classList.toggle('collapsed'));

updateScores();updateBtn();renderHistory();resetToInitialState();
})();
</script>
