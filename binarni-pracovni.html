<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binární Trénink</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --text-color: #1d1d1f;
            --container-bg: #ffffff;
            --border-color: #d2d2d7;
            --btn-bg: #e8e8ed;
            --btn-hover: #d2d2d7;
            --primary-bg: #0071e3;
            --primary-text: #ffffff;
            --success: #34c759;
            --error: #ff3b30;
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --text-color: #f5f5f7;
            --container-bg: #1c1c1e;
            --border-color: #38383a;
            --btn-bg: #2c2c2e;
            --btn-hover: #3a3a3c;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; margin: 0; padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            background-color: var(--container-bg); border-radius: 16px;
            padding: 24px; width: 100%; max-width: 480px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.05);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; margin: 0; }
        
        .toggle-theme {
            background: var(--btn-bg); color: var(--text-color);
            border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer;
        }

        .settings-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        select, .direction-toggle {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid var(--border-color); background: var(--container-bg);
            color: var(--text-color); font-size: 16px;
        }

        .info-text { font-size: 14px; color: #86868b; text-align: center; margin-bottom: 20px; }

        /* Pevná výška pro herní plochu, aby tlačítko neskákalo */
        .game-area {
            min-height: 280px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin-bottom: 20px;
        }

        #secret-input {
            width: 100%; padding: 12px; border-radius: 8px; text-align: center;
            border: 1px solid var(--border-color); background: var(--container-bg);
            color: var(--text-color); font-size: 16px; margin-bottom: 20px;
        }

        .question { font-size: 32px; font-weight: bold; margin-bottom: 20px; display: none; text-align: center;}

        .boxes { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
        .box {
            width: 40px; height: 50px; border: 2px solid var(--border-color);
            border-radius: 8px; display: flex; justify-content: center; align-items: center;
            font-size: 24px; font-weight: bold;
        }
        .box.filled { border-color: var(--text-color); }
        .box.correct { background-color: var(--success); color: white; border-color: var(--success); }
        .box.error { background-color: var(--error); color: white; border-color: var(--error); }

        .keypad { display: grid; gap: 10px; width: 100%; display: none; }
        .keypad.bin { grid-template-columns: 1fr 1fr; }
        .keypad.dec { grid-template-columns: repeat(3, 1fr); }
        
        .key-btn {
            background: var(--btn-bg); color: var(--text-color);
            border: none; padding: 16px; border-radius: 8px;
            font-size: 20px; font-weight: bold; cursor: pointer;
        }
        .key-btn:active { background: var(--btn-hover); }
        .key-btn.del { background: #ffcc00; color: #000; } /* Zvýrazněné tlačítko smazat */

        .main-action {
            width: 100%; padding: 16px; border-radius: 12px;
            background: var(--primary-bg); color: var(--primary-text);
            border: none; font-size: 18px; font-weight: bold; cursor: pointer;
            transition: opacity 0.2s;
        }
        .main-action:active { opacity: 0.8; }

        .history-container { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .history-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; }
        .history-list { display: flex; flex-direction: column; gap: 8px; }
        .history-item {
            padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 16px;
            color: white; display: inline-block; width: fit-content;
        }
        .history-item.correct { background-color: var(--success); }
        .history-item.error { background-color: var(--error); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Binární Trénink</h1>
        <button class="toggle-theme" onclick="toggleTheme()">Režim</button>
    </div>

    <div class="settings-group" id="settings">
        <select class="direction-toggle" id="direction" onchange="updateInfo()">
            <option value="dec2bin">Decimální na Binární</option>
            <option value="bin2dec">Binární na Decimální</option>
        </select>
        <select id="bits" onchange="updateInfo()">
            <!-- Možnosti vygeneruje JS -->
        </select>
    </div>
    
    <div class="info-text" id="info"></div>

    <div class="game-area">
        <input type="text" id="secret-input" placeholder="Zde můžete smazat historii...">
        
        <div class="question" id="question-display"></div>
        <div class="boxes" id="boxes-container"></div>
        
        <div class="keypad bin" id="keypad-bin">
            <button class="key-btn" onclick="typeVal('0')">0</button>
            <button class="key-btn" onclick="typeVal('1')">1</button>
            <button class="key-btn del" style="grid-column: span 2;" onclick="deleteLast()">Smazat krok</button>
        </div>

        <div class="keypad dec" id="keypad-dec">
            <button class="key-btn" onclick="typeVal('1')">1</button>
            <button class="key-btn" onclick="typeVal('2')">2</button>
            <button class="key-btn" onclick="typeVal('3')">3</button>
            <button class="key-btn" onclick="typeVal('4')">4</button>
            <button class="key-btn" onclick="typeVal('5')">5</button>
            <button class="key-btn" onclick="typeVal('6')">6</button>
            <button class="key-btn" onclick="typeVal('7')">7</button>
            <button class="key-btn" onclick="typeVal('8')">8</button>
            <button class="key-btn" onclick="typeVal('9')">9</button>
            <button class="key-btn del" onclick="deleteLast()">Smazat</button>
            <button class="key-btn" onclick="typeVal('0')">0</button>
        </div>
    </div>

    <button class="main-action" id="main-btn" onclick="handleMainAction()">START</button>

    <div class="history-container" id="history-container" style="display: none;">
        <div class="history-title">Dnešní historie:</div>
        <div class="history-list" id="history-list"></div>
    </div>
</div>

<script>
    // --- STAV APLIKACE ---
    let state = 'init'; // init, playing, evaluated
    let currentDecValue = 0;
    let expectedAnswer = "";
    let userInput = "";
    let expectedLength = 0;

    // --- INICIALIZACE ---
    function initApp() {
        const bitSelect = document.getElementById('bits');
        for (let i = 5; i <= 15; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerHTML = `Trénink na ${i} bitů`;
            bitSelect.appendChild(opt);
        }
        checkHistoryDate();
        updateInfo();
        renderHistory();
    }

    // --- MOTIV (Světlý/Tmavý) ---
    function toggleTheme() {
        const body = document.body;
        body.dataset.theme = body.dataset.theme === 'dark' ? 'light' : 'dark';
    }

    // --- INFO TEXT ---
    function updateInfo() {
        const bits = parseInt(document.getElementById('bits').value);
        const maxNum = Math.pow(2, bits) - 1;
        document.getElementById('info').innerText = `Trénujete čísla od 0 do ${maxNum}`;
    }

    // --- LOGIKA TLAČÍTKA A STAVŮ ---
    function handleMainAction() {
        const btn = document.getElementById('main-btn');
        
        if (state === 'init') {
            const secret = document.getElementById('secret-input').value.trim().toLowerCase();
            if (secret === 'historie') {
                localStorage.removeItem('binTrainHistory');
                renderHistory();
            }
            document.getElementById('secret-input').style.display = 'none';
            document.getElementById('settings').style.display = 'none'; // Skryje nastavení během hry
            startGame();
        } 
        else if (state === 'playing') {
            checkAnswer();
        } 
        else if (state === 'evaluated') {
            startGame();
        }
    }

    function startGame() {
        state = 'playing';
        userInput = "";
        const btn = document.getElementById('main-btn');
        btn.innerText = "VÝSLEDEK (KONTROLA)";
        
        const bits = parseInt(document.getElementById('bits').value);
        const direction = document.getElementById('direction').value;
        const maxNum = Math.pow(2, bits) - 1;
        
        currentDecValue = Math.floor(Math.random() * (maxNum + 1));
        const binString = currentDecValue.toString(2).padStart(bits, '0');

        document.getElementById('question-display').style.display = 'block';

        if (direction === 'dec2bin') {
            document.getElementById('question-display').innerText = currentDecValue;
            expectedAnswer = binString;
            expectedLength = bits;
            document.getElementById('keypad-bin').style.display = 'grid';
            document.getElementById('keypad-dec').style.display = 'none';
        } else {
            document.getElementById('question-display').innerText = binString;
            expectedAnswer = currentDecValue.toString();
            // Délka podle maximálního možného počtu cifer v decimální podobě (pro 15 bitů je to max 32767 -> 5)
            expectedLength = maxNum.toString().length; 
            document.getElementById('keypad-bin').style.display = 'none';
            document.getElementById('keypad-dec').style.display = 'grid';
        }

        renderBoxes();
    }

    // --- ZADÁVÁNÍ DO CHLÍVEČKŮ ---
    function typeVal(val) {
        if (state !== 'playing' || userInput.length >= expectedLength) return;
        userInput += val;
        renderBoxes();
    }

    function deleteLast() {
        if (state !== 'playing' || userInput.length === 0) return;
        userInput = userInput.slice(0, -1);
        renderBoxes();
    }

    function renderBoxes() {
        const container = document.getElementById('boxes-container');
        container.innerHTML = '';
        
        for (let i = 0; i < expectedLength; i++) {
            const box = document.createElement('div');
            box.className = 'box';
            if (i < userInput.length) {
                box.innerText = userInput[i];
                box.classList.add('filled');
            }
            container.appendChild(box);
        }
    }

    // --- KONTROLA A VYHODNOCENÍ ---
    function checkAnswer() {
        // Pokud uživatel nezadal vše, nedovolíme kontrolu (aby neztratil pokus omylem)
        const direction = document.getElementById('direction').value;
        if (direction === 'dec2bin' && userInput.length < expectedLength) {
            alert('Vyplňte prosím všechny chlívečky.');
            return;
        }
        if (userInput.length === 0) return;

        state = 'evaluated';
        document.getElementById('main-btn').innerText = "DALŠÍ";

        const isCorrect = (userInput === expectedAnswer || parseInt(userInput) === parseInt(expectedAnswer)); // ošetření např. 07 vs 7 u dec
        
        // Zbarvení chlívečků
        const boxes = document.querySelectorAll('.box');
        boxes.forEach(box => {
            if(box.innerText !== "") box.classList.add(isCorrect ? 'correct' : 'error');
        });

        // Zápis do historie (formát např. 00111=7)
        const binStr = (direction === 'dec2bin') ? expectedAnswer : document.getElementById('question-display').innerText;
        const decStr = (direction === 'dec2bin') ? currentDecValue : expectedAnswer;
        saveToHistory(`${binStr}=${decStr}`, isCorrect);
    }

    // --- HISTORIE ---
    function getTodayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    }

    function checkHistoryDate() {
        const lastDate = localStorage.getItem('binTrainDate');
        const today = getTodayStr();
        if (lastDate !== today) {
            localStorage.removeItem('binTrainHistory');
            localStorage.setItem('binTrainDate', today);
        }
    }

    function saveToHistory(text, isCorrect) {
        let history = JSON.parse(localStorage.getItem('binTrainHistory') || '[]');
        history.unshift({ text, isCorrect }); // přidá na začátek
        localStorage.setItem('binTrainHistory', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('binTrainHistory') || '[]');
        const container = document.getElementById('history-container');
        const list = document.getElementById('history-list');
        
        list.innerHTML = '';
        if (history.length === 0) {
            container.style.display = 'none';
            return;
        }
        
        container.style.display = 'block';
        history.forEach(item => {
            const div = document.createElement('div');
            div.className = `history-item ${item.isCorrect ? 'correct' : 'error'}`;
            div.innerText = item.text;
            list.appendChild(div);
        });
    }

    // Spuštění po načtení
    window.onload = initApp;

</script>
</body>
</html>
