<script>a
    let state = 'init';
    let currentDecValue = 0;
    let expectedAnswerValue = 0; // číselná hodnota očekávané odpovědi
    let bitsSetting = 5;

    // === NOVÉ POMOCNÉ FUNKCE ===

    function formatDecimal(num) {
        return num.toLocaleString('cs-CZ');
    }

    // Formátuje binární řetězec MEZERAMI ZPRAVA PO 5 ZNACÍCH
    function formatBinaryWithSpaces(binStr) {
        if (!binStr || binStr === "") return "";
        let clean = binStr.replace(/\s/g, '');
        if (clean.length === 0) return "";
        
        // Rozdělíme zprava po 5
        let parts = [];
        for (let i = clean.length; i > 0; i -= 5) {
            parts.unshift(clean.slice(Math.max(0, i - 5), i));
        }
        return parts.join(' ');
    }

    // Doplní nuly zleva na cílovou délku
    function padToLength(binStr, targetLength) {
        let clean = binStr.replace(/\s/g, '');
        if (clean.length >= targetLength) return clean;
        return clean.padStart(targetLength, '0');
    }

    // Určí cílovou délku podle DÉLKY VSTUPU (pro špatné odpovědi)
    function getTargetLengthByInput(input) {
        let len = input.replace(/\s/g, '').length;
        if (len <= 5) return 5;
        if (len <= 10) return 10;
        return 15;
    }

    // Určí cílovou délku podle NASTAVENÍ BITS (pro správné odpovědi a historii)
    function getTargetLengthByBits(bits) {
        if (bits == 5) return 5;
        if (bits >= 6 && bits <= 10) return 10;
        return 15; // 11-15
    }

    // Extrahuje číslice (pro dec)
    function extractDigits(input) {
        return input.replace(/\D/g, '');
    }

    // Zobrazí dočasnou chybovou hlášku
    function showError(message) {
        const secretInput = document.getElementById('secret-input');
        const originalDisplay = secretInput.style.display;
        const originalValue = secretInput.value;
        
        secretInput.style.display = 'block';
        secretInput.value = message;
        secretInput.style.color = '#ff3b30';
        secretInput.style.fontWeight = 'bold';
        
        setTimeout(() => {
            secretInput.style.display = originalDisplay;
            secretInput.value = originalValue;
            secretInput.style.color = '';
            secretInput.style.fontWeight = '';
        }, 2000);
    }

    // === EXISTUJÍCÍ FUNKCE – UPRAVENY ===

    function initApp() {
        const savedTheme = localStorage.getItem('binTrainTheme') || 'light';
        document.body.dataset.theme = savedTheme;
        document.getElementById('theme-btn').innerText = savedTheme === 'dark' ? '☀️' : '🌙';

        const bitSelect = document.getElementById('bits');
        for (let i = 5; i <= 15; i++) {
            const maxVal = Math.pow(2, i) - 1;
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerHTML = `${i} bitů ≤ ${formatDecimal(maxVal)}`;
            bitSelect.appendChild(opt);
        }

        const savedDir = localStorage.getItem('binTrainDir');
        if (savedDir) document.getElementById('direction').value = savedDir;
        const savedBits = localStorage.getItem('binTrainBits');
        if (savedBits) document.getElementById('bits').value = savedBits;

        document.getElementById('settings-panel').style.display = 'none';
        document.getElementById('info').style.display = 'none';

        updateTitle();
        checkHistoryDate();
        updateInfo();
        renderHistory();

        goHome();
    }

    function updateTitle() {
        const direction = document.getElementById('direction').value;
        const titleEl = document.getElementById('app-title');
        if (direction === 'dec2bin') {
            titleEl.innerText = 'Bináry   DEC → BIN';
        } else {
            titleEl.innerText = 'Bináry   BIN → DEC';
        }
    }

    function goHome() {
        state = 'init';
        document.getElementById('home-btn').style.display = 'none';
        document.getElementById('secret-input').style.display = 'block';
        document.getElementById('secret-input').value = '';
        document.getElementById('question-display').style.display = 'none';
        document.getElementById('single-input').style.display = 'none';
        document.getElementById('keypad-bin').style.display = 'none';
        document.getElementById('keypad-dec').style.display = 'none';
        document.getElementById('main-btn').innerText = "START";
        document.getElementById('secret-input').focus();
    }

    function toggleTheme() {
        const body = document.body;
        const isDark = body.dataset.theme === 'dark';
        const newTheme = isDark ? 'light' : 'dark';
        body.dataset.theme = newTheme;
        document.getElementById('theme-btn').innerText = newTheme === 'dark' ? '☀️' : '🌙';
        localStorage.setItem('binTrainTheme', newTheme);
    }

    function toggleSettings() {
        const panel = document.getElementById('settings-panel');
        const info = document.getElementById('info');
        const isHidden = panel.style.display === 'none' || panel.style.display === '';
        
        if (isHidden) {
            panel.style.display = 'flex';
            info.style.display = 'block';
        } else {
            panel.style.display = 'none';
            info.style.display = 'none';
        }
    }

    function updateInfo() {
        const bits = parseInt(document.getElementById('bits').value);
        bitsSetting = bits;
        const direction = document.getElementById('direction').value;
        localStorage.setItem('binTrainBits', bits);
        localStorage.setItem('binTrainDir', direction);
        const maxNum = Math.pow(2, bits) - 1;
        document.getElementById('info').innerText = `Rozsah: 0 až ${formatDecimal(maxNum)}`;
        
        updateTitle();
        
        if (state === 'playing') startGame();
    }

    function handleMainAction() {
        if (state === 'init') {
            const secret = document.getElementById('secret-input').value.trim();
            if (secret.toLowerCase() === 'vymazat') {
                localStorage.removeItem('binTrainHistory');
                renderHistory();
            }
            document.getElementById('secret-input').style.display = 'none';
            startGame();
        } else if (state === 'playing') {
            checkAnswer();
        } else if (state === 'evaluated') {
            startGame();
        }
    }

    document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            if (state === 'init') {
                handleMainAction();
            } else if (state === 'playing') {
                checkAnswer();
            }
        }
    });

    // Validace při psaní – jen povolené znaky
    document.getElementById('single-input').addEventListener('input', function(e) {
        const direction = document.getElementById('direction').value;
        if (direction === 'dec2bin') {
            let val = this.value;
            if (/[^01\s]/.test(val)) {
                showError("Nepovolený znak!");
                this.value = val.replace(/[^01\s]/g, '');
                return;
            }
            let digitsOnly = val.replace(/\s/g, '');
            if (digitsOnly.length > 15) {
                showError("Maximálně 15 číslic (0/1)");
                let keepDigits = 15;
                let trimmedVal = "";
                for (let char of val) {
                    if (char === '0' || char === '1') {
                        if (keepDigits > 0) {
                            trimmedVal += char;
                            keepDigits--;
                        }
                    } else {
                        trimmedVal += char;
                    }
                }
                this.value = trimmedVal;
            }
        }
    });

    function startGame() {
        state = 'playing';
        document.getElementById('home-btn').style.display = 'block';
        document.getElementById('main-btn').innerText = "VÝSLEDEK (KONTROLA)";
        
        const bits = parseInt(document.getElementById('bits').value);
        bitsSetting = bits;
        const direction = document.getElementById('direction').value;
        const maxNum = Math.pow(2, bits) - 1;
        
        currentDecValue = Math.floor(Math.random() * (maxNum + 1));
        expectedAnswerValue = currentDecValue;

        document.getElementById('question-display').style.display = 'block';
        document.getElementById('single-input').style.display = 'block';
        document.getElementById('single-input').value = '';
        document.getElementById('single-input').className = '';
        document.getElementById('single-input').disabled = false;
        document.getElementById('single-input').focus();

        if (direction === 'dec2bin') {
            document.getElementById('question-display').innerText = formatDecimal(currentDecValue);
            document.getElementById('keypad-bin').style.display = 'grid';
            document.getElementById('keypad-dec').style.display = 'none';
        } else {
            const binStr = currentDecValue.toString(2);
            const formattedBin = formatBinaryWithSpaces(binStr);
            document.getElementById('question-display').innerText = formattedBin;
            document.getElementById('keypad-bin').style.display = 'none';
            document.getElementById('keypad-dec').style.display = 'grid';
        }
    }

    function typeVal(val) {
        if (state !== 'playing') return;
        const direction = document.getElementById('direction').value;
        const input = document.getElementById('single-input');
        
        if (direction === 'bin2dec') {
            if (input.value.length >= 6) return;
            input.value += val;
        } else {
            if (val !== '0' && val !== '1' && val !== ' ') {
                showError("Nepovolený znak!");
                return;
            }
            if (val !== ' ') {
                let digitsOnly = input.value.replace(/\s/g, '');
                if (digitsOnly.length >= 15) {
                    showError("Maximálně 15 číslic (0/1)");
                    return;
                }
            }
            input.value += val;
        }
    }

    function checkAnswer() {
        const direction = document.getElementById('direction').value;
        const inputEl = document.getElementById('single-input');
        const rawValue = inputEl.value.trim();
        
        if (direction === 'bin2dec') {
            if (rawValue === '') {
                state = 'evaluated';
                document.getElementById('main-btn').innerText = "START";
                inputEl.disabled = true;
                inputEl.value = formatDecimal(expectedAnswerValue);
                inputEl.className = '';
                return;
            }
            
            const cleanDigits = extractDigits(rawValue);
            if (cleanDigits === '') {
                showError("Zadejte číslo");
                return;
            }
            
            const userValue = parseInt(cleanDigits, 10);
            const isCorrect = (userValue === expectedAnswerValue);
            const formattedCorrect = formatDecimal(expectedAnswerValue);
            
            state = 'evaluated';
            document.getElementById('main-btn').innerText = "START";
            inputEl.disabled = true;
            
            if (isCorrect) {
                inputEl.className = 'success';
                inputEl.value = formattedCorrect;
            } else {
                inputEl.className = 'error';
                // Necháme původní vstup (jen s mezerami od uživatele)
            }
            
            // Historie: otázka (bin) = správná odpověď (dec)
            const questionBin = document.getElementById('question-display').innerText;
            saveToHistory(`${questionBin} = ${formattedCorrect}`, isCorrect);
            
        } else {
            if (rawValue === '') {
                state = 'evaluated';
                document.getElementById('main-btn').innerText = "START";
                inputEl.disabled = true;
                const correctBin = expectedAnswerValue.toString(2);
                inputEl.value = formatBinaryWithSpaces(correctBin);
                inputEl.className = '';
                return;
            }

            // Kontrola znaků
            if (/[^01\s]/.test(rawValue)) {
                showError("Nepovolený znak!");
                return;
            }
            
            const cleanInput = rawValue.replace(/\s/g, '');
            if (cleanInput === '') {
                showError("Zadejte binární číslo");
                return;
            }
            
            const userValue = parseInt(cleanInput, 2);
            const isCorrect = (userValue === expectedAnswerValue);
            
            state = 'evaluated';
            document.getElementById('main-btn').innerText = "START";
            inputEl.disabled = true;
            
            // === KLÍČOVÁ LOGIKA ===
            if (isCorrect) {
                // SPRÁVNĚ: zobrazíme oficiální formu podle bits
                const targetLen = getTargetLengthByBits(bitsSetting);
                const correctBin = expectedAnswerValue.toString(2);
                const padded = padToLength(correctBin, targetLen);
                const formatted = formatBinaryWithSpaces(padded);
                
                inputEl.className = 'success';
                inputEl.value = formatted;
            } else {
                // ŠPATNĚ: použijeme uživatelův vstup, doplníme podle jeho délky
                const targetLen = getTargetLengthByInput(cleanInput);
                const padded = padToLength(cleanInput, targetLen);
                const formatted = formatBinaryWithSpaces(padded);
                
                inputEl.className = 'error';
                inputEl.value = formatted;
            }

            // Historie: otázka (dec) = správná odpověď (bin podle bits)
            const decFormatted = formatDecimal(currentDecValue);
            const targetLenHist = getTargetLengthByBits(bitsSetting);
            const correctBinHist = expectedAnswerValue.toString(2);
            const paddedHist = padToLength(correctBinHist, targetLenHist);
            const formattedHist = formatBinaryWithSpaces(paddedHist);
            
            saveToHistory(`${decFormatted} = ${formattedHist}`, isCorrect);
        }
    }

    function checkHistoryDate() {
        const today = new Date().toISOString().split('T')[0];
        if (localStorage.getItem('binTrainDate') !== today) {
            localStorage.removeItem('binTrainHistory');
            localStorage.setItem('binTrainDate', today);
        }
    }

    function saveToHistory(text, isCorrect) {
        let history = JSON.parse(localStorage.getItem('binTrainHistory') || '[]');
        history.unshift({ text, isCorrect });
        localStorage.setItem('binTrainHistory', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const history = JSON.parse(localStorage.getItem('binTrainHistory') || '[]');
        const container = document.getElementById('history-container');
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        if (history.length === 0) {
            container.style.display = 'none';
            return;
        }
        container.style.display = 'block';
        history.forEach(item => {
            const div = document.createElement('div');
            div.className = `history-item ${item.isCorrect ? 'correct' : 'error'}`;
            div.innerText = item.text;
            list.appendChild(div);
        });
    }

    window.onload = initApp;
</script>
