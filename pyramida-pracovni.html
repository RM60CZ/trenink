<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyramida čísel</title>

  <style>
    :root {
      --bg: #dfe3ea;
      --card: rgba(238, 241, 245, 0.92);
      --text: #172033;
      --muted: #5d6b86;
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --input-bg: #f5f6f8;
      --input-border: #b9c1d1;
      --bottom-border: #facc15;
      --bottom-bg: #f3efd7;
      --shadow: 0 24px 60px rgba(60, 70, 95, 0.18);
    }

    body.dark {
      --bg: #0f172a;
      --card: rgba(30, 41, 59, 0.9);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --primary: #818cf8;
      --primary-light: #a5b4fc;
      --input-bg: #111827;
      --input-border: #475569;
      --bottom-border: #eab308;
      --bottom-bg: #292517;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(129, 140, 248, 0.18), transparent 32%),
        linear-gradient(135deg, var(--bg), #cfd5df);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 18px 10px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.dark {
      background:
        radial-gradient(circle at top left, rgba(129, 140, 248, 0.18), transparent 34%),
        linear-gradient(135deg, #020617, var(--bg));
    }

    .aplikace {
      position: relative;
      width: min(100%, 720px);
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 28px;
      padding: 24px 14px 30px;
      box-shadow: var(--shadow);
    }

    .hlavicka {
      position: relative;
      text-align: center;
      margin-bottom: 14px;
      padding: 0 42px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 42px);
      letter-spacing: -0.04em;
    }

    .rezim {
      position: absolute;
      top: 0;
      right: 0;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 0;
      font-size: 25px;
      cursor: pointer;
      color: inherit;
      background: transparent;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }

    .nastaveni {
      margin-bottom: 18px;
      text-align: center;
    }

    .nastaveni-toggle {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 10px;
    }

    .nastaveni-toggle::after {
      content: " ▼";
      font-size: 12px;
    }

    .nastaveni.zavreno .nastaveni-toggle::after {
      content: " ▲";
    }

    .panel-nastaveni {
      overflow: hidden;
      max-height: 180px;
      opacity: 1;
      transition: max-height 0.25s ease, opacity 0.2s ease, margin 0.25s ease;
    }

    .nastaveni.zavreno .panel-nastaveni {
      max-height: 0;
      opacity: 0;
      margin: 0;
    }

    .popis {
      margin: 4px 0 12px;
      color: var(--muted);
      font-size: 15px;
    }

    .ovladani {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .pole {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(148, 163, 184, 0.32);
      border-radius: 999px;
      padding: 8px 12px;
    }

    select {
      color: var(--text);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 12px;
    }

    .pyramida {
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(5px, 1.5vw, 10px);
      overflow: hidden;
      min-height: 40px;
    }

    .radek {
      display: flex;
      justify-content: center;
      gap: clamp(3px, 1vw, 8px);
      width: 100%;
    }

    input {
      width: clamp(34px, 11vw, 80px);
      height: clamp(40px, 11vw, 58px);
      color: var(--text);
      background: var(--input-bg);
      font-size: clamp(14px, 3.8vw, 20px);
      font-weight: 700;
      text-align: center;
      border: 2px solid var(--input-border);
      border-radius: 14px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.22);
      transform: translateY(-1px);
    }

    input.spodni {
      border-color: var(--bottom-border);
      background: var(--bottom-bg);
      cursor: not-allowed;
      opacity: 1;
    }

    input.spodni:focus {
      transform: none;
      box-shadow: none;
    }

    .start-wrap {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    .start {
      border: 0;
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 999px;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.28em;
      cursor: pointer;
      padding: 12px 28px;
      box-shadow: 0 10px 22px rgba(79, 70, 229, 0.28);
    }

    @media (max-width: 480px) {
      .aplikace {
        padding-left: 8px;
        padding-right: 8px;
        border-radius: 22px;
      }

      .hlavicka {
        padding: 0 40px;
      }

      .rezim {
        width: 34px;
        height: 34px;
        font-size: 24px;
      }

      .radek {
        gap: 4px;
      }

      input {
        width: calc((100vw - 56px) / 7);
        height: calc((100vw - 56px) / 7);
        max-width: 52px;
        max-height: 52px;
        min-width: 0;
        font-size: clamp(13px, 3.6vw, 17px);
        border-radius: 10px;
        padding: 0;
      }

      .start {
        font-size: 16px;
        padding: 11px 24px;
      }
    }
  </style>
</head>

<body>
  <main class="aplikace">
    <header class="hlavicka">
      <h1>Pyramida čísel</h1>
      <button id="rezim" class="rezim" type="button" aria-label="Přepnout tmavý/světlý režim">🌙</button>
    </header>

    <section id="nastaveni" class="nastaveni">
      <button id="nastaveniToggle" class="nastaveni-toggle" type="button">
        Nastavení
      </button>

      <div id="panelNastaveni" class="panel-nastaveni">
        <p class="popis">Vyber počet poschodí pyramidy a počet cifer spodního řádku.</p>

        <div class="ovladani">
          <div class="pole">
            <select id="vyska" aria-label="Počet poschodí pyramidy">
              <option value="2">2 poschodí</option>
              <option value="3">3 poschodí</option>
              <option value="4">4 poschodí</option>
              <option value="5">5 poschodí</option>
              <option value="6">6 poschodí</option>
              <option value="7" selected>7 poschodí</option>
            </select>
          </div>

          <div class="pole">
            <select id="cifry" aria-label="Počet cifer spodního řádku">
              <option value="1">1 cifra</option>
              <option value="2" selected>2 cifry</option>
              <option value="3">3 cifry</option>
              <option value="4">4 cifry</option>
              <option value="5">5 cifer</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <div class="pyramida" id="pyramida"></div>

    <div class="start-wrap">
      <button id="start" class="start" type="button">S T A R T</button>
    </div>
  </main>

  <script>
    const pyramida = document.getElementById('pyramida');
    const vyska = document.getElementById('vyska');
    const cifry = document.getElementById('cifry');
    const rezim = document.getElementById('rezim');
    const start = document.getElementById('start');
    const nastaveni = document.getElementById('nastaveni');
    const nastaveniToggle = document.getElementById('nastaveniToggle');

    const STORAGE_REZIM = 'pyramida_rezim';
    const STORAGE_VYSKA = 'pyramida_vyska';
    const STORAGE_CIFRY = 'pyramida_cifry';

    function ulozNastaveni() {
      localStorage.setItem(STORAGE_VYSKA, vyska.value);
      localStorage.setItem(STORAGE_CIFRY, cifry.value);
      localStorage.setItem(
        STORAGE_REZIM,
        document.body.classList.contains('dark') ? 'dark' : 'light'
      );
    }

    function nactiNastaveni() {
      const ulozenaVyska = localStorage.getItem(STORAGE_VYSKA);
      const ulozeneCifry = localStorage.getItem(STORAGE_CIFRY);
      const ulozenyRezim = localStorage.getItem(STORAGE_REZIM);

      if (ulozenaVyska) {
        vyska.value = ulozenaVyska;
      }

      if (ulozeneCifry) {
        cifry.value = ulozeneCifry;
      }

      if (ulozenyRezim === 'dark') {
        document.body.classList.add('dark');
        rezim.textContent = '☀️';
      } else {
        document.body.classList.remove('dark');
        rezim.textContent = '🌙';
      }
    }

    function nahodneCisloSPoctemCifer(pocetCifer) {
      const min = pocetCifer === 1 ? 0 : Math.pow(10, pocetCifer - 1);
      const max = Math.pow(10, pocetCifer) - 1;

      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function vytvorPyramidu(generovatSpodniRadek) {
      pyramida.innerHTML = '';

      const pocetRadku = Number(vyska.value);
      const pocetCifer = Number(cifry.value);

      for (let r = 1; r <= pocetRadku; r++) {
        const radek = document.createElement('div');
        radek.className = 'radek';

        const jeSpodniRadek = r === pocetRadku;

        for (let i = 0; i < r; i++) {
          const input = document.createElement('input');
          input.type = 'text';
          input.inputMode = 'numeric';

          if (jeSpodniRadek) {
            input.classList.add('spodni');
            input.readOnly = true;
            input.tabIndex = -1;
            input.setAttribute('aria-label', 'Automaticky vygenerované číslo');

            if (generovatSpodniRadek) {
              input.value = nahodneCisloSPoctemCifer(pocetCifer);
            } else {
              input.value = '';
            }
          } else {
            input.value = '';

            input.addEventListener('input', function () {
              let hodnota = this.value.replace(/\D/g, '');

              if (hodnota) {
                this.value = Number(hodnota).toLocaleString('cs-CZ');
              } else {
                this.value = '';
              }
            });
          }

          radek.appendChild(input);
        }

        pyramida.appendChild(radek);
      }
    }

    nastaveniToggle.addEventListener('click', function () {
      nastaveni.classList.toggle('zavreno');
      ulozNastaveni();
      vytvorPyramidu(false);
    });

    vyska.addEventListener('change', function () {
      ulozNastaveni();
      vytvorPyramidu(false);
    });

    cifry.addEventListener('change', function () {
      ulozNastaveni();
      vytvorPyramidu(false);
    });

    start.addEventListener('click', function () {
      ulozNastaveni();
      vytvorPyramidu(true);
    });

    rezim.addEventListener('click', function () {
      document.body.classList.toggle('dark');

      if (document.body.classList.contains('dark')) {
        rezim.textContent = '☀️';
      } else {
        rezim.textContent = '🌙';
      }

      ulozNastaveni();
    });

    nactiNastaveni();
    vytvorPyramidu(false);
  </script>
</body>
</html>
