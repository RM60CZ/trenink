<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pyramida čísel</title>

  <style>
    :root {
      --bg: #dfe3ea;
      --card: rgba(238, 241, 245, 0.92);
      --text: #172033;
      --muted: #5d6b86;
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --input-bg: #f5f6f8;
      --input-border: #b9c1d1;
      --disabled-bg: #e1e5ec;
      --disabled-border: #c4cad5;
      --bottom-border: #facc15;
      --bottom-bg: #f3efd7;
      --success: #16a34a;
      --error: #dc2626;
      --active-bg: #eef2ff;
      --shadow: 0 24px 60px rgba(60, 70, 95, 0.18);
    }

    body.dark {
      --bg: #0f172a;
      --card: rgba(30, 41, 59, 0.9);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --primary: #818cf8;
      --primary-light: #a5b4fc;
      --input-bg: #111827;
      --input-border: #475569;
      --disabled-bg: #1e293b;
      --disabled-border: #334155;
      --bottom-border: #eab308;
      --bottom-bg: #292517;
      --success: #22c55e;
      --error: #f87171;
      --active-bg: #1e1b4b;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(129, 140, 248, 0.18), transparent 32%),
        linear-gradient(135deg, var(--bg), #cfd5df);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 18px 10px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.dark {
      background:
        radial-gradient(circle at top left, rgba(129, 140, 248, 0.18), transparent 34%),
        linear-gradient(135deg, #020617, var(--bg));
    }

    .aplikace {
      position: relative;
      width: min(100%, 860px);
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 28px;
      padding: 24px 14px 30px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hlavicka {
      position: relative;
      text-align: center;
      margin-bottom: 10px;
      padding: 0 42px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 42px);
      letter-spacing: -0.04em;
    }

    .rezim {
      position: absolute;
      top: 0;
      right: 0;
      width: 36px;
      height: 36px;
      border: 0;
      font-size: 25px;
      cursor: pointer;
      color: inherit;
      background: transparent;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }

    .nastaveni {
      margin-bottom: 12px;
      text-align: center;
    }

    .popis-toggle {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 8px;
      line-height: 1.35;
    }

    .popis-toggle::after {
      content: " ▼";
      font-size: 12px;
      white-space: nowrap;
    }

    .nastaveni.zavreno .popis-toggle::after {
      content: " ▲";
    }

    .panel-nastaveni {
      overflow: hidden;
      max-height: 90px;
      opacity: 1;
      transition: max-height 0.25s ease, opacity 0.2s ease, margin 0.25s ease;
    }

    .nastaveni.zavreno .panel-nastaveni {
      max-height: 0;
      opacity: 0;
      margin: 0;
    }

    .ovladani {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    .pole {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(148, 163, 184, 0.32);
      border-radius: 999px;
      padding: 8px 12px;
    }

    select {
      color: var(--text);
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 12px;
    }

    .hlaska {
      min-height: 22px;
      margin: 2px 0 8px;
      color: var(--error);
      font-size: 15px;
      font-weight: 800;
      text-align: center;
    }

    .pyramida {
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(5px, 1.5vw, 10px);
      overflow: visible;
      min-height: 40px;
    }

    .radek {
      display: flex;
      justify-content: center;
      gap: clamp(3px, 1vw, 8px);
      width: 100%;
    }

    input {
      width: clamp(34px, 11vw, 80px);
      height: clamp(40px, 11vw, 58px);
      color: var(--text);
      background: var(--input-bg);
      font-size: clamp(14px, 3.8vw, 20px);
      font-weight: 700;
      text-align: center;
      border: 2px solid var(--input-border);
      border-radius: 14px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition:
        width 0.18s ease,
        height 0.18s ease,
        font-size 0.18s ease,
        transform 0.18s ease,
        border-color 0.16s ease,
        box-shadow 0.16s ease,
        opacity 0.16s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.22);
      transform: translateY(-1px);
    }

    input.spodni {
      border-color: var(--bottom-border);
      background: var(--bottom-bg);
      cursor: not-allowed;
      opacity: 1;
    }

    input.zamcene {
      background: var(--disabled-bg);
      border-color: var(--disabled-border);
      cursor: not-allowed;
      opacity: 0.72;
    }

    input.spravne {
      color: var(--text);
      border-color: var(--success);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
    }

    input.spatne {
      color: var(--text);
      border-color: var(--error);
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.18);
    }

    input.aktivni,
    input.podklad {
      width: clamp(72px, 20vw, 132px);
      height: clamp(58px, 15vw, 82px);
      font-size: clamp(22px, 5vw, 32px);
      z-index: 2;
    }

    input.aktivni {
      background: var(--active-bg);
      border-color: var(--primary);
      box-shadow: 0 0 0 5px rgba(129, 140, 248, 0.22);
    }

    input.aktivni.spatne {
      color: var(--text);
      border-color: var(--error);
      box-shadow: 0 0 0 5px rgba(220, 38, 38, 0.25);
    }

    input.aktivni.spravne {
      color: var(--text);
      border-color: var(--success);
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.25);
    }

    input.podklad {
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.14);
    }

    .tlacitka-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .akce {
      min-width: 150px;
      border: 0;
      color: #ffffff;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 999px;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.28em;
      cursor: pointer;
      padding: 12px 24px;
      box-shadow: 0 10px 22px rgba(79, 70, 229, 0.28);
    }

    .konec {
      background: linear-gradient(135deg, #64748b, #94a3b8);
    }

    .historie {
      min-height: 24px;
      margin: 14px 0 0;
      text-align: center;
      font-size: 16px;
      font-weight: 900;
      color: var(--success);
      word-spacing: 8px;
    }

    .ohnostroj {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 9999;
    }

    .jiskra {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: hsl(var(--hue), 95%, 60%);
      box-shadow: 0 0 12px currentColor;
      animation: jiskraLet 900ms ease-out forwards;
    }

    @keyframes jiskraLet {
      from {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }

      to {
        transform: translate(var(--dx), var(--dy)) scale(0.1);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      .aplikace {
        padding-left: 8px;
        padding-right: 8px;
        border-radius: 22px;
      }

      .hlavicka {
        padding: 0 40px;
      }

      .rezim {
        width: 34px;
        height: 34px;
        font-size: 24px;
      }

      .popis-toggle {
        font-size: 14px;
      }

      .radek {
        gap: 4px;
      }

      input {
        width: calc((100vw - 56px) / 7);
        height: calc((100vw - 56px) / 7);
        max-width: 52px;
        max-height: 52px;
        min-width: 0;
        font-size: clamp(13px, 3.6vw, 17px);
        border-radius: 10px;
        padding: 0;
      }

      input.aktivni,
      input.podklad {
        width: clamp(58px, 17vw, 88px);
        height: clamp(52px, 15vw, 72px);
        max-width: none;
        max-height: none;
        font-size: clamp(20px, 5vw, 28px);
      }

      .akce {
        min-width: 136px;
        font-size: 15px;
        padding: 11px 18px;
      }
    }

    input.spatne,
    input.spatne:focus,
    input.aktivni.spatne,
    input.aktivni.spatne:focus {
      color: var(--text) !important;
      border: 2px solid var(--error) !important;
      box-shadow: 0 0 0 5px rgba(220, 38, 38, 0.35) !important;
    }

    input.spravne,
    input.spravne:focus,
    input.aktivni.spravne,
    input.aktivni.spravne:focus {
      color: var(--text) !important;
      border: 2px solid var(--success) !important;
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.25) !important;
    }
  </style>
</head>

<body>
  <main class="aplikace">
    <header class="hlavicka">
      <h1>Pyramida čísel</h1>
      <button id="rezim" class="rezim" type="button" aria-label="Přepnout tmavý/světlý režim">🌙</button>
    </header>

    <section id="nastaveni" class="nastaveni">
      <button id="nastaveniToggle" class="popis-toggle" type="button">
        Vyber počet poschodí pyramidy a počet cifer spodního řádku.
      </button>

      <div id="panelNastaveni" class="panel-nastaveni">
        <div class="ovladani">
          <div class="pole">
            <select id="vyska" aria-label="Počet poschodí pyramidy">
              <option value="2">2 poschodí</option>
              <option value="3">3 poschodí</option>
              <option value="4">4 poschodí</option>
              <option value="5">5 poschodí</option>
              <option value="6">6 poschodí</option>
              <option value="7" selected>7 poschodí</option>
            </select>
          </div>

          <div class="pole">
            <select id="cifry" aria-label="Počet cifer spodního řádku">
              <option value="1">1 cifra</option>
              <option value="2" selected>2 cifry</option>
              <option value="3">3 cifry</option>
              <option value="4">4 cifry</option>
              <option value="5">5 cifer</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <div id="hlaska" class="hlaska"></div>

    <div class="pyramida" id="pyramida"></div>

    <div class="tlacitka-wrap">
      <button id="start" class="akce" type="button">S T A R T</button>
      <button id="konec" class="akce konec" type="button">K O N E C</button>
    </div>

    <div id="historie" class="historie"></div>
  </main>

  <script>
    const pyramida = document.getElementById('pyramida');
    const vyska = document.getElementById('vyska');
    const cifry = document.getElementById('cifry');
    const rezim = document.getElementById('rezim');
    const start = document.getElementById('start');
    const konec = document.getElementById('konec');
    const nastaveni = document.getElementById('nastaveni');
    const nastaveniToggle = document.getElementById('nastaveniToggle');
    const hlaska = document.getElementById('hlaska');
    const historie = document.getElementById('historie');

    const STORAGE_REZIM = 'pyramida_rezim';
    const STORAGE_VYSKA = 'pyramida_vyska';
    const STORAGE_CIFRY = 'pyramida_cifry';
    const STORAGE_HISTORIE = 'pyramida_historie';
    const STORAGE_HISTORIE_DATUM = 'pyramida_historie_datum';

    let hraBezi = false;
    let aktivniRadek = null;
    let aktivniIndex = null;

    function dnesniDatum() {
      const d = new Date();
      const rok = d.getFullYear();
      const mesic = String(d.getMonth() + 1).padStart(2, '0');
      const den = String(d.getDate()).padStart(2, '0');
      return `${rok}-${mesic}-${den}`;
    }

    function nactiHistorii() {
      const dnes = dnesniDatum();
      const datum = localStorage.getItem(STORAGE_HISTORIE_DATUM);

      if (datum !== dnes) {
        localStorage.setItem(STORAGE_HISTORIE_DATUM, dnes);
        localStorage.setItem(STORAGE_HISTORIE, '');
      }

      historie.innerHTML = localStorage.getItem(STORAGE_HISTORIE) || '';
    }

    function pridejDoHistorie(zapis) {
      const dnes = dnesniDatum();

      if (localStorage.getItem(STORAGE_HISTORIE_DATUM) !== dnes) {
        localStorage.setItem(STORAGE_HISTORIE_DATUM, dnes);
        localStorage.setItem(STORAGE_HISTORIE, '');
      }

      const span = `<span>${zapis}</span>&nbsp;&nbsp;`;
      const novaHistorie = (localStorage.getItem(STORAGE_HISTORIE) || '') + span;

      localStorage.setItem(STORAGE_HISTORIE, novaHistorie);
      historie.innerHTML = novaHistorie;
    }

    function vymazHistorii() {
      localStorage.setItem(STORAGE_HISTORIE_DATUM, dnesniDatum());
      localStorage.setItem(STORAGE_HISTORIE, '');
      historie.innerHTML = '';
    }

    function spustOhnostroj() {
      const obal = document.createElement('div');
      obal.className = 'ohnostroj';
      document.body.appendChild(obal);

      const vybuchy = [
        { x: 28, y: 28 },
        { x: 50, y: 20 },
        { x: 72, y: 30 },
        { x: 40, y: 42 },
        { x: 62, y: 45 }
      ];

      vybuchy.forEach(function (vybuch, index) {
        setTimeout(function () {
          for (let i = 0; i < 28; i++) {
            const jiskra = document.createElement('span');
            jiskra.className = 'jiskra';

            const uhel = Math.random() * Math.PI * 2;
            const vzdalenost = 70 + Math.random() * 90;
            const dx = Math.cos(uhel) * vzdalenost;
            const dy = Math.sin(uhel) * vzdalenost;

            jiskra.style.setProperty('--x', vybuch.x + 'vw');
            jiskra.style.setProperty('--y', vybuch.y + 'vh');
            jiskra.style.setProperty('--dx', dx + 'px');
            jiskra.style.setProperty('--dy', dy + 'px');
            jiskra.style.setProperty('--hue', Math.floor(Math.random() * 360));

            obal.appendChild(jiskra);

            setTimeout(function () {
              jiskra.remove();
            }, 1000);
          }
        }, index * 180);
      });

      setTimeout(function () {
        obal.remove();
      }, 1800);
    }

    function oznacPole(input) {
      setTimeout(function () {
        input.focus({ preventScroll: false });
        input.select();
      }, 30);
    }

    function formatujTisice(hodnota) {
      if (!hodnota) return '';
      return hodnota.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    }

    function pouzeCisliceATisice(hodnota) {
      return /^[0-9 ]*$/.test(hodnota);
    }

    function naCislo(hodnota) {
      const ciste = hodnota.replace(/\s/g, '');
      return Number(ciste);
    }

    function nastavVstupCisla(input) {
      input.addEventListener('input', function () {
        this.classList.remove('spatne');

        const bezMezer = this.value.replace(/\s/g, '');

        if (/^\d*$/.test(bezMezer)) {
          this.value = formatujTisice(bezMezer);
        }
      });
    }

    function ulozNastaveni() {
      localStorage.setItem(STORAGE_VYSKA, vyska.value);
      localStorage.setItem(STORAGE_CIFRY, cifry.value);
      localStorage.setItem(
        STORAGE_REZIM,
        document.body.classList.contains('dark') ? 'dark' : 'light'
      );
    }

    function nactiNastaveni() {
      const ulozenaVyska = localStorage.getItem(STORAGE_VYSKA);
      const ulozeneCifry = localStorage.getItem(STORAGE_CIFRY);
      const ulozenyRezim = localStorage.getItem(STORAGE_REZIM);

      if (ulozenaVyska) vyska.value = ulozenaVyska;
      if (ulozeneCifry) cifry.value = ulozeneCifry;

      if (ulozenyRezim === 'dark') {
        document.body.classList.add('dark');
        rezim.textContent = '☀️';
      } else {
        document.body.classList.remove('dark');
        rezim.textContent = '🌙';
      }
    }

    function nahodneCisloSPoctemCifer(pocetCifer) {
      const min = pocetCifer === 1 ? 0 : Math.pow(10, pocetCifer - 1);
      const max = Math.pow(10, pocetCifer) - 1;

      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function ziskejPole(r, i) {
      return pyramida.querySelector(`input[data-r="${r}"][data-i="${i}"]`);
    }

    function vycistiZvyrazneni() {
      pyramida.querySelectorAll('input').forEach(function (input) {
        input.classList.remove('aktivni', 'podklad');
      });
    }

    function zvyrazniAktivniTrojici() {
      vycistiZvyrazneni();

      if (aktivniRadek === null || aktivniIndex === null) return;

      const aktivni = ziskejPole(aktivniRadek, aktivniIndex);
      const levyDole = ziskejPole(aktivniRadek + 1, aktivniIndex);
      const pravyDole = ziskejPole(aktivniRadek + 1, aktivniIndex + 1);

      if (aktivni) aktivni.classList.add('aktivni');
      if (levyDole) levyDole.classList.add('podklad');
      if (pravyDole) pravyDole.classList.add('podklad');
    }

    function nastavAktivniPole(r, i) {
      aktivniRadek = r;
      aktivniIndex = i;

      pyramida.querySelectorAll('input').forEach(function (input) {
        if (!input.classList.contains('spodni') && !input.classList.contains('spravne')) {
          input.classList.add('zamcene');
          input.readOnly = true;
          input.tabIndex = -1;
        }
      });

      const aktivni = ziskejPole(r, i);

      if (aktivni) {
        aktivni.classList.remove('zamcene', 'spatne');
        aktivni.readOnly = false;
        aktivni.tabIndex = 0;
        zvyrazniAktivniTrojici();

        setTimeout(function () {
          start.blur();
          aktivni.focus({ preventScroll: false });
          aktivni.select();
        }, 120);
      }
    }

    function dalsiPole() {
      if (aktivniIndex + 1 < aktivniRadek) {
        return {
          r: aktivniRadek,
          i: aktivniIndex + 1
        };
      }

      if (aktivniRadek - 1 >= 1) {
        return {
          r: aktivniRadek - 1,
          i: 0
        };
      }

      return null;
    }

    function vytvorPyramidu(generovatSpodniRadek) {
      pyramida.innerHTML = '';
      hlaska.textContent = '';

      const pocetRadku = Number(vyska.value);
      const pocetCifer = Number(cifry.value);

      for (let r = 1; r <= pocetRadku; r++) {
        const radek = document.createElement('div');
        radek.className = 'radek';

        const jeSpodniRadek = r === pocetRadku;

        for (let i = 0; i < r; i++) {
          const input = document.createElement('input');
          input.type = 'text';
          input.inputMode = 'numeric';
          input.dataset.r = r;
          input.dataset.i = i;

          if (jeSpodniRadek) {
            input.classList.add('spodni');
            input.readOnly = true;
            input.tabIndex = -1;

            if (generovatSpodniRadek) {
              input.value = formatujTisice(String(nahodneCisloSPoctemCifer(pocetCifer)));
            } else {
              input.value = '';
            }
          } else {
            input.value = '';
            nastavVstupCisla(input);

            if (generovatSpodniRadek) {
              input.classList.add('zamcene');
              input.readOnly = true;
              input.tabIndex = -1;
            }
          }

          radek.appendChild(input);
        }

        pyramida.appendChild(radek);
      }

      if (generovatSpodniRadek) {
        hraBezi = true;
        start.textContent = 'D A L Š Í';
        nastavAktivniPole(pocetRadku - 1, 0);
      } else {
        hraBezi = false;
        aktivniRadek = null;
        aktivniIndex = null;
        start.textContent = 'S T A R T';
      }
    }

    function zkontrolujAktivniPole() {
      hlaska.textContent = '';

      const aktivni = ziskejPole(aktivniRadek, aktivniIndex);

      if (!aktivni) return;

      const text = aktivni.value.trim();

      if (
        aktivniRadek === 2 &&
        aktivniIndex === 0 &&
        text.toLowerCase() === 'vymazat'
      ) {
        vymazHistorii();
        aktivni.value = '';
        aktivni.classList.remove('spatne');
        oznacPole(aktivni);
        return;
      }

      if (!pouzeCisliceATisice(aktivni.value) || aktivni.value.trim() === '') {
        hlaska.textContent = 'Nepovolený znak!';
        aktivni.classList.add('spatne');
        oznacPole(aktivni);
        return;
      }

      const levyDole = ziskejPole(aktivniRadek + 1, aktivniIndex);
      const pravyDole = ziskejPole(aktivniRadek + 1, aktivniIndex + 1);

      const spravnySoucet = naCislo(levyDole.value) + naCislo(pravyDole.value);
      const zadano = naCislo(aktivni.value);

      if (zadano === spravnySoucet) {
        aktivni.value = formatujTisice(String(zadano));
        aktivni.classList.remove('spatne', 'aktivni');
        aktivni.classList.add('spravne', 'zamcene');
        aktivni.readOnly = true;
        aktivni.tabIndex = -1;

        const dalsi = dalsiPole();

        if (dalsi) {
          nastavAktivniPole(dalsi.r, dalsi.i);
        } else {
          vycistiZvyrazneni();
          hraBezi = false;
          aktivniRadek = null;
          aktivniIndex = null;
          start.textContent = 'S T A R T';
          pridejDoHistorie(`${vyska.value}/${cifry.value}`);
          spustOhnostroj();
        }
      } else {
        aktivni.classList.add('spatne');
        oznacPole(aktivni);
      }
    }

    function ukonciHru() {
      hraBezi = false;
      aktivniRadek = null;
      aktivniIndex = null;
      hlaska.textContent = '';
      start.textContent = 'S T A R T';
      vytvorPyramidu(false);
    }

    nastaveniToggle.addEventListener('click', function () {
      nastaveni.classList.toggle('zavreno');
      ulozNastaveni();
      ukonciHru();
    });

    vyska.addEventListener('change', function () {
      ulozNastaveni();
      ukonciHru();
    });

    cifry.addEventListener('change', function () {
      ulozNastaveni();
      ukonciHru();
    });

    start.addEventListener('click', function () {
      ulozNastaveni();

      if (!hraBezi) {
        vytvorPyramidu(true);
      } else {
        zkontrolujAktivniPole();
      }
    });

    konec.addEventListener('click', function () {
      ukonciHru();
    });

    rezim.addEventListener('click', function () {
      document.body.classList.toggle('dark');
      rezim.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
      ulozNastaveni();
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        start.click();
      }
    });

    nactiNastaveni();
    nactiHistorii();
    vytvorPyramidu(false);
  </script>
</body>
</html>
