<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Pyramida čísel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      background: #f9f9f9;
    }
    .pyramida {
      margin-top: 30px;
    }
    .radek {
      text-align: center;
      margin: 4px 0;
    }
    input {
      width: 80px;
      height: 40px;
      font-size: 16px;
      text-align: center;
      border: 2px solid #333;
      border-radius: 4px;
      margin: 0 2px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #007bff;
    }
  </style>
</head>
<body>
  <div class="pyramida" id="pyramida"></div>

  <script>
    const pyramida = document.getElementById('pyramida');
    const maxRadku = 7;

    for (let r = 1; r <= maxRadku; r++) {
      const radek = document.createElement('div');
      radek.className = 'radek';

      // Přidáme r inputů
      for (let i = 0; i < r; i++) {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.inputmode = 'numeric'; // mobilní klávesnice: čísla
        inp.placeholder = '0';
        inp.addEventListener('input', function() {
          // Volitelné: automaticky formátuj jako číslo s mezerami
          let value = this.value.replace(/\D/g, ''); // jen číslice
          if (value) {
            // Formátujeme s mezerou jako oddělovačem tisíců
            value = parseInt(value).toLocaleString('cs-CZ');
            this.value = value;
          }
        });
        radek.appendChild(inp);
      }

      pyramida.appendChild(radek);
    }
  </script>
</body>
</html>
