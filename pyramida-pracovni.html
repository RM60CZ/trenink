<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pyramida</title><style>:root{--bg:#c9ced6;--card:#d9dde4;--text:#172033;--p:#4f46e5;--p2:#818cf8;--inp:#e3e6eb;--bd:#a4adbd;--dis:#cfd4dc;--bot:#facc15;--botbg:#e4dfc7;--ok:#16a34a;--err:#dc2626;--act:#dce1ef}body.dark{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--p:#818cf8;--p2:#a5b4fc;--inp:#111827;--bd:#475569;--dis:#1e293b;--bot:#eab308;--botbg:#292517;--ok:#22c55e;--err:#f87171;--act:#1e1b4b}*{box-sizing:border-box}body{font-family:Arial,sans-serif;min-height:100vh;margin:0;color:var(--text);background:linear-gradient(135deg,var(--bg),#b7bec8);display:flex;justify-content:center;padding:18px 10px}.aplikace{position:relative;width:min(100%,860px);background:var(--card);border-radius:28px;padding:24px 14px 30px;box-shadow:0 24px 60px #0002;overflow:hidden}.hlavicka{position:relative;display:flex;align-items:center;gap:10px;margin-bottom:4px;padding-right:160px}h1{margin:0;font-size:clamp(26px,6vw,42px);letter-spacing:-.04em;white-space:nowrap}.kalk-toggle,.nastaveni-kolo,.rezim,.hlas-toggle{position:absolute;top:0;width:36px;height:36px;border:2px solid transparent;border-radius:10px;font-size:25px;cursor:pointer;background:transparent;display:flex;align-items:center;justify-content:center}.kalk-toggle,.nastaveni-kolo,.hlas-toggle{color:#6b7280}.rezim{color:inherit}.kalk-toggle{right:108px;font-size:24px;font-weight:900;font-family:Arial,sans-serif}.hlas-toggle{right:66px;font-size:22px;font-weight:900;font-family:Arial,sans-serif}.nastaveni-kolo{right:42px}.rezim{right:0}.kalk-toggle.aktivni,.nastaveni-kolo.aktivni,.hlas-toggle.aktivni{border-color:var(--err)}.hlas-toggle{opacity:0;pointer-events:none;transition:opacity .15s}.hlas-toggle.zobrazeno{opacity:1;pointer-events:auto} .panel-nastaveni{overflow:hidden;max-height:190px;opacity:1;transition:.25s}.nastaveni.zavreno .panel-nastaveni{max-height:0;opacity:0}.nastaveni-radky{display:grid;grid-template-columns:max-content max-content;justify-content:center;align-items:center;gap:8px 10px;margin:8px auto 0}.nastaveni-popisek{font-size:clamp(17px,4.4vw,22px);font-weight:900}.pole{border:1px solid #94a3b880;border-radius:999px;padding:2px 3px;width:clamp(132px,34vw,168px)}select{width:100%;color:var(--text);background:var(--inp);border:1px solid var(--bd);border-radius:999px;font-size:clamp(16px,4vw,20px);font-weight:800;padding:8px;text-align:center}.mazani-historie{width:76px;height:34px;border-radius:999px;border:1px solid var(--bd);background:var(--inp);color:var(--inp);caret-color:var(--p);font-size:14px;text-align:center}.mazani-historie::placeholder{color:var(--inp)}.mazani-historie:focus{outline:0;border-color:var(--p)}.hlaska{min-height:22px;margin:2px 0 8px;color:var(--err);font-size:15px;font-weight:800;text-align:center}.herni-plocha{position:relative;width:100%;overflow:visible}.postranni-tlacitko{position:absolute;top:0;z-index:5}.postranni-tlacitko.vpravo{left:calc(50% + 82px)}.pyramida{display:flex;flex-direction:column;align-items:center;gap:clamp(5px,1.5vw,10px);min-height:40px}.radek{display:flex;justify-content:center;gap:clamp(3px,1vw,8px);width:100%}.bunka-slot{flex:0 0 clamp(34px,11vw,80px);width:clamp(34px,11vw,80px);height:clamp(40px,11vw,58px)}.bunka-slot input{width:100%;height:100%;color:var(--text);background:var(--inp);font-size:clamp(14px,3.8vw,20px);font-weight:700;text-align:center;border:2px solid var(--bd);border-radius:14px;padding:0 4px}.bunka-slot input.spodni{border-color:var(--bot);background:var(--botbg)}.bunka-slot input.zamcene{background:var(--dis);opacity:.45}.bunka-slot input.spravne{border-color:var(--ok);box-shadow:0 0 0 4px #22c55e2e;opacity:1}.prekryv-panel{position:absolute;left:50%;transform:translateX(-50%);z-index:80;display:none;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:100%;max-width:calc(100vw - 16px)}.prekryv-panel.zobrazen{display:flex}.prekryv-horni-wrap{position:relative;width:100%;display:block;pointer-events:none;--polovina-vstupu:70px}.prekryv-spodni-wrap{display:flex;justify-content:center;max-width:calc(100vw - 16px);overflow:hidden}.prekryv-input{height:clamp(58px,15vw,82px);color:var(--text);background:var(--inp);font-size:clamp(20px,4.7vw,30px);font-weight:800;text-align:center;border:2px solid var(--bd);border-radius:15px;padding:0 8px;box-shadow:0 8px 20px #0002;pointer-events:auto;min-width:0}.prekryv-input:focus{outline:0;border-color:var(--p)}#overlayAktivni{background:var(--act);border-color:var(--p);display:block;margin:0 auto}#overlayLevy{border-radius:15px 0 0 15px}#overlayPravy{border-radius:0 15px 15px 0}.prekryv-input.spravne{border-color:var(--ok)!important}.back-btn,.minus-btn{position:absolute;top:50%;transform:translateY(-50%);height:clamp(58px,15vw,82px);width:clamp(50px,14vw,76px);border:0;background:transparent;color:var(--text);font-size:clamp(19px,5vw,28px);font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;pointer-events:auto;padding:0 0 2px;box-shadow:none}.back-btn{left:calc(50% + var(--polovina-vstupu) + 8px)}.minus-btn{right:calc(50% + var(--polovina-vstupu) + 8px)}.back-btn:active,.minus-btn:active{color:var(--p);background:transparent}.kalk-panel{position:absolute;left:50%;transform:translateX(-50%);z-index:70;display:none;grid-template-columns:repeat(3,64px);gap:8px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 18px 38px #0003}.kalk-panel.zobrazen{display:grid}.kalk-panel button{height:52px;border:1px solid var(--bd);border-radius:14px;background:var(--inp);color:var(--text);font-size:25px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}.kalk-panel button[data-k="0"]{grid-column:span 2}.kalk-panel button:active{background:var(--act);border-color:var(--p)}.akce{min-width:150px;border:0;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));border-radius:999px;font-size:17px;font-weight:900;letter-spacing:.28em;cursor:pointer;padding:12px 24px}.akce:disabled{opacity:.45}.historie{min-height:24px;margin:14px auto 0;text-align:center;font-size:16px;font-weight:900;color:var(--text);max-width:100%;width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.7}.historie .hist-ok{color:var(--ok);display:inline-block;margin:0 8px 6px}.ohnostroj{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999}.jiskra{position:absolute;left:var(--x);top:var(--y);width:8px;height:8px;border-radius:50%;background:hsl(var(--h),95%,60%);animation:j .75s ease-out forwards}@keyframes j{to{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}@media(max-width:760px){.herni-plocha{padding-top:54px}.postranni-tlacitko.vpravo{left:50%;transform:translateX(-50%)}.kalk-toggle,.kalk-panel{display:none!important}.hlas-toggle{display:none!important}.hlavicka{padding-right:88px}}@media(max-width:480px){body{padding:10px 6px}.aplikace{padding:14px 8px 24px}.hlavicka{padding-right:74px}h1{font-size:clamp(24px,7vw,30px)}.bunka-slot{flex:0 0 calc((100vw - 56px)/7);width:calc((100vw - 56px)/7);height:calc((100vw - 56px)/7);max-width:52px;max-height:52px}.akce{min-width:136px;font-size:15px;padding:11px 18px}.back-btn,.minus-btn{width:clamp(46px,13vw,64px);font-size:clamp(36px,10vw,50px);padding:0}.back-btn{left:calc(50% + var(--polovina-vstupu) + 4px)}.minus-btn{right:calc(50% + var(--polovina-vstupu) + 4px)}}</style></head><body><main class="aplikace"><header class="hlavicka"><h1>Pyramida</h1><input id="mazaniHistorie" class="mazani-historie" placeholder="Vymazat"><button id="kalkToggle" class="kalk-toggle">K</button><button id="hlasToggle" class="hlas-toggle" type="button" aria-label="Hlasové zadávání">H</button><button id="nastaveniToggle" class="nastaveni-kolo">⚙️</button><button id="rezim" class="rezim">🌙</button></header><section id="nastaveni" class="nastaveni zavreno"><div class="panel-nastaveni"><div class="nastaveni-radky"><label class="nastaveni-popisek">výška pyramidy</label><div class="pole"><select id="vyska"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option selected>7</option></select></div><label class="nastaveni-popisek">počet cifer</label><div class="pole"><select id="cifry"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div><label class="nastaveni-popisek">sčítání - sčítání+odčítání</label><div class="pole"><select id="znamenko"><option value="p">+</option><option value="pm">+ -</option></select></div></div></div></section><div id="hlaska" class="hlaska"></div><div class="herni-plocha" id="herniPlocha"><div class="pyramida" id="pyramida"></div><div id="prekryvPanel" class="prekryv-panel"><div class="prekryv-horni-wrap" id="prekryvHorniWrap"><button id="minusHlavni" class="minus-btn" type="button">-</button><input id="overlayAktivni" class="prekryv-input" inputmode="numeric"><button id="backHlavni" class="back-btn" type="button">↩</button></div><div class="prekryv-spodni-wrap"><input id="overlayLevy" class="prekryv-input" readonly><input id="overlayPravy" class="prekryv-input" readonly></div></div><div id="kalkPanel" class="kalk-panel"><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="0">0</button><button data-k="-">-</button></div><div class="postranni-tlacitko vpravo"><button id="start" class="akce">S T A R T</button></div></div><div id="historie" class="historie"></div></main><script>
const $=i=>document.getElementById(i),
pyramida=$('pyramida'),
herniPlocha=$('herniPlocha'),
prekryvPanel=$('prekryvPanel'),
prekryvHorniWrap=$('prekryvHorniWrap'),
overlayAktivni=$('overlayAktivni'),
overlayLevy=$('overlayLevy'),
overlayPravy=$('overlayPravy'),
backHlavni=$('backHlavni'),
minusHlavni=$('minusHlavni'),
kalkToggle=$('kalkToggle'),
kalkPanel=$('kalkPanel'),
vyska=$('vyska'),
cifry=$('cifry'),
znamenko=$('znamenko'),
rezim=$('rezim'),
start=$('start'),
nastaveni=$('nastaveni'),
nastaveniToggle=$('nastaveniToggle'),
mazaniHistorie=$('mazaniHistorie'),
hlaska=$('hlaska'),
historie=$('historie'),
hlasToggle=$('hlasToggle'),
SR='pyramida_rezim',SV='pyramida_vyska',SC='pyramida_cifry',SZ='pyramida_znamenko',SH='pyramida_historie',SD='pyramida_historie_datum',SG='pyramida_rozehrana_hra';
let hraBezi=0,aktivniRadek=null,aktivniIndex=null,vysledky=[],akceBezi=false;
/* Převod znaku na číslice: - na CZ klávesnici vznikají pro Shift+čísla znaky jako Ě(=2) a Ř(=5) - na SK klávesnici vznikají místo nich znaky Ľ(=2) a Ť(=5) Proto mapujeme obě varianty → stejné číslo. */
const mapaCZ={'+':'1','ě':'2','Ě':'2','ľ':'2','Ľ':'2','š':'3','Š':'3','č':'4','Č':'4','ř':'5','Ř':'5','ť':'5','Ť':'5','ž':'6','Ž':'6','ý':'7','Ý':'7','á':'8','Á':'8','í':'9','Í':'9','é':'0','É':'0'};
const dnes=()=>{let d=new Date;return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmt=v=>{
if(v===''||v==null)return'';
let s=String(v).replace(/\s/g,''),
m=s[0]=='-'?'-':'';
s=s.replace(/-/g,'');
return m+s.replace(/\B(?=(\d{3})+(?!\d))/g,' ')
};
const cis=v=>Number(String(v).replace(/\s/g,''));
const pole=(r,i)=>pyramida.querySelector(`input[data-r="${r}"][data-i="${i}"]`);
const jeNastaveniOtevrene=()=>!nastaveni.classList.contains('zavreno');
const jeMobil=()=>matchMedia('(pointer: coarse)').matches;
const jeKalkOtevrena=()=>kalkPanel.classList.contains('zobrazen');
function aktualizujMinusTlacitko(){minusHlavni.style.display=znamenko.value==='pm'?'flex':'none'}
function raw(v){return String(v||'').replace(/\s/g,'')}
function rawPozice(f,pos){let n=0;for(let i=0;i<pos;i++)if(f[i]&&f[i]!==' ')n++;return n}
function fmtPozice(f,rawPos){let n=0;for(let i=0;i<f.length;i++){if(f[i]!==' '){if(n===rawPos)return i;n++}}return f.length}
function nastavKurzorRaw(rawPos){requestAnimationFrame(()=>{let f=overlayAktivni.value,p=fmtPozice(f,rawPos);overlayAktivni.setSelectionRange(p,p)})}
function uloz(){localStorage.setItem(SV,vyska.value);localStorage.setItem(SC,cifry.value);localStorage.setItem(SZ,znamenko.value);localStorage.setItem(SR,document.body.classList.contains('dark')?'dark':'light')}
function nacti(){let v=localStorage.getItem(SV),c=localStorage.getItem(SC),z=localStorage.getItem(SZ),r=localStorage.getItem(SR);if(v)vyska.value=v;if(c)cifry.value=Math.min(+c,8);if(z)znamenko.value=z;document.body.classList.toggle('dark',r==='dark');rezim.textContent=r==='dark'?'☀️':'🌙';aktualizujMinusTlacitko()}
function upravHistorii(h){return String(h||'').replace(/&nbsp;/g,' ').replace(/\s+(?=<span)/g,'')}
function nactiHistorii(){if(localStorage.getItem(SD)!==dnes()){localStorage.setItem(SD,dnes());localStorage.setItem(SH,'')}let h=upravHistorii(localStorage.getItem(SH)||'');localStorage.setItem(SH,h);historie.innerHTML=h}
function pridej(z){if(localStorage.getItem(SD)!==dnes()){localStorage.setItem(SD,dnes());localStorage.setItem(SH,'')}let h=upravHistorii(localStorage.getItem(SH)||'')+`<span class="hist-ok">${z}</span> `;localStorage.setItem(SH,h);historie.innerHTML=h}
function mazani(){if(mazaniHistorie.value.trim().toLowerCase()==='vymazat'){localStorage.setItem(SD,dnes());localStorage.setItem(SH,'');historie.innerHTML=''}mazaniHistorie.value=''}
function nastavStavNastaveni(){let o=jeNastaveniOtevrene();start.disabled=o;nastaveniToggle.classList.toggle('aktivni',o)}
function nahoda(c){let n=Math.floor(Math.random()*(10**c-1))+1;if(znamenko.value==='pm'&&Math.random()<.5)n=-n;return n}
function spocitejVysledky(){let R=+vyska.value;vysledky=[];for(let r=1;r<=R;r++)vysledky[r]=[];for(let i=0;i<R;i++)vysledky[R][i]=cis(pole(R,i).value);for(let r=R-1;r>=1;r--)for(let i=0;i<r;i++)vysledky[r][i]=vysledky[r+1][i]+vysledky[r+1][i+1]}
function sirkaTextu(t){return Math.min(Math.max(String(fmt(t)).length*18+80,130),innerWidth-20)}
function fontProText(t){let d=String(fmt(t)).length;if(d>18)return'18px';if(d>14)return'20px';if(d>11)return'23px';return'clamp(20px,4.7vw,30px)'}
function nastavPrekryvPozici(){let v=pole(1,0);if(!v)return;let a=herniPlocha.getBoundingClientRect(),b=v.getBoundingClientRect();prekryvPanel.style.top=(innerWidth<=480?b.top-a.top:b.bottom-a.top+10)+'px';nastavKalkPozici()}
function nastavKalkPozici(){if(!jeKalkOtevrena())return;let a=herniPlocha.getBoundingClientRect(),b=prekryvPanel.getBoundingClientRect();if(b.height)kalkPanel.style.top=(b.bottom-a.top+14)+'px'}
function zobrazKalk(){if(jeMobil())return;kalkPanel.classList.add('zobrazen');kalkToggle.classList.add('aktivni');nastavKalkPozici();overlayAktivni.focus()}
function skryjKalk(){kalkPanel.classList.remove('zobrazen');kalkToggle.classList.remove('aktivni')}
function zobrazPrekryv(){aktualizujMinusTlacitko();if(jeNastaveniOtevrene()||aktivniRadek==null)return;let a=pole(aktivniRadek,aktivniIndex),l=pole(aktivniRadek+1,aktivniIndex),p=pole(aktivniRadek+1,aktivniIndex+1);overlayAktivni.value=overlayAktivni.value||a.value;overlayLevy.value=l.value;overlayPravy.value=p.value;overlayAktivni.classList.remove('spravne');let maxPanel=innerWidth-20,maxSpodni=Math.floor((maxPanel-4)/2),spodniSirka=Math.min(Math.max(sirkaTextu(l.value),sirkaTextu(p.value),120),maxSpodni),aktivniMax=maxPanel,aktivniSirka=Math.min(sirkaTextu(vysledky[aktivniRadek][aktivniIndex]),aktivniMax);overlayAktivni.style.width=aktivniSirka+'px';prekryvHorniWrap.style.setProperty('--polovina-vstupu',(aktivniSirka/2)+'px');overlayLevy.style.width=overlayPravy.style.width=spodniSirka+'px';overlayAktivni.style.fontSize=fontProText(vysledky[aktivniRadek][aktivniIndex]);overlayLevy.style.fontSize=overlayPravy.style.fontSize=fontProText(String(l.value).length>String(p.value).length?l.value:p.value);nastavPrekryvPozici();prekryvPanel.classList.add('zobrazen');setTimeout(()=>{overlayAktivni.focus();overlayAktivni.select();nastavKalkPozici()},50)}
function skryjPrekryv(){prekryvPanel.classList.remove('zobrazen');overlayAktivni.value=overlayLevy.value=overlayPravy.value='';overlayAktivni.classList.remove('spravne')}
function aktivuj(r,i,draft=''){aktivniRadek=r;aktivniIndex=i;pyramida.querySelectorAll('input').forEach(x=>{if(!x.classList.contains('spodni')&&!x.classList.contains('spravne'))x.classList.add('zamcene')});let a=pole(r,i);a.classList.remove('zamcene');overlayAktivni.value=draft||a.value||'';zobrazPrekryv();ulozHru();zkusAuto()}
function dalsi(){if(aktivniIndex+1<aktivniRadek)return{r:aktivniRadek,i:aktivniIndex+1};if(aktivniRadek-1>=1)return{r:aktivniRadek-1,i:0};return null}
function vytvor(gen,data=null){pyramida.innerHTML='';hlaska.textContent='';skryjPrekryv();vysledky=[];let R=data?+data.vyska:+vyska.value,C=data?+data.cifry:Math.min(+cifry.value,8);vyska.value=R;cifry.value=C;if(data)znamenko.value=data.znamenko;aktualizujMinusTlacitko();for(let r=1;r<=R;r++){let row=document.createElement('div');row.className='radek';for(let i=0;i<r;i++){let s=document.createElement('div'),x=document.createElement('input');s.className='bunka-slot';x.type='text';x.inputMode='numeric';x.dataset.r=r;x.dataset.i=i;if(r===R){x.className='spodni';x.readOnly=1;x.value=data?fmt(data.spodni[i]):gen?fmt(nahoda(C)):''}else if(gen||data){x.className='zamcene';x.readOnly=1;if(data&&data.vyplnene&&data.vyplnene[r]&&data.vyplnene[r][i]!=null){x.value=fmt(data.vyplnene[r][i]);x.classList.add('spravne');x.classList.remove('zamcene')}}s.appendChild(x);row.appendChild(s)}pyramida.appendChild(row)}hraBezi=!!(gen||data);start.textContent=hraBezi?'Z R U Š I T':'S T A R T';aktivniRadek=aktivniIndex=null;if(hraBezi){spocitejVysledky();data?aktivuj(data.aktivniRadek,data.aktivniIndex,data.draft||''):aktivuj(R-1,0);ulozHru();setHlasIkonyViditelnost(true)}else{setHlasIkonyViditelnost(false)}}
function vyplneneBunky(){let R=+vyska.value,o=[];for(let r=1;r<R;r++){o[r]=[];for(let i=0;i<r;i++){let x=pole(r,i);if(x&&x.classList.contains('spravne'))o[r][i]=cis(x.value)}}return o}
function ulozHru(){if(!hraBezi||aktivniRadek==null){localStorage.removeItem(SG);return}let R=+vyska.value,spodni=[];for(let i=0;i<R;i++)spodni[i]=cis(pole(R,i).value);localStorage.setItem(SG,JSON.stringify({vyska:+vyska.value,cifry:+cifry.value,znamenko:znamenko.value,spodni,vyplnene:vyplneneBunky(),aktivniRadek,aktivniIndex,draft:overlayAktivni.value||''}))}
function smazHru(){localStorage.removeItem(SG)}
function obnovHru(){try{let raw=localStorage.getItem(SG);if(!raw)return false;let data=JSON.parse(raw);if(!data||!data.spodni||!data.aktivniRadek)return false;vytvor(0,data);return true}catch(e){smazHru();return false}}
function vycistiVstup(v){let out='',spatne=false;for(let ch of String(v)){if(ch===' ')continue;if(/[0-9]/.test(ch))out+=ch;else if(ch==='-'&&out.indexOf('-')<0&&out.length===0)out+='-';else if(mapaCZ[ch])out+=mapaCZ[ch];else spatne=true}return{v:fmt(out),spatne}}

function smazPosledni(){if(!hraBezi||aktivniRadek==null)return;overlayAktivni.focus();let f=overlayAktivni.value,s=overlayAktivni.selectionStart??f.length,e=overlayAktivni.selectionEnd??f.length,v=raw(f),rs=rawPozice(f,s),re=rawPozice(f,e),novyPos=rs;if(rs!==re){v=v.slice(0,rs)+v.slice(re);novyPos=rs}else if(rs>0){v=v.slice(0,rs-1)+v.slice(rs);novyPos=rs-1}overlayAktivni.value=fmt(v);overlayAktivni.classList.remove('spravne');hlaska.textContent='';nastavKurzorRaw(novyPos);zkusAuto()}
function prepniMinus(){if(!hraBezi||aktivniRadek==null)return;overlayAktivni.focus();if(znamenko.value!=='pm')return;let f=overlayAktivni.value,pos=rawPozice(f,overlayAktivni.selectionStart??f.length),v=raw(f);if(v.startsWith('-')){v=v.slice(1);pos=Math.max(0,pos-1)}else{v='-'+v;pos=pos+1}overlayAktivni.value=fmt(v);overlayAktivni.classList.remove('spravne');hlaska.textContent='';nastavKurzorRaw(pos);zkusAuto()}
function vlozNaKurzor(k){if(!hraBezi||aktivniRadek==null)return;overlayAktivni.focus();let f=overlayAktivni.value,s=overlayAktivni.selectionStart??f.length,e=overlayAktivni.selectionEnd??f.length,v=raw(f),rs=rawPozice(f,s),re=rawPozice(f,e);v=v.slice(0,rs)+k+v.slice(re);overlayAktivni.value=fmt(v);overlayAktivni.classList.remove('spravne');hlaska.textContent='';nastavKurzorRaw(rs+1);zkusAuto()}
function zrusNeboStart(){if(jeNastaveniOtevrene()||akceBezi)return;akceBezi=1;mazani();uloz();if(hraBezi){hraBezi=0;aktivniRadek=aktivniIndex=null;start.textContent='S T A R T';setHlasIkonyViditelnost(false);stopHlas();skryjPrekryv();smazHru();vytvor(0)}else{vytvor(1);setTimeout(()=>setHlasIkonyViditelnost(true),0)}setTimeout(()=>akceBezi=0,80)}
function ohnostroj(sila=3){let o=document.createElement('div');o.className='ohnostroj';document.body.appendChild(o);let davky=sila===1?1:15,pocet=sila===1?10:34,prodleva=sila===1?0:150,zivot=sila===1?650:2700;for(let k=0;k<davky;k++)setTimeout(()=>{for(let i=0;i<pocet;i++){let s=document.createElement('span'),u=Math.random()*6.28,d=(sila===1?35:80)+Math.random()*(sila===1?45:120);s.className='jiskra';s.style.setProperty('--x',20+Math.random()*60+'vw');s.style.setProperty('--y',20+Math.random()*35+'vh');s.style.setProperty('--dx',Math.cos(u)*d+'px');s.style.setProperty('--dy',Math.sin(u)*d+'px');s.style.setProperty('--h',Math.random()*360);o.appendChild(s);setTimeout(()=>s.remove(),900)}},k*prodleva);setTimeout(()=>o.remove(),zivot)}
function kalkVloz(k){if(!hraBezi||aktivniRadek==null)return;if(k==='-'){prepniMinus();return}vlozNaKurzor(k)}

[vyska,cifry,znamenko].forEach(e=>e.onchange=()=>{mazani();uloz();aktualizujMinusTlacitko();hraBezi=0;aktivniRadek=aktivniIndex=null;start.textContent='S T A R T';setHlasIkonyViditelnost(false);stopHlas();skryjPrekryv();smazHru();vytvor(0)});

/* ===== Hlasové zadávání (H) ===== */
let recognition=null;
let hlasBezi=0;
let hlasPosledniText='';
function setHlasIkonyViditelnost(v){
  if(jeMobil()) return;
  hlasToggle.classList.toggle('zobrazeno', !!v);
}
function stopHlas(){
  try{
    hlasBezi=0;
    hlasToggle.classList.remove('aktivni');
    if(recognition){
      recognition.onresult=null;
      recognition.onerror=null;
      recognition.onend=null;
      recognition.stop();
    }
  }catch(_){}
}
function normalizeSpeechText(s){
  s = String(s||'').toLowerCase().trim();
  // převedeme typické výrazy na číslice
  const mapSlova = {
    'nula':'0','nula.':'0',
    'jedna':'1','jedno':'1','jedničка':'1',
    'dva':'2','dvě':'2','dve':'2',
    'tři':'3','tri':'3','tři.':'3','tri.':'3',
    'čtyři':'4','ctyri':'4','čtyři.':'4','ctyr i':'4',
    'pět':'5','pet':'5',
    'šest':'6','sest':'6',
    'sedm':'7','sedm.':'7',
    'osm':'8','os m':'8','osm.':'8',
    'devět':'9','devet':'9','devět.':'9','devet.':'9',
    'mínus':'-','minus':'-'
  };

  // ponecháme i čísla oddělená mezerami
  // pokus: pokud je v textu víc slov, zkusíme poskládat "číslice"
  const tokens = s
    .replace(/[^\p{L}\p{N}\s\-.,]/gu,' ')
    .replace(/\./g,' ')
    .split(/\s+/)
    .filter(Boolean);

  let out='';
  for(const t of tokens){
    if(/^\d+$/.test(t)){
      out += t;
      continue;
    }
    if(mapSlova[t]) out += mapSlova[t];
    else if(t==='+' ) out += '1'; // nechtěně, ale aby to něco dalo (stejně pak vyčistíme)
  }
  // občas speech přinese přímo číslici ve formě "1 2 3"
  // normalizeSpeechText vrací jen kandidáta; čistíme to následně přes vycistiVstup/VlozNaKurzor
  return out;
}

async function startHlas(){
  if(!hraBezi || aktivniRadek==null){
    hlaska.textContent='Nejdřív stiskni START a vyber buňku.';
    return;
  }
  if(jeNastaveniOtevrene()){
    hlaska.textContent='Zavři nastavení.';
    return;
  }
  if(hla sveBezi){} // dummy
  if(hlasBezi) return;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    hlaska.textContent='Tento prohlížeč nepodporuje hlasové zadávání.';
    return;
  }

  stopHlas(); // jistota
  recognition = new SpeechRecognition();
  recognition.lang = 'cs-CZ';
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  hlasBezi=1;
  hlasToggle.classList.add('aktivni');
  hlaska.textContent='Mluv (zadávej číslice).';

  recognition.onresult = (event)=>{
    if(!hlasBezi) return;
    // vezmeme poslední transcript
    let txt='';
    for(let i=0;i<event.results.length;i++){
      const res=event.results[i];
      if(res && res[0]) txt = res[0].transcript;
    }
    if(!txt) return;

    const cleaned = normalizeSpeechText(txt);
    if(!cleaned) return;

    // zpracujeme pouze nově vzniklý text, aby se neopakovalo
    // (speechRecognition interim může volat hodněkrát)
    const normFull = cleaned;
    if(normFull === hlasPosledniText) return;
    hlasPosledniText = normFull;

    // vložíme jen znaky, které dovoluje logika vstupu
    // (vložíme po jednom, aby se automaticky nastavoval kurzor + zkusAuto)
    // Povolené: číslice a případně počáteční '-' (prepniMinus zvládá i toggling, ale tady chceme vložení '-')
    // Nejjednodušší: projít znaky a volat kalkVloz/ prepniMinus.
    for(const ch of normFull){
      // jen číslice nebo první '-'
      if(ch === '-'){
        if(znamenko.value !== 'pm') continue;
        // pokud v inputu už je '-', přes funkci to přepneme (toggle)
        // lepší než vkládat char přímo, protože zbytek validace řeší vycistiVstup/zkusAuto.
        // Pokud input aktuálně nemá '-', přepneme; pokud má, nepřidáváme duplicitně.
        let curRaw = raw(overlayAktivni.value);
        if(!curRaw.startsWith('-')) prepniMinus();
        continue;
      }
      if(/[0-9]/.test(ch)) vlozNaKurzor(ch);
    }
  };

  recognition.onerror = (e)=>{
    hlasBezi=0;
    hlasToggle.classList.remove('aktivni');
    // typicky: network / no-speech
    hlaska.textContent = 'Hlasové zadávání selhalo: ' + (e?.error || 'chyba');
  };

  recognition.onend = ()=>{
    // když skončí sám, přepneme stav
    hlasBezi=0;
    hlasToggle.classList.remove('aktivni');
    hlasPosledniText='';
    if(hraBezi && aktivniRadek!=null) {
      hlaska.textContent='(Hlas dokončen) Můžeš mluvit znovu.';
    }
  };

  try{
    recognition.start();
  }catch(_){
    hlasBezi=0;
    hlasToggle.classList.remove('aktivni');
    hlaska.textContent='Nelze spustit hlasové zadávání.';
  }
}

hlasToggle.onclick = (e)=>{
  e.preventDefault();
  e.stopPropagation();
  if(!hraBezi || aktivniRadek==null) return;
  if(hlasBezi){
    hlaska.textContent='Stop hlasu...';
    stopHlas();
  }else{
    startHlas();
  }
};

// Když se uživatel dostane mimo hru, stopni hlas
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) stopHlas();
});
