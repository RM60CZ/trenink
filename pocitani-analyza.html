<script>
(function(){

const $=id=>document.getElementById(id);
const odpovedEl=$('odpoved');
const inputWrapper=$('inputWrapper');

let realValue = '';
let isPasswordMode = true; // na úvodní obrazovce = true

// === SPOLEHLIVÉ MASKOVÁNÍ HESLA ===
// Místo input eventu použijeme beforeinput + input combo
odpovedEl.addEventListener('beforeinput', function(e) {
  if (!isPasswordMode) return; // v režimu výpočtů normální chování
  
  if (e.inputType === 'insertText' && e.data) {
    e.preventDefault();
    realValue += e.data;
    this.value = '*'.repeat(realValue.length);
  } else if (e.inputType === 'deleteContentBackward') {
    e.preventDefault();
    if (realValue.length > 0) {
      realValue = realValue.slice(0, -1);
      this.value = '*'.repeat(realValue.length);
    }
  } else if (e.inputType === 'deleteContentForward') {
    e.preventDefault();
    realValue = '';
    this.value = '';
  } else if (e.inputType === 'insertCompositionText' || e.inputType === 'insertReplacementText') {
    // Pro mobilní klávesnice s predikcí
    e.preventDefault();
    if (e.data) {
      realValue += e.data;
      this.value = '*'.repeat(realValue.length);
    }
  }
});

// Záchytná síť pro případ, že beforeinput nepokryje vše (starší browsery)
odpovedEl.addEventListener('input', function(e) {
  if (!isPasswordMode) return;
  
  const displayed = this.value;
  const allStars = /^\**$/.test(displayed);
  
  if (!allStars) {
    // Nějaké písmeno proklouzlo — najdeme nové znaky
    for (let i = 0; i < displayed.length; i++) {
      if (displayed[i] !== '*') {
        // Tohle je nový znak
        if (i >= realValue.length) {
          realValue += displayed[i];
        }
      }
    }
    this.value = '*'.repeat(realValue.length);
  } else {
    // Samé hvězdičky — synchronizujeme délku (mazání)
    if (displayed.length < realValue.length) {
      realValue = realValue.substring(0, displayed.length);
    }
  }
});

// Zabránit paste v password režimu
odpovedEl.addEventListener('paste', function(e) {
  if (!isPasswordMode) return;
  e.preventDefault();
  const pasted = (e.clipboardData || window.clipboardData).getData('text');
  if (pasted) {
    realValue += pasted;
    this.value = '*'.repeat(realValue.length);
  }
});

const fmt=x=>{
  if(typeof x==='bigint')return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'\xA0');
  if(typeof x!=='number')return String(x);
  if(Number.isInteger(x))return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'\xA0');
  const[c,d]=x.toString().split('.');
  return d?c.replace(/\B(?=(\d{3})+(?!\d))/g,'\xA0')+','+d:c.replace(/\B(?=(\d{3})+(?!\d))/g,'\xA0');
};

function fmtInputStr(s){
  s=s.replace(/\s|\xA0/g,'');
  const neg=s.startsWith('-');
  const abs=neg?s.slice(1):s;
  const[ip,dp]=abs.split('.');
  const r=ip.replace(/\B(?=(\d{3})+(?!\d))/g,'\xA0');
  return(neg?'-':'')+r+(dp!==undefined?','+dp:'');
}

const norm=s=>s.trim().replace(/\s|\xA0+/g,'').replace(',','.');
const genNum=n=>{const mn=10**(n-1),mx=10**n-1;return Math.floor(Math.random()*(mx-mn+1))+mn};
const trunc4=n=>{const[c,d]=(n+'').split('.');return d?c+'.'+d.substring(0,4):c};

const KEY='matika_trenink_v4';
let correct=0,wrong=0,streak=0,history=[],aktualniPriklad=null,zobrazitVysledek=false,isProcessing=false;

const operaceEl=$('operace'),cis1=$('cislice1'),cis2=$('cislice2'),chybaEl=$('chyba');
const prikladEl=$('priklad'),caraEl=$('cara'),btnEl=$('tlacitko');
const upperBox=$('upperBox');
const inputIcon=$('inputIcon');
const scoreC=$('scoreCorrect'),scoreW=$('scoreWrong'),streakEl=$('streakCount');
const histCont=$('historyContainer'),histList=$('historyList'),histEmpty=$('historyEmpty');

const themeToggle=$('themeToggle');
const themeIconSun=$('themeIconSun');
const themeIconMoon=$('themeIconMoon');

const today=new Date();
const czMonths=['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];
const czDays=['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'];
$('currentDate').textContent=`${czDays[today.getDay()]} ${today.getDate()}. ${czMonths[today.getMonth()]} ${today.getFullYear()}`;
const todayStr=today.toISOString().slice(0,10);

function updateThemeIcons(){
  const isDark=document.documentElement.classList.contains('dark');
  if(isDark){
    themeIconSun.classList.remove('hidden');
    themeIconMoon.classList.add('hidden');
  }else{
    themeIconMoon.classList.remove('hidden');
    themeIconSun.classList.add('hidden');
  }
}

function toggleTheme(){
  document.documentElement.classList.toggle('dark');
  updateThemeIcons();
}

updateThemeIcons();
themeToggle.addEventListener('click', toggleTheme);

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s.date === todayStr){
        correct = s.correct || 0;
        wrong = s.wrong || 0;
        streak = s.streak || 0;
        history = s.history || [];
      }
      if(s.operace) operaceEl.value = s.operace;
      if(s.cislice1) cis1.value = s.cislice1;
      if(s.cislice2) cis2.value = s.cislice2;
    }
  }catch(e){}
}

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      date: todayStr,
      correct, wrong, streak, history,
      operace: operaceEl.value,
      cislice1: cis1.value,
      cislice2: cis2.value
    }));
  }catch(e){}
}

for(let i=1;i<=9;i++){
  cis1.innerHTML += `<option value="${i}">${i}</option>`;
  cis2.innerHTML += `<option value="${i}">${i}</option>`;
}

if(!localStorage.getItem(KEY)){
  cis1.value = '2';
  cis2.value = '1';
  operaceEl.value = '+';
} else {
  load();
}

function updateCis2(){
  const op=operaceEl.value, v1=+cis1.value;
  [...cis2.options].forEach(o=>{o.disabled=(op==='-'&&+o.value>v1)});
  if(+cis2.value>v1&&op==='-') cis2.value=v1;
}
updateCis2();

operaceEl.addEventListener('change', ()=>{ updateCis2(); chybaEl.textContent=''; save(); });
cis1.addEventListener('change', ()=>{ updateCis2(); save(); });
cis2.addEventListener('change', save);

function generate(){
  const op=operaceEl.value,n1=+cis1.value,n2=+cis2.value;
  chybaEl.textContent='';
  if(op==='-'&&n1<n2){chybaEl.textContent='❌ Při odčítání musí mít 1. číslo ≥ cifer než 2.';return null}
  let a,b,i=0;
  while(i++<1000){
    a=genNum(n1);b=n2===1?Math.floor(Math.random()*8)+2:genNum(n2);
    if(op==='-'&&a<=b)continue;if(op==='/'&&b===0)continue;break;
  }
  let vysledek,vysledekZ;
  if(op==='+'){vysledek=vysledekZ=a+b}
  else if(op==='-'){vysledek=vysledekZ=a-b}
  else if(op==='*'){vysledek=vysledekZ=BigInt(a)*BigInt(b)}
  else{vysledek=a/b;vysledekZ=trunc4(vysledek)}
  return{a,b,op,vysledek,vysledekZ};
}

function startNewProblem(){
  const p=generate();if(!p)return false;
  aktualniPriklad=p;
  isPasswordMode=false; // přepnout do režimu výpočtů
  showProblem(p);
  odpovedEl.value='';
  realValue='';
  zobrazitVysledek=true;
  updateBtn();
  setTimeout(()=>{
    caraEl.style.opacity='1';
    odpovedEl.focus();
    isProcessing=false;
  },50);
  return true;
}

function showProblem(p){
  const fa=fmt(p.a),fb=fmt(p.b);
  const opUI=p.op==='*'?'x':p.op==='/'?':':p.op==='-'?'−':'+';
  
  prikladEl.style.whiteSpace = 'normal';
  prikladEl.classList.remove('math-text');
  
  prikladEl.innerHTML=`
    <div class="flex justify-end gap-3 w-full">
      <div class="flex flex-col text-right select-none">
        <div class="invisible">0</div>
        <div>${opUI}</div>
      </div>
      <div class="flex flex-col text-right">
        <div>${fa}</div>
        <div>${fb}</div>
      </div>
    </div>
  `;
  caraEl.style.opacity='0';
  
  odpovedEl.setAttribute('inputmode', 'decimal');
  odpovedEl.placeholder='Váš výsledek';
  odpovedEl.style.textAlign = 'right';
}

function resetToInitialState() {
  aktualniPriklad = null;
  zobrazitVysledek = false;
  isPasswordMode = true; // zpět do režimu hesla
  odpovedEl.value = '';
  realValue = '';
  odpovedEl.setAttribute('inputmode', 'text');
  odpovedEl.placeholder = 'historie';
  odpovedEl.style.textAlign = 'center';
  updateBtn();
  btnEl.focus();
}

function checkDivision(userStr,p){
  const n=norm(userStr);
  const trueStr=trunc4(p.vysledek);
  const[tc,td='']=trueStr.split('.');
  const[uc,ud='']=n.split('.');
  if(uc!==tc)return{ok:false,bracket:0};
  const correctDecLen=td.length;
  let userDec=ud;
  while(userDec.length>correctDecLen&&userDec.endsWith('0'))userDec=userDec.slice(0,-1);
  const truePadded=td.padEnd(Math.max(userDec.length,correctDecLen),'0');
  for(let i=0;i<userDec.length;i++){if(userDec[i]!==truePadded[i])return{ok:false,bracket:i+1}}
  return{ok:true,bracket:userDec.length};
}

function check(input,p){
  const n=norm(input);if(!n)return false;
  if(p.op==='/'){return checkDivision(input,p).ok}
  else if(typeof p.vysledek==='bigint'){try{return BigInt(n)===p.vysledek}catch{return false}}
  else{const num=parseFloat(n);return!isNaN(num)&&Math.abs(num-p.vysledek)<1e-9}
}

function findFirstWrongDigit(userInput,p){
  const n=norm(userInput);
  let cs,us;
  if(typeof p.vysledek==='bigint'){
    cs=p.vysledek.toString();
    try{us=BigInt(n).toString()}catch{return 1}
  }else{
    cs=String(p.vysledek);
    us=String(parseFloat(n));
  }
  const ml=Math.max(cs.length,us.length);
  for(let i=0;i<ml;i++){if((cs[i]||'')!==(us[i]||''))return i+1}
  return 0;
}

function updateScores(){
  scoreC.textContent=correct;scoreW.textContent=wrong;streakEl.textContent=streak;
  streakEl.parentElement.classList.add('pop');
  setTimeout(()=>streakEl.parentElement.classList.remove('pop'),200);
}

function updateBtn(){
  btnEl.classList.remove('btn-pulse','btn-glow');
  if(!zobrazitVysledek){btnEl.textContent='START';btnEl.classList.add('btn-pulse')}
  else{btnEl.textContent='✓ VÝSLEDEK (kontrola)';btnEl.classList.add('btn-glow')}
}

function renderHistory(){
  if(!history.length){histEmpty.style.display='block';histCont.style.opacity='0';histList.querySelectorAll('.hi').forEach(e=>e.remove());return}
  histEmpty.style.display='none';histCont.style.opacity='1';
  histList.querySelectorAll('.hi').forEach(e=>e.remove());
  history.forEach((h,i)=>{
    const d=document.createElement('div');
    d.className=`hi slide-up px-2.5 py-1 rounded-md text-[12px] tabular-nums font-bold border ${h.correct?'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300':'bg-rose-50 dark:bg-rose-900/20 border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300'}`;
    d.style.animationDelay=i*50+'ms';
    d.textContent=h.text+' '+(h.correct?'✓':'✗');
    histList.appendChild(d);
  });
}

function addHist(ok,userInput){
  if(!aktualniPriklad)return;
  const p=aktualniPriklad;
  const v=p.vysledekZ!==undefined?p.vysledekZ:p.vysledek;
  const opStr=p.op==='*'?'x':p.op==='/'?':':p.op==='-'?'−':'+';
  let bracketStr='';
  if(p.op==='/'){
    const r=checkDivision(userInput,p);
    bracketStr=`(${r.bracket})`;
  }else if(!ok){
    const pos=findFirstWrongDigit(userInput,p);
    if(pos>0)bracketStr=`(${pos})`;
  }
  const text=`${fmt(p.a)} ${opStr} ${fmt(p.b)} = ${fmt(v)}${bracketStr}`;
  history.unshift({text,correct:ok});
  renderHistory();
}

function handle(e){
  if(isProcessing)return;
  isProcessing=true;
  if(e)e.preventDefault();
  
  const parentDiv = odpovedEl.parentElement.parentElement;
  parentDiv.classList.remove('zelene','cervene');
  odpovedEl.classList.remove('text-white');
  
  // === ÚVODNÍ OBRAZOVKA (password mode) ===
  if(!zobrazitVysledek && !aktualniPriklad){
    const inputVal = realValue.trim();
    
    // Bod 1: Prázdný input -> spusť počítání
    if (!inputVal) {
      if(startNewProblem()) return;
      isProcessing=false;
      return;
    }
    
    // Bod 2: Správné heslo "zrušit" -> smaž historii a spusť počítání
    if (inputVal.toLowerCase() === 'zrušit') {
      history=[];correct=wrong=streak=0;
      updateScores();renderHistory();save();
      chybaEl.textContent='✅ Historie smazána';
      setTimeout(()=>chybaEl.textContent='',2000);
      if(startNewProblem()) return;
      isProcessing=false;
      return;
    }
    
    // Bod 3: Špatné heslo -> hláška, vyčistit, zpět na bod 1
    chybaEl.textContent='⚠️ Špatné heslo';
    setTimeout(()=>chybaEl.textContent='',2000);
    resetToInitialState();
    isProcessing=false;
    return;
  }
  
  // === OBRAZOVKA VÝPOČTŮ ===
  if(zobrazitVysledek){
    const val=odpovedEl.value.trim();
    const normVal=norm(val);
    
    if(!val){
      // Prázdný = ukáž výsledek
      odpovedEl.value=fmt(aktualniPriklad.vysledekZ!==undefined?aktualniPriklad.vysledekZ:aktualniPriklad.vysledek);
      zobrazitVysledek=false;
      updateBtn();
      // Po zobrazení výsledku čekáme na další START
      setTimeout(()=>{
        isProcessing=false;
      },50);
      return;
    }
    
    if(!/^-?\d+([.,]\d*)?$/.test(normVal)){
      chybaEl.textContent='⚠️ Nepovolený znak!';
      isProcessing=false;
      odpovedEl.focus();
      return;
    }
    
    odpovedEl.value=fmtInputStr(normVal);
    let ok;
    if(aktualniPriklad.op==='/'){
      ok=checkDivision(normVal,aktualniPriklad).ok;
    }else{
      ok=check(normVal,aktualniPriklad);
    }
    
    parentDiv.classList.add(ok?'zelene':'cervene');
    odpovedEl.classList.add('text-white');

    if(ok){
      correct++;streak++;
    }
    else{
      wrong++;streak=0;
      parentDiv.classList.add('shake');
      setTimeout(()=>parentDiv.classList.remove('shake'),500);
    }
    
    updateScores();
    addHist(ok,normVal);
    save();
    zobrazitVysledek=false;
    updateBtn();
    // Po kontrole výsledku: focus na START, čekáme na další
    btnEl.focus();
    setTimeout(()=>{
      isProcessing=false;
    },150);
    return;
  }
  
  // === PO ZOBRAZENÍ VÝSLEDKU - START = další příklad ===
  if(aktualniPriklad && !zobrazitVysledek){
    if(startNewProblem()) return;
    isProcessing=false;
  }
}

// Event listeners
btnEl.addEventListener('touchstart',e=>handle(e),{passive:false});
btnEl.addEventListener('click',e=>{if(e.pointerType!=='touch')handle(e)});
odpovedEl.addEventListener('keydown',e=>{if(e.key==='Enter')handle(e)});
$('settingsToggle').addEventListener('click',()=>{$('settingsPanel').classList.toggle('collapsed')});

// Inicializace
updateScores();
updateBtn();
renderHistory();
resetToInitialState();

})();
</script>
