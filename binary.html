<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <!-- Zámek zoomu a správná šířka -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bináry</title>
  <style>
    :root {
      --bg:#f5f5f7; --t:#1d1d1f; --c:#fff; --b:#d2d2d7; 
      --btn:#e8e8ed; --btnh:#d2d2d7; --p:#0071e3; --pt:#fff; 
      --ok:#34c759; --er:#ff3b30;
    }
    [data-theme="dark"] {
      --bg:#000; --t:#f5f5f7; --c:#1c1c1e; --b:#38383a; 
      --btn:#2c2c2e; --btnh:#3a3a3c;
    }

    /* RESET A ZÁKLAD */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--t);
      overflow: hidden; /* Zákaz scrollování celé stránky */
    }

    /* HLAVNÍ KONTEJNER - FLEXBOX SLOUPCE */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%; /* Plná výška obrazovky */
      width: 100%;
      max-width: 600px; /* Max šířka pro desktop */
      margin: 0 auto; /* Centrované na desktopu */
      background: var(--c);
      position: relative;
    }

    /* 1. HLAVIČKA - FIXNÍ NAHORU */
    .header {
      flex-shrink: 0; /* Nebude se smačkávat */
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--b);
      background: var(--c);
      z-index: 10;
    }
    .header h1 { font-size: 24px; font-weight: 700; margin: 0; }
    .header-icons { display: flex; gap: 16px; align-items: center; }
    .icon-btn { background: none; border: none; font-size: 26px; cursor: pointer; color: var(--t); padding: 5px; }
    .finger-toggle-btn { 
      background: none; border: none; font-size: 30px; font-weight: 800; 
      cursor: pointer; color: var(--t); line-height: 1; 
    }

    /* 2. OBSAH - SCROLLABLE (STŘED) */
    .content-area {
      flex-grow: 1; /* Zabere všechno volné místo */
      overflow-y: auto; /* Scrolluje pouze obsah uvnitř */
      overflow-x: hidden;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    /* Nastavení */
    .settings-group { display: none; flex-direction: column; gap: 12px; width: 100%; }
    select { 
      width: 100%; padding: 14px; border-radius: 10px; 
      border: 2px solid var(--b); background: var(--c); color: var(--t); 
      font-size: 18px; font-weight: 500;
    }
    .info-text { font-size: 16px; color: #86868b; text-align: center; display: none; }

    /* Prsty */
    .finger-panel { display: none; width: 100%; justify-content: center; }
    .finger-panel.visible { display: flex; }
    .finger-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr); /* Plná šířka */
      gap: 12px;
      width: 100%;
      max-width: 400px;
    }
    .finger-sq {
      width: 100%; aspect-ratio: 1/1.5; /* Poměr stran */
      background: #d6d6db; border-radius: 12px;
      user-select: none; align-self: end;
      transform-origin: bottom center;
      transition: transform 0.2s, background 0.2s;
      pointer-events: none;
    }
    .finger-sq.on {
      background: #8fa39a; transform: scaleY(2);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    /* Hra */
    .question { 
      font-size: 48px; font-weight: 800; text-align: center; 
      margin: 20px 0; word-break: break-all;
    }
    
    .input-with-back { display: flex; gap: 10px; width: 100%; max-width: 400px; }
    #single-input {
      flex-grow: 1; padding: 16px; border-radius: 12px; text-align: center;
      border: 2px solid var(--b); background: var(--c); color: var(--t);
      font-size: 28px; font-weight: bold; outline: none;
      height: 60px;
    }
    #single-input.success { color: var(--ok); border-color: var(--ok); }
    #single-input.error { color: var(--er); border-color: var(--er); }
    
    .back-btn, .clear-btn {
      background: var(--btn); color: var(--t); border: none; border-radius: 12px;
      font-size: 20px; font-weight: bold; cursor: pointer;
      height: 60px; width: 60px; flex-shrink: 0;
    }
    .clear-btn { width: auto; padding: 0 24px; }

    /* Klávesnice */
    .keypad-bin, .keypad-dec {
      display: none; gap: 12px; width: 100%; max-width: 400px;
    }
    .keypad-bin { grid-template-columns: repeat(2, 1fr); }
    .keypad-dec { grid-template-columns: repeat(3, 1fr); }
    
    .keypad-bin.visible, .keypad-dec.visible-desktop { display: grid; }
    
    .key-btn {
      background: var(--btn); color: var(--t); border: none; padding: 20px;
      border-radius: 12px; font-size: 24px; font-weight: bold; cursor: pointer;
    }
    .key-btn:active { background: var(--btnh); }

    /* Historie */
    .history-container { width: 100%; max-width: 400px; margin-top: 20px; border-top: 1px solid var(--b); padding-top: 15px; }
    .history-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    .history-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .history-item {
      padding: 6px 12px; border-radius: 6px; font-family: monospace; font-size: 16px;
      background: var(--c); color: var(--t); border: 1px solid transparent;
    }
    .history-item.correct { color: var(--ok); border-color: var(--ok); }
    .history-item.error { color: var(--er); border-color: var(--er); }

    /* 3. PATIČKA S TLAČÍTKEM - FIXNÍ DOLŮ */
    .footer-action {
      flex-shrink: 0; /* Nebude se smačkávat */
      padding: 20px;
      background: var(--c);
      border-top: 1px solid var(--b);
    }
    .main-action {
      width: 100%; padding: 20px; border-radius: 12px;
      background: var(--p); color: var(--pt);
      border: none; font-size: 22px; font-weight: bold; cursor: pointer;
    }
    .main-action:active { opacity: 0.9; }

    /* Desktopová úprava - zobrazení rámečku */
    @media (min-width: 521px) {
      .app-container {
        margin: 20px auto;
        height: calc(100% - 40px); /* Výška mínus okraje */
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        overflow: hidden; /* Aby stín nepřetékal */
      }
      .header { border-radius: 20px 20px 0 0; }
      .footer-action { border-radius: 0 0 20px 20px; }
    }
  </style>
</head>
<body data-theme="light">

<div class="app-container">
  <!-- HLAVIČKA -->
  <div class="header">
    <h1 id="app-title">Bináry</h1>
    <div class="header-icons">
      <button class="finger-toggle-btn" id="finger-toggle-btn" onclick="toggleFingerPanel()">P</button>
      <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
    </div>
  </div>

  <!-- OBSAH (SCROLLUJE) -->
  <div class="content-area">
    
    <div class="finger-panel" id="finger-panel">
      <div class="finger-grid" id="finger-grid"></div>
    </div>

    <div class="settings-group" id="settings-panel">
      <select id="direction" onchange="updateInfo()">
        <option value="dec2bin">Decimální na Binární</option>
        <option value="bin2dec">Binární na Decimální</option>
      </select>
      <select id="bits" onchange="updateInfo()"></select>
      <div class="info-text" id="info"></div>
    </div>

    <div class="question" id="question-display"></div>

    <div class="input-with-back">
      <input type="tel" id="single-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="back-btn" id="back-btn-dec" onclick="deleteLeft()" style="display:none;">⌫</button>
      <button class="clear-btn" id="clear-btn-dec" onclick="clearAll()" style="display:none;">C</button>
    </div>

    <div class="keypad-bin" id="keypad-bin">
      <button class="key-btn" onclick="typeVal('0')">0</button>
      <button class="key-btn" onclick="typeVal('1')">1</button>
    </div>
    
    <div class="keypad-dec" id="keypad-dec">
      <button class="key-btn" onclick="typeVal('1')">1</button>
      <button class="key-btn" onclick="typeVal('2')">2</button>
      <button class="key-btn" onclick="typeVal('3')">3</button>
      <button class="key-btn" onclick="typeVal('4')">4</button>
      <button class="key-btn" onclick="typeVal('5')">5</button>
      <button class="key-btn" onclick="typeVal('6')">6</button>
      <button class="key-btn" onclick="typeVal('7')">7</button>
      <button class="key-btn" onclick="typeVal('8')">8</button>
      <button class="key-btn" onclick="typeVal('9')">9</button>
      <button class="key-btn" onclick="typeVal('0')" style="grid-column: 2;">0</button>
    </div>

    <div class="history-container" id="history-container" style="display:none;">
      <div class="history-title">Kontrolní výsledek:</div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <!-- PATIČKA S TLAČÍTKEM -->
  <div class="footer-action">
    <button class="main-action" id="main-btn" onclick="handleMainAction()">START</button>
  </div>
</div>

<script>
  // --- PROMĚNNÉ ---
  let state='init', currentDecValue=0, expectedAnswer='', expectedLength=0, currentDisplayBits=0;
  let fingerPanelVisible = false;
  let currentFingerSum=0;
  let settingsOpen=false; 
  let tempSettings={}; 

  const $=id=>document.getElementById(id);

  // --- FORMÁTOVACÍ FUNKCE ---
  const formatDecimal=num=>num.toLocaleString('cs-CZ');
  const removeLeadingZeros=str=>{
    const clean=str.replace(/\s/g,'');
    const stripped=clean.replace(/^0+/,'');
    return stripped===''?'0':stripped;
  };
  const formatBinary=binStr=>{
    const clean=binStr.replace(/\s/g,'');
    if(clean==='') return '';
    let out='',count=0;
    for(let i=clean.length-1;i>=0;i--){
      out=clean[i]+out;
      if(++count%5===0 && i>0) out=' '+out;
    }
    return out;
  };
  const formatBinaryForDisplay=(binStr,displayBits)=>{
    let clean=binStr.replace(/\s/g,'').replace(/^0+/,'');
    if(clean==='') clean='0';
    while(clean.length<displayBits) clean='0'+clean;
    clean=clean.slice(-displayBits);
    let out='',count=0;
    for(let i=clean.length-1;i>=0;i--){
      out=clean[i]+out;
      if(++count%5===0 && i>0) out=' '+out;
    }
    return out;
  };
  const formatDecimalInput=value=>{
    let clean=value.replace(/\s/g,'').replace(/\D/g,'');
    if(clean==='') return '';
    const num=parseInt(clean,10);
    return isNaN(num)?'':num.toLocaleString('cs-CZ').replace(/\./g,' ');
  };

  // --- LOGIKA APLIKACE ---

  function updateTitle(){
    $('app-title').innerText = $('direction').value==='dec2bin'
      ? 'Bináry   DEC → BIN'
      : 'Bináry   BIN → DEC';
  }

  function syncFingerPanelClass(){
    const panel=$('finger-panel');
    const dir=$('direction').value;
    panel.classList.toggle('dec-mode', fingerPanelVisible && dir==='dec2bin');
  }

  function initFingerGrid(){
    const grid=$('finger-grid');
    grid.innerHTML='';
    const rows=3, cols=5;
    const bitExponent=(r,c)=>(rows-1-r)*cols+(cols-1-c);
    const bitValue=(r,c)=>2**bitExponent(r,c);

    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const el=document.createElement('div');
        el.className='finger-sq';
        el.dataset.value=String(bitValue(r,c));
        el.addEventListener('click',()=>{
          if(state!=='playing') return;
          if(!($('direction').value==='dec2bin' && fingerPanelVisible)) return;
          const v=Number(el.dataset.value);
          currentFingerSum = ((currentFingerSum & v)===v) ? (currentFingerSum & ~v) : (currentFingerSum | v);
          document.querySelectorAll('#finger-grid .finger-sq').forEach(sq=>{
            const vv=Number(sq.dataset.value);
            sq.classList.toggle('on',(currentFingerSum & vv)===vv);
          });
        });
        grid.appendChild(el);
      }
    }
  }

  function updateFingerDisplay(){
    const dir=$('direction').value;
    const fingers=document.querySelectorAll('#finger-grid .finger-sq');
    fingers.forEach(x=>x.classList.remove('on'));
    if(dir==='bin2dec'){
      fingers.forEach(el=>{
        const v=Number(el.dataset.value);
        el.classList.toggle('on',(currentDecValue & v)===v);
      });
    }
  }

  function toggleFingerPanel(){
    fingerPanelVisible = !fingerPanelVisible;
    $('finger-panel').classList.toggle('visible', fingerPanelVisible);
    syncFingerPanelClass();
    if(state !== 'init') startGame();
  }

  function toggleTheme(){
    const body=document.body;
    const isDark=body.dataset.theme==='dark';
    const newTheme=isDark?'light':'dark';
    body.dataset.theme=newTheme;
    $('theme-btn').innerText=newTheme==='dark'?'☀️':'🌙';
    localStorage.setItem('binTrainTheme',newTheme);
  }

  function toggleSettings(){
    const p=$('settings-panel'), info=$('info');
    const willBeOpen = (p.style.display==='none' || p.style.display==='');
    p.style.display= willBeOpen ? 'flex' : 'none';
    info.style.display= willBeOpen ? 'block' : 'none';

    if(willBeOpen){
      settingsOpen = true;
      tempSettings = { dir: $('direction').value, bits: $('bits').value };
      $('finger-toggle-btn').style.display='none';
      $('theme-btn').style.display='none';
      $('single-input').style.display='none';
      $('keypad-bin').classList.remove('visible');
      $('keypad-dec').classList.remove('visible-desktop');
      $('back-btn-dec').style.display='none';
      $('clear-btn-dec').style.display='none';
      $('finger-panel').classList.remove('visible');
      $('question-display').style.display='none';
    } else {
      settingsOpen = false;
      $('theme-btn').style.display='block';
      
      const changed = (tempSettings.dir !== $('direction').value || tempSettings.bits !== $('bits').value);
      if(changed){
        startGame();
      } else {
        if(state === 'playing' || state === 'evaluated'){
           $('finger-toggle-btn').style.display='block';
           $('question-display').style.display='block'; 
           $('single-input').style.display='block';
           if(state === 'evaluated'){
             $('single-input').readOnly = true;
           } else {
             startGame(); 
           }
        }
      }
    }
  }

  function updateInfo(){
    const bits=parseInt($('bits').value,10);
    const dir=$('direction').value;
    localStorage.setItem('binTrainBits',bits);
    localStorage.setItem('binTrainDir',dir);
    const maxNum=2**bits - 1;
    $('info').innerText=`Rozsah: 0 až ${formatDecimal(maxNum)}`;
    updateTitle();
    syncFingerPanelClass();
  }

  function handleMainAction(){
    if(state==='init'){ startGame(); return; }
    if(state==='playing') checkAnswer();
    else if(state==='evaluated') startGame();
  }

  // Ovládání klávesnicí na PC
  document.addEventListener('keydown',e=>{
    if($('single-input').readOnly && $('direction').value!=='bin2dec') return;
    if(e.key!=='Enter') return;
    e.preventDefault();
    if(state==='init') handleMainAction();
    else if(state==='playing') checkAnswer();
  });

  function computeCursorForDigits(formatted, originalValue, cursorPosition, direction){
    let digitsBefore=0;
    for(let i=0;i<cursorPosition && i<originalValue.length;i++){
      if(direction==='dec2bin' ? /[01]/.test(originalValue[i]) : /\d/.test(originalValue[i])) digitsBefore++;
    }
    let newCursorPos=0, digitCount=0;
    for(let i=0;i<formatted.length;i++){
      if(direction==='dec2bin' ? /[01]/.test(formatted[i]) : /\d/.test(formatted[i])) digitCount++;
      if(digitCount===digitsBefore){ newCursorPos=i+1; break; }
      newCursorPos=i+1;
    }
    return newCursorPos;
  }

  // Logika psaní do inputu
  $('single-input').addEventListener('input',function(){
    if(this.readOnly) return;
    const dir=$('direction').value;
    const input=this;
    const cursorPosition=input.selectionStart;
    const originalValue=input.value;
    if(dir==='dec2bin'){
      const clean=input.value.replace(/[^01]/g,'').slice(0, 15);
      const formatted=formatBinary(clean);
      input.value=formatted;
      input.selectionStart=input.selectionEnd=computeCursorForDigits(formatted,originalValue,cursorPosition,'dec2bin');
    } else {
      if(/[^\d\s]/.test(input.value)){ input.value=input.value.replace(/[^\d\s]/g,''); }
      const formatted=formatDecimalInput(input.value);
      input.value=formatted;
      input.selectionStart=input.selectionEnd=computeCursorForDigits(formatted,originalValue,cursorPosition,'bin2dec');
    }
  });

  function startGame(){
    state='playing';
    $('main-btn').innerText='VÝSLEDEK';
    
    $('finger-toggle-btn').style.display='block';
    currentFingerSum = 0;
    document.querySelectorAll('#finger-grid .finger-sq').forEach(el=>el.classList.remove('on'));
    
    $('finger-panel').classList.toggle('visible', fingerPanelVisible);
    syncFingerPanelClass();

    localStorage.removeItem('binTrainHistory');
    renderHistory();

    const bits=parseInt($('bits').value,10);
    const dir=$('direction').value;
    const maxNum=2**bits - 1;

    currentDecValue=Math.floor(Math.random()*(maxNum+1));
    const binString=currentDecValue.toString(2);

    $('question-display').style.display='block';
    $('single-input').style.display='block';
    $('single-input').value = ''; 
    $('single-input').className = '';
    
    if(dir === 'dec2bin'){
      $('single-input').inputMode = 'none';
      if(fingerPanelVisible){
        $('single-input').readOnly = true;
        $('keypad-bin').classList.remove('visible');
        $('back-btn-dec').style.display='none';
        $('clear-btn-dec').style.display='none';
      } else {
        $('single-input').readOnly = false;
        $('keypad-bin').classList.add('visible');
        $('back-btn-dec').style.display='flex';
        $('clear-btn-dec').style.display='flex';
        $('single-input').focus();
      }
      $('question-display').innerText=formatDecimal(currentDecValue);
      expectedAnswer=binString;
      expectedLength=bits;

    }else{ // BIN -> DEC
      $('single-input').inputMode = 'numeric';
      $('single-input').readOnly = false;
      $('keypad-bin').classList.remove('visible');
      $('keypad-dec').classList.add('visible-desktop');
      $('back-btn-dec').style.display='flex';
      $('clear-btn-dec').style.display='flex';
      $('single-input').focus();
      
      currentDisplayBits = bits===5 ? 5 : (bits<=10 ? 10 : 15);
      $('question-display').innerText=formatBinaryForDisplay(binString,currentDisplayBits);
      expectedAnswer=currentDecValue.toString();
      expectedLength=maxNum.toString().length;
      updateFingerDisplay();
    }
  }

  function deleteLeft(){
    if(state!=='playing') return;
    const input=$('single-input'), dir=$('direction').value;
    const cursorPos=input.selectionStart;
    if(cursorPos===0) return;
    const value=input.value;
    let deletePos=-1;
    for(let i=cursorPos-1;i>=0;i--){
      if(dir==='dec2bin'){ if(/[01]/.test(value[i])){ deletePos=i; break; } }
      else{ if(/\d/.test(value[i])){ deletePos=i; break; } }
    }
    if(deletePos===-1) return;
    const newValue=value.slice(0,deletePos)+value.slice(deletePos+1);
    if(dir==='dec2bin'){
      const clean=newValue.replace(/\s/g,'');
      let formatted='',count=0;
      for(let i=clean.length-1;i>=0;i--){
        formatted=clean[i]+formatted;
        if(++count%5===0 && i>0) formatted=' '+formatted;
      }
      input.value=formatted;
      input.selectionStart=input.selectionEnd=computeCursorForDigits(formatted,value,cursorPos,'dec2bin');
    }else{
      const formatted=formatDecimalInput(newValue);
      input.value=formatted;
      input.selectionStart=input.selectionEnd=computeCursorForDigits(formatted,value,cursorPos,'bin2dec');
    }
    input.focus();
  }

  function clearAll(){
    if(state!=='playing') return;
    $('single-input').value='';
    $('single-input').focus();
  }

  function typeVal(val){
    if(state!=='playing') return;
    const input=$('single-input');
    const dir = $('direction').value;
    const start=input.selectionStart, end=input.selectionEnd;
    const value=input.value;
    const hasSelection=start!==end;

    if(dir === 'dec2bin'){
      if(!['0','1'].includes(val)) return;
      if(!hasSelection && value.replace(/\s/g,'').length>=15) return;
      let newValue=value.slice(0,start)+val+value.slice(end);
      let clean=newValue.replace(/\s/g,'');
      if(clean.length>15) clean=clean.slice(0,15);
      let formatted='',count=0;
      for(let i=clean.length-1;i>=0;i--){
        formatted=clean[i]+formatted;
        if(++count%5===0 && i>0) formatted=' '+formatted;
      }
      input.value=formatted;
      input.selectionStart=input.selectionEnd=formatted.length;
    } else {
      if(!/^\d$/.test(val)) return;
      let clean = value.replace(/\s/g, '');
      if(hasSelection) {
        clean = value.slice(0, start) + value.slice(end);
        clean = clean.replace(/\s/g, '');
      }
      clean += val;
      const formatted = formatDecimalInput(clean);
      input.value = formatted;
      input.selectionStart = input.selectionEnd = formatted.length;
    }
  }

  function checkAnswer(){
    const dir=$('direction').value;
    const input=$('single-input');
    let rawValue = input.value.trim();
    let isCorrect=false;
    let correctFormattedAnswer='';
    
    $('keypad-bin').classList.remove('visible');
    $('keypad-dec').classList.remove('visible-desktop');
    $('back-btn-dec').style.display='none';
    $('clear-btn-dec').style.display='none';

    if(dir==='dec2bin' && fingerPanelVisible){
      const sum=currentFingerSum;
      isCorrect=(sum===currentDecValue);
      correctFormattedAnswer=formatBinary(expectedAnswer);
      if(isCorrect) { input.value = correctFormattedAnswer; } else { input.value = formatBinary(sum.toString(2)); }
      input.className=isCorrect?'success':'error';
      input.readOnly = true; 
      state='evaluated';
      $('main-btn').innerText='START';
      saveToHistory(`${formatDecimal(currentDecValue)} = ${correctFormattedAnswer}`,isCorrect);
      return;
    }

    if(dir==='bin2dec'){
      if(rawValue===''){
         state='evaluated'; $('main-btn').innerText='START';
         input.readOnly = true; input.value=formatDecimal(parseInt(expectedAnswer,10)); input.className='';
         updateFingerDisplay(); return;
      }
      const cleanUser=removeLeadingZeros(rawValue);
      const cleanExpected=removeLeadingZeros(expectedAnswer);
      isCorrect=cleanUser===cleanExpected;
      correctFormattedAnswer=formatDecimal(parseInt(cleanExpected,10));

      state='evaluated'; $('main-btn').innerText='START';
      input.readOnly = true; input.className=isCorrect?'success':'error';
      if(isCorrect) input.value=correctFormattedAnswer;
      const binForHistory=formatBinary(currentDecValue.toString(2));
      saveToHistory(`${binForHistory} = ${correctFormattedAnswer}`,isCorrect);
      updateFingerDisplay();
      return;
    }

    if(rawValue===''){
      state='evaluated'; $('main-btn').innerText='START';
      input.readOnly = true; input.value=formatBinary(expectedAnswer); input.className='';
      updateFingerDisplay(); return;
    }

    const cleanUser=removeLeadingZeros(rawValue);
    const cleanExpected=removeLeadingZeros(expectedAnswer);
    isCorrect=cleanUser===cleanExpected;
    correctFormattedAnswer=formatBinary(cleanExpected);

    state='evaluated';
    $('main-btn').innerText='START';
    input.readOnly = true;
    input.className=isCorrect?'success':'error';
    if(isCorrect) input.value=correctFormattedAnswer;
    saveToHistory(`${formatDecimal(currentDecValue)} = ${correctFormattedAnswer}`,isCorrect);
    updateFingerDisplay();
  }

  function saveToHistory(text,isCorrect){
    const history=[{text,isCorrect}];
    localStorage.setItem('binTrainHistory',JSON.stringify(history));
    renderHistory();
  }

  function renderHistory(){
    const history=JSON.parse(localStorage.getItem('binTrainHistory')||'[]');
    const container=$('history-container'), list=$('history-list');
    list.innerHTML='';
    if(history.length===0){ container.style.display='none'; return; }
    container.style.display='block';
    history.forEach(it=>{
      const div=document.createElement('div');
      div.className=`history-item ${it.isCorrect?'correct':'error'}`;
      div.innerText=it.text;
      list.appendChild(div);
    });
  }

  function initApp(){
    localStorage.removeItem('binTrainHistory');

    const savedTheme=localStorage.getItem('binTrainTheme')||'light';
    document.body.dataset.theme=savedTheme;
    $('theme-btn').innerText=savedTheme==='dark'?'☀️':'🌙';

    const bitSelect=$('bits');
    bitSelect.innerHTML='';
    for(let i=5;i<=15;i++){
      const maxVal=2**i - 1;
      const opt=document.createElement('option');
      opt.value=i;
      opt.innerHTML=`${i} bitů ≤ ${formatDecimal(maxVal)}`;
      bitSelect.appendChild(opt);
    }

    const savedDir=localStorage.getItem('binTrainDir');
    if(savedDir) $('direction').value=savedDir;
    const savedBits=localStorage.getItem('binTrainBits');
    if(savedBits) $('bits').value=savedBits;

    $('settings-panel').style.display='none';
    $('info').style.display='none';

    initFingerGrid();
    updateTitle();
    updateInfo();
    renderHistory();
    
    state='init';
    fingerPanelVisible = false;
    
    $('finger-toggle-btn').style.display='none'; 
    $('main-btn').innerText='START';
    $('question-display').style.display='none';
    $('single-input').style.display='none';
    $('keypad-bin').classList.remove('visible');
    $('keypad-dec').classList.remove('visible-desktop');
    $('back-btn-dec').style.display='none';
    $('clear-btn-dec').style.display='none';
    $('finger-panel').classList.remove('visible');
  }

  window.onload=initApp;
</script>
</body>
</html>
