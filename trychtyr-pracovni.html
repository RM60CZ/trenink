<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Trychtýř čísel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      background: #f9f9f9;
    }
    .trychtýr {
      margin-top: 20px;
    }
    .radek {
      text-align: center;
      margin: 4px 0;
    }
    input {
      width: 80px;
      height: 40px;
      font-size: 16px;
      text-align: center;
      border: 2px solid #333;
      border-radius: 4px;
      margin: 0 2px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #007bff;
    }
  </style>
</head>
<body>
  <div class="trychtýr" id="trychtýr"></div>

  <script>
    const container = document.getElementById('trychtýr');
    const maxRadku = 7;

    // Trychtýř: začínáme od 7 a jdem dolů k 1
    for (let r = maxRadku; r >= 1; r--) {
      const radek = document.createElement('div');
      radek.className = 'radek';

      for (let i = 0; i < r; i++) {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.inputmode = 'numeric';
        inp.placeholder = '0';
        inp.addEventListener('input', function() {
          let value = this.value.replace(/\D/g, ''); // jen číslice
          if (value) {
            value = parseInt(value).toLocaleString('cs-CZ'); // formát CZ: mezery
            this.value = value;
          }
        });
        radek.appendChild(inp);
      }

      container.appendChild(radek);
    }
  </script>
</body>
</html>
