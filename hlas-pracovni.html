<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hlas → čísla (s mezerami)</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 20px; max-width: 800px; }
      .row { display: flex; gap: 10px; margin-bottom: 15px; }
      input[type="text"] { flex: 1; min-width: 300px; padding: 10px; font-size: 16px; }
      button { padding: 10px 16px; font-size: 15px; cursor: pointer; }
      textarea { width: 100%; height: 120px; font-family: monospace; font-size: 14px; }
      .hint { color: #555; font-size: 14px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Hlas → čísla (s mezerami)</h1>
    <div class="row">
      <input id="textInput" type="text" placeholder="Řekni '25', pak '0' → 25 000" />
      <button id="clearBtn">Vymazat</button>
      <button id="listenBtn">Start</button>
    </div>
    <div class="hint">
      • „25“ → „0“ → <code>25 000</code><br>
      • „nula celá pět“ → „0“ → <code>0,005000</code><br>
      • Mezery jen v celé části.
    </div>
    <textarea id="log" readonly></textarea>

    <script>
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const inputEl = document.getElementById("textInput");
      const logEl = document.getElementById("log");
      const clearBtn = document.getElementById("clearBtn");
      const listenBtn = document.getElementById("listenBtn");

      let recognition = null;
      let isListening = false;

      function log(msg) {
        logEl.value += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      const normalizationMap = [
        ["celých", " celých "], ["celych", " celych "],
        ["celý", " celý "], ["cely", " cely "],
        ["celá", " celá "], ["cela", " cela "],
        ["devětset", " devět set "], ["devetset", " devet set "],
        ["osmset", " osm set "],
        ["sedumset", " sedum set "], ["sedmset", " sedm set "],
        ["sestset", " sest set "], ["petset", " pet set "],
        ["ctyrista", " ctyri sta "], ["trista", " tri sta "],
        ["dveste", " dve ste "], ["dvěste", " dvě stě "],
        ["devatenact", " devatenáct "], ["osmnact", " osmnáct "],
        ["sedumnact", " sedumnáct "], ["sedmnact", " sedmnáct "],
        ["sestnact", " šestnáct "], ["patnact", " patnáct "],
        ["ctrnact", " čtrnáct "], ["trinact", " třináct "],
        ["dvanact", " dvanáct "], ["jedenact", " jedenáct "],
        ["devadesat", " devadesát "], ["osmdesat", " osmdesát "],
        ["sedumdesat", " sedumdesát "], ["sedmdesat", " sedmdesát "],
        ["šedesát", " šedesát "], ["padesat", " padesát "],
        ["ctyricet", " čtyřicet "], ["tricet", " třicet "],
        ["dvacit", " dvacet "],
        ["devet", " devět "], ["sedum", " sedm "], ["ses", " šes "],
        ["sest", " šest "], ["pet", " pět "], ["ctyr", " čtyř "],
        ["ctyri", " čtyři "], ["tri", " tři "], ["dve", " dvě "], ["nula", " nula "]
      ];

      function normalizeText(text) {
        if (!text) return "";
        let t = text.toLowerCase().replace(/[.,!?;:"']/g, "");
        t = " " + t + " ";
        for (const [from, to] of normalizationMap) {
          const re = new RegExp(from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
          t = t.replace(re, to);
        }
        return t.replace(/\s+/g, " ").trim();
      }

      function extractNumber(text) {
        if (!text) return null;
        const asDigit = text.trim();
        if (/^\d+$/.test(asDigit)) {
          const num = parseInt(asDigit, 10);
          return (num >= 0 && num <= 999) ? num : null;
        }

        const normalized = normalizeText(text);
        const words = normalized.split(/\s+/).filter(w => w && w !== "a");

        if (words.length === 1 && ["nula", "nůla"].includes(words[0])) {
          return 0;
        }

        const jednotky = { "jedna":1,"jeden":1,"dva":2,"dvě":2,"tři":3,"čtyři":4,"pět":5,
          "šest":6,"sedm":7,"osm":8,"devět":9 };
        const teens = { "deset":10,"jedenáct":11,"dvanáct":12,"třináct":13,"čtrnáct":14,
          "patnáct":15,"šestnáct":16,"sedmnáct":17,"osmnáct":18,"devatenáct":19 };
        const desitky = { "dvacet":20,"třicet":30,"čtyřicet":40,"padesát":50,
          "šedesát":60,"sedmdesát":70,"osmdesát":80,"devadesát":90 };
        const stovky = { "sto":100,"dvě stě":200,"tři sta":300,"čtyři sta":400,
          "pět set":500,"šest set":600,"sedm set":700,"osm set":800,"devět set":900 };

        let total = 0;
        let remaining = words.join(" ");

        for (const [phrase, val] of Object.entries(stovky)) {
          if (remaining.includes(phrase)) {
            total += val;
            remaining = remaining.replace(phrase, "").replace(/\s+/g, " ").trim();
            break;
          }
        }

        const restWords = remaining.split(/\s+/).filter(w => w);
        let restValue = 0;
        if (restWords.length === 1) {
          const w = restWords[0];
          if (teens[w] !== undefined) restValue = teens[w];
          else if (desitky[w] !== undefined) restValue = desitky[w];
          else if (jednotky[w] !== undefined) restValue = jednotky[w];
        } else if (restWords.length === 2) {
          const d = desitky[restWords[0]] || 0;
          const j = jednotky[restWords[1]] || 0;
          if (d >= 20 && d <= 90 && j >= 1 && j <= 9) restValue = d + j;
        }

        total += restValue;
        return (total >= 0 && total <= 999) ? total : null;
      }

      function parseFirstDecimal(text) {
        const lower = text.toLowerCase();
        const match = lower.match(/(cel[áaýýy]|celých|celych)/);
        if (!match) return null;

        const before = text.substring(0, match.index).trim();
        const after = text.substring(match.index + match[0].length).trim();

        const whole = extractNumber(before);
        const decimal = extractNumber(after);

        if (whole !== null && decimal !== null) {
          return `${whole},${String(decimal).padStart(3, '0')}`;
        }
        return null;
      }

      function setupRecognition() {
        if (!SpeechRecognition) {
          alert("Hlas není podporován (zkus Chrome/Edge).");
          return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = "cs-CZ";
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
          const transcript = event.results[event.resultIndex][0].transcript.trim();
          log("🎙️ " + transcript);

          // Odstraníme mezery pro interní práci
          let currentRaw = inputEl.value.replace(/ /g, '');
          const number = extractNumber(transcript);

          // První vstup
          if (currentRaw === "") {
            const dec = parseFirstDecimal(transcript);
            if (dec !== null) {
              inputEl.value = dec;
              log("→ " + dec);
              return;
            }
            if (number !== null) {
              inputEl.value = number.toString();
              log("→ " + inputEl.value);
              return;
            }
          }

          if (number === null) {
            log("→ ignorováno");
            return;
          }

          const padded = String(number).padStart(3, '0');

          if (currentRaw.includes(',')) {
            // Desetinný režim – max 6 míst
            const [whole, decPart] = currentRaw.split(',');
            if (decPart.length < 6) {
              const newDec = (decPart + padded).substring(0, 6).padEnd(6, '0');
              inputEl.value = `${whole},${newDec}`;
            } else {
              log("→ desetinná část plná (6 míst)");
            }
          } else {
            // Celý režim – přidat blok a naformátovat s mezerami
            const newRaw = currentRaw + padded;
            inputEl.value = newRaw.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
          }

          log("→ " + inputEl.value);
        };

        recognition.onerror = (e) => log("❌ " + e.error);
        recognition.onend = () => {
          if (isListening) setTimeout(() => recognition.start(), 500);
        };
      }

      listenBtn.onclick = () => {
        if (!recognition) setupRecognition();
        if (isListening) {
          recognition.stop();
          isListening = false;
          listenBtn.textContent = "Start";
        } else {
          recognition.start();
          isListening = true;
          listenBtn.textContent = "Stop";
        }
      };

      clearBtn.onclick = () => {
        inputEl.value = "";
        log("🧹 vymazáno");
      };

      log("🚀 Připraveno.");
    </script>
  </body>
</html>
