<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hlas → čísla (opraveno: první číslo beze změny)</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 20px; max-width: 850px; background: #fafafa; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
      input[type="text"] { flex: 1; min-width: 320px; padding: 10px 14px; font-size: 17px; border: 1px solid #ccc; border-radius: 4px; }
      button { padding: 10px 16px; font-size: 16px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
      button:hover { background: #f5f5f5; }
      button.active { background: #2196F3; color: white; border-color: #1976D2; }
      textarea { width: 100%; min-height: 120px; padding: 12px; font-family: monospace; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
      .hint { color: #444; font-size: 14px; line-height: 1.5; margin-top: 8px; background: #f0f8ff; padding: 12px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>🎙️ Hlas → čísla (opraveno)</h1>
    <div class="row">
      <input id="textInput" type="text" placeholder="Řekni '5', pak 'celá', pak '7' → 5,007" readonly />
      <button id="clearBtn">Vymazat</button>
      <button id="listenBtn">Start</button>
    </div>
    <div class="hint">
      ✅ <strong>První číslo:</strong> beze změny (`5` → `5`, nikoli `005`)<br>
      ✅ <strong>„celá/celé/celých“:</strong> vloží jen <code>,</code> (nikdy žádné `000`!)<br>
      ✅ <strong>Další čísla:</strong> převádějí se na `XXX` (`7` → `007`)<br>
      ✅ Mezery jen v celé části (před čárkou)
    </div>
    <textarea id="log" readonly></textarea>

    <script>
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const inputEl = document.getElementById("textInput");
      const logEl = document.getElementById("log");
      const clearBtn = document.getElementById("clearBtn");
      const listenBtn = document.getElementById("listenBtn");

      let recognition = null;
      let isListening = false;

      function log(msg) {
        logEl.value += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      // Normalizace pro čísla
      const numMap = [
        ["devětset", " devět set "], ["osmset", " osm set "],
        ["sedmset", " sedm set "], ["petset", " pet set "],
        ["ctyrista", " ctyri sta "], ["trista", " tri sta "],
        ["dveste", " dve ste "], ["dvěste", " dvě stě "],
        ["devatenact", " devatenáct "], ["osmnact", " osmnáct "],
        ["sedmnact", " sedmnáct "], ["patnact", " patnáct "],
        ["ctrnact", " čtrnáct "], ["trinact", " třináct "],
        ["dvanact", " dvanáct "], ["jedenact", " jedenáct "],
        ["devadesat", " devadesát "], ["osmdesat", " osmdesát "],
        ["sedmdesat", " sedmdesát "], ["padesat", " padesát "],
        ["ctyricet", " čtyřicet "], ["tricet", " třicet "],
        ["dvacet", " dvacet "],
        ["devet", " devět "], ["sedm", " sedm "], ["pet", " pět "],
        ["ctyri", " čtyři "], ["tri", " tři "], ["dve", " dvě "], ["nula", " nula "]
      ];

      function normNum(text) {
        if (!text) return "";
        let t = text.toLowerCase().replace(/[^a-z0-9áčďéěíňóřšťúůýž\s]/g, "");
        t = " " + t + " ";
        for (const [from, to] of numMap) {
          const re = new RegExp(from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
          t = t.replace(re, to);
        }
        return t.replace(/\s+/g, " ").trim();
      }

      function extractNumber(text) {
        if (!text) return null;
        const asNum = text.trim();
        if (/^\d+$/.test(asNum)) {
          const n = parseInt(asNum, 10);
          return (n >= 0 && n <= 999) ? n : null;
        }

        const words = normNum(text).split(/\s+/).filter(w => w && w !== "a");
        if (words.length === 1 && words[0] === "nula") return 0;

        const jedn = {"jedna":1,"jeden":1,"dva":2,"dvě":2,"tři":3,"čtyři":4,"pět":5,
          "šest":6,"sedm":7,"osm":8,"devět":9};
        const teens = {"deset":10,"jedenáct":11,"dvanáct":12,"třináct":13,"čtrnáct":14,
          "patnáct":15,"šestnáct":16,"sedmnáct":17,"osmnáct":18,"devatenáct":19};
        const desitky = {"dvacet":20,"třicet":30,"čtyřicet":40,"padesát":50,
          "šedesát":60,"sedmdesát":70,"osmdesát":80,"devadesát":90};
        const stovky = {"sto":100,"dvě stě":200,"tři sta":300,"čtyři sta":400,
          "pět set":500,"šest set":600,"sedm set":700,"osm set":800,"devět set":900};

        let total = 0;
        let rem = words.join(" ");
        for (const [ph, val] of Object.entries(stovky)) {
          if (rem.includes(ph)) {
            total += val;
            rem = rem.replace(ph, "").replace(/\s+/g, " ").trim();
            break;
          }
        }
        const rw = rem.split(/\s+/).filter(w => w);
        let rv = 0;
        if (rw.length === 1) {
          const w = rw[0];
          if (teens[w]) rv = teens[w];
          else if (desitky[w]) rv = desitky[w];
          else if (jedn[w]) rv = jedn[w];
        } else if (rw.length === 2) {
          const d = desitky[rw[0]] || 0;
          const j = jedn[rw[1]] || 0;
          if (d >= 20 && d <= 90 && j >= 1 && j <= 9) rv = d + j;
        }
        total += rv;
        return (total >= 0 && total <= 999) ? total : null;
      }

      function setupRecognition() {
        if (!SpeechRecognition) {
          alert("Prohlížeč nepodporuje hlas (Chrome/Edge).");
          return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = "cs-CZ";
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
          const transcript = event.results[event.resultIndex][0].transcript.trim();
          log("🗣️ " + transcript);

          let currentRaw = inputEl.value.replace(/ /g, '');

          // 🔑 "celá/celé/celých" → jen čárka
          if (/\b(cel[áaé]|celych|cely|cel[ýy])\b/i.test(transcript)) {
            if (currentRaw === "") {
              inputEl.value = "0,";
            } else if (!currentRaw.endsWith(',')) {
              inputEl.value = currentRaw + ',';
            }
            log("→ čárka");
            return;
          }

          const num = extractNumber(transcript);
          if (num === null) {
            log("→ ignorováno");
            return;
          }

          // 🔑 První číslo → beze změny
          if (currentRaw === "") {
            inputEl.value = num.toString();
            log("→ první: " + num);
          } else {
            // 🔑 Další čísla → XXX
            const pad = String(num).padStart(3, '0');
            if (currentRaw.endsWith(',')) {
              inputEl.value = currentRaw + pad;
            } else {
              const newRaw = currentRaw + pad;
              inputEl.value = newRaw.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            }
            log("→ blok: " + pad);
          }
        };

        recognition.onerror = (e) => log("❌ " + e.error);
        recognition.onend = () => {
          if (isListening) setTimeout(() => recognition.start(), 500);
        };
      }

      listenBtn.onclick = () => {
        if (!recognition) setupRecognition();
        if (isListening) {
          recognition.stop();
          isListening = false;
          listenBtn.textContent = "Start";
          listenBtn.classList.remove("active");
        } else {
          recognition.start();
          isListening = true;
          listenBtn.textContent = "Poslouchám…";
          listenBtn.classList.add("active");
        }
      };

      clearBtn.onclick = () => {
        inputEl.value = "";
        log("🧹 vymazáno");
      };

      log("🚀 Připraveno.");
    </script>
  </body>
</html>
