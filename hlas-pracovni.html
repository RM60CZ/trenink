<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hlas → čísla s desetinnou čárkou (česky)</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        padding: 20px;
        max-width: 900px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      input[type="text"] {
        flex: 1;
        min-width: 320px;
        padding: 10px 12px;
        font-size: 16px;
      }
      button {
        padding: 10px 14px;
        font-size: 15px;
        cursor: pointer;
      }
      .status { margin-top: 10px; font-size: 14px; }
      textarea {
        width: 100%;
        min-height: 110px;
        padding: 10px 12px;
        font-size: 14px;
      }
      .muted { color: #666; font-size: 14px; margin-top: 8px; }

      #listenBtn.active {
        color: #fff;
        background: #e53935;
        border: 1px solid #c62828;
      }
      #listenBtn:not(.active) {
        color: #111;
        background: #f3f3f3;
        border: 1px solid #d6d6d6;
      }
    </style>
  </head>
  <body>
    <h1>Hlas → čísla (česky, s desetinnou čárkou)</h1>

    <div class="row">
      <input id="textInput" type="text" placeholder="Řekni např. 'nulacelápět' nebo 'pět celých sto'" />
      <button id="clearBtn" type="button">Vymazat</button>
      <button id="listenBtn" type="button">Pauza</button>
    </div>

    <div class="muted">
      Příklady:<br>
      <b>„nulacelápět“</b> → <code>0,005</code><br>
      <b>„nulacelápětset“</b> → <code>0,500</code><br>
      <b>„pětcelýchtři“</b> → <code>5,003</code><br>
      <b>„dvě stě padesát sedm celých třista osmdesát čtyři“</b> → <code>257,384</code>
    </div>

    <div class="status" id="status">Stav: připraveno.</div>

    <h2>Log</h2>
    <textarea id="log" readonly></textarea>

    <script>
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const inputEl = document.getElementById("textInput");
      const listenBtn = document.getElementById("listenBtn");
      const clearBtn = document.getElementById("clearBtn");

      let recognition = null;
      let isListening = false;

      function log(msg) {
        logEl.value += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setStatus(msg) {
        statusEl.textContent = "Stav: " + msg;
      }

      function updateListenButton() {
        if (isListening) {
          listenBtn.classList.add("active");
          listenBtn.textContent = "Spuštěno";
          setStatus("poslouchám… (např. 'nulacelápět')");
        } else {
          listenBtn.classList.remove("active");
          listenBtn.textContent = "Pauza";
          setStatus("pauza (mikrofon vypnutý)");
        }
      }

      // Normalizační mapa – nejdelší řetězce první!
      const normalizationMap = [
        // Oddělení klíčových slov pro desetinnou čárku
        ["celých", " celých "],
        ["celych", " celych "],
        ["celý", " celý "],
        ["cely", " cely "],
        ["celá", " celá "],
        ["cela", " cela "],

        // Čísla – od nejdelších
        ["devětset", " devět set "],
        ["devetset", " devet set "],
        ["osmset", " osm set "],
        ["sedumset", " sedum set "],
        ["sedmset", " sedm set "],
        ["sestset", " sest set "],
        ["petset", " pet set "],
        ["ctyrista", " ctyri sta "],
        ["trista", " tri sta "],
        ["dveste", " dve ste "],
        ["dvěste", " dvě stě "],

        ["devatenact", " devatenáct "],
        ["osmnact", " osmnáct "],
        ["sedumnact", " sedumnáct "],
        ["sedmnact", " sedmnáct "],
        ["sestnact", " šestnáct "],
        ["patnact", " patnáct "],
        ["ctrnact", " čtrnáct "],
        ["trinact", " třináct "],
        ["dvanact", " dvanáct "],
        ["jedenact", " jedenáct "],

        ["devadesat", " devadesát "],
        ["osmdesat", " osmdesát "],
        ["sedumdesat", " sedumdesát "],
        ["sedmdesat", " sedmdesát "],
        ["šedesát", " šedesát "],
        ["padesat", " padesát "],
        ["ctyricet", " čtyřicet "],
        ["tricet", " třicet "],
        ["dvacit", " dvacet "],

        ["devet", " devět "],
        ["sedum", " sedm "],
        ["ses", " šes "],
        ["sest", " šest "],
        ["pet", " pět "],
        ["ctyr", " čtyř "],
        ["ctyri", " čtyři "],
        ["tri", " tři "],
        ["dve", " dvě "],
        ["nula", " nula "]
      ];

      function normalizeText(text) {
        if (!text) return "";
        let normalized = text.toLowerCase().replace(/[.,!?;:"']/g, "");
        normalized = " " + normalized + " "; // ochranné mezery

        for (const [from, to] of normalizationMap) {
          const escaped = from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const regex = new RegExp(escaped, 'g');
          normalized = normalized.replace(regex, to);
        }

        return normalized.replace(/\s+/g, " ").trim();
      }

      function extractNumber(text) {
        if (!text) return null;

        // Pokud je to číslice
        const asDigit = text.trim();
        if (/^\d+$/.test(asDigit)) {
          const num = parseInt(asDigit, 10);
          return (num >= 0 && num <= 999) ? num : null;
        }

        // Normalizace a rozdělení
        const normalized = normalizeText(text);
        const words = normalized.split(/\s+/).filter(w => w && w !== "a");

        if (words.length === 1 && ["nula", "nůla"].includes(words[0])) {
          return 0;
        }

        const jednotky = {
          "jedna": 1, "jeden": 1,
          "dva": 2, "dvě": 2,
          "tři": 3,
          "čtyři": 4,
          "pět": 5,
          "šest": 6,
          "sedm": 7,
          "osm": 8,
          "devět": 9
        };

        const teens = {
          "deset": 10,
          "jedenáct": 11,
          "dvanáct": 12,
          "třináct": 13,
          "čtrnáct": 14,
          "patnáct": 15,
          "šestnáct": 16,
          "sedmnáct": 17, "sedumnáct": 17,
          "osmnáct": 18,
          "devatenáct": 19
        };

        const desitky = {
          "dvacet": 20,
          "třicet": 30,
          "čtyřicet": 40,
          "padesát": 50,
          "šedesát": 60,
          "sedmdesát": 70, "sedumdesát": 70,
          "osmdesát": 80,
          "devadesát": 90
        };

        const stovky = {
          "sto": 100,
          "dvě stě": 200,
          "tři sta": 300,
          "čtyři sta": 400,
          "pět set": 500,
          "šest set": 600,
          "sedm set": 700, "sedum set": 700,
          "osm set": 800,
          "devět set": 900
        };

        let total = 0;
        let remaining = words.join(" ");

        // Stovky
        for (const [phrase, val] of Object.entries(stovky)) {
          if (remaining.includes(phrase)) {
            total += val;
            remaining = remaining.replace(phrase, "").replace(/\s+/g, " ").trim();
            break;
          }
        }

        // Zbytek
        const restWords = remaining.split(/\s+/).filter(w => w);
        let restValue = 0;

        if (restWords.length === 1) {
          const w = restWords[0];
          if (teens[w] !== undefined) restValue = teens[w];
          else if (desitky[w] !== undefined) restValue = desitky[w];
          else if (jednotky[w] !== undefined) restValue = jednotky[w];
        } else if (restWords.length === 2) {
          const d = desitky[restWords[0]] || 0;
          const j = jednotky[restWords[1]] || 0;
          if (d >= 20 && d <= 90 && j >= 1 && j <= 9) {
            restValue = d + j;
          }
        }

        total += restValue;
        return (total >= 0 && total <= 999) ? total : null;
      }

      function parseDecimalPhrase(text) {
        if (!text) return null;
        const lower = text.toLowerCase();

        // Hledáme jakékoli výskyty "celá", "celých" atd.
        const match = lower.match(/(cel[áaýýy]|celých|celych)/);
        if (!match) return null;

        const before = text.substring(0, match.index).trim();
        const after = text.substring(match.index + match[0].length).trim();

        const whole = extractNumber(before);
        const decimal = extractNumber(after);

        if (whole !== null && decimal !== null) {
          const decimalStr = String(decimal).padStart(3, '0');
          return `${whole},${decimalStr}`;
        }
        return null;
      }

      function setupRecognition() {
        if (!SpeechRecognition) {
          setStatus("SpeechRecognition není podporován (zkus Chrome/Edge).");
          listenBtn.disabled = true;
          return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = "cs-CZ";
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onstart = () => {
          isListening = true;
          updateListenButton();
          log(">> mikrofon zapnut");
        };

        recognition.onerror = (event) => {
          log("!! chyba: " + event.error);
        };

        recognition.onend = () => {
          if (isListening) {
            setTimeout(() => {
              try { recognition.start(); } catch (e) {
                log("!! nelze restartovat: " + e.message);
                isListening = false;
                updateListenButton();
              }
            }, 300);
          } else {
            updateListenButton();
          }
          log("<< mikrofon ukončen nebo restart");
        };

        recognition.onresult = (event) => {
          const transcript = event.results[event.resultIndex][0].transcript.trim();
          log("[rozpoznáno] " + transcript);

          // Nejprve zkusíme desetinnou frázi (i spojenou)
          const decimalResult = parseDecimalPhrase(transcript);
          if (decimalResult) {
            inputEl.value += decimalResult;
            log(`[vloženo] ${decimalResult}`);
            return;
          }

          // Jinak normální číslo
          const number = extractNumber(transcript);
          if (number !== null) {
            inputEl.value += number.toString();
            log(`[vloženo číslo] ${number}`);
            return;
          }

          log("[ignorováno] – neznámý tvar");
        };
      }

      listenBtn.addEventListener("click", () => {
        if (!recognition) return;
        if (isListening) {
          isListening = false;
          recognition.stop();
        } else {
          isListening = true;
          try { recognition.start(); } catch (e) {
            log("!! nelze spustit: " + e.message);
            isListening = false;
            updateListenButton();
          }
        }
      });

      clearBtn.addEventListener("click", () => {
        inputEl.value = "";
        log("[vymazáno]");
      });

      setupRecognition();
      updateListenButton();
      log("------------------------------------------------");
    </script>
  </body>
</html>
