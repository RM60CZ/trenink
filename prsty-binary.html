<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <!-- Zůstává standardní nastavení, ale přidáme škálování my sami -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>TEST prsty</title>
  <style>
    :root{
      --sq-w: 56px;
      --sq-h: 40px;
      --col-gap: 14px;
      --row-gap: 26px;
      --grow: 2;
      --white: #ffffff;
      --green: #41d887;
      --bg: #0b1020;
      --text: #d7defa;
      /* Výchozí zoom (1 = 100%), bude přepsán JS */
      --zoom: 1; 
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100dvh;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:16px;
      /* Zabraňuje dvojitému kliknutí pro zoom prohlížeče */
      touch-action:manipulation; 
    }

    h1{
      margin:0 0 18px;
      font-size:clamp(20px,4.8vw,30px);
      text-align:center;
    }

    /* Kontejner, který budeme zvětšovat */
    .app-container {
      transform: scale(var(--zoom));
      transform-origin: top center;
      transition: transform 0.2s ease;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(5, var(--sq-w));
      grid-template-rows:repeat(3, calc(var(--sq-h) * 2));
      column-gap:var(--col-gap);
      row-gap:var(--row-gap);
      justify-content:center;
      align-content:center;
      max-width:100%;
    }

    .sq{
      width:var(--sq-w);
      height:var(--sq-h);
      background:var(--white);
      border:none;
      border-radius:12px;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      align-self:end;
      transform-origin:bottom center;
      transition:transform .18s ease, background-color .18s ease, box-shadow .18s ease;
      box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 3px 10px rgba(0,0,0,.28);
    }

    .sq.on{
      background:var(--green);
      transform:scaleY(var(--grow));
      box-shadow:0 1px 0 rgba(255,255,255,.15) inset, 0 8px 18px rgba(0,0,0,.35);
    }

    /* Ovládací panel pro zoom */
    .controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 100;
      background: rgba(0,0,0,0.5);
      padding: 5px;
      border-radius: 20px;
    }

    .zoom-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--text);
      background: transparent;
      color: var(--text);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .zoom-btn:active {
      background: var(--text);
      color: var(--bg);
    }

    @media (max-width: 520px){
      :root{ --sq-w: 48px; --sq-h: 36px; --col-gap: 10px; --row-gap: 22px; }
    }

    @media (max-width: 390px){
      :root{ --sq-w: 42px; --sq-h: 34px; --col-gap: 8px; --row-gap: 20px; }
    }
  </style>
</head>
<body>

  <!-- Kontejner pro škálování -->
  <div class="app-container">
    <h1>TEST prsty - viditelnost</h1>
    <div id="grid" class="grid"></div>
  </div>

  <!-- Tlačítka pro nastavení velikosti -->
  <div class="controls">
    <button class="zoom-btn" id="zoomOut">−</button>
    <button class="zoom-btn" id="zoomIn">+</button>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const N = 15;
    const STORAGE_KEY_LAYOUT = 'finger-test-layout';
    const STORAGE_KEY_ZOOM = 'finger-test-zoom';

    // 1. NAČTENÍ ZOOMU
    // Načteme uloženou velikost (např. 1.3 pro 130%)
    let currentZoom = parseFloat(localStorage.getItem(STORAGE_KEY_ZOOM)) || 1;
    applyZoom(currentZoom);

    // 2. NAČTENÍ STAVU TLAČÍTEK
    let savedState = JSON.parse(localStorage.getItem(STORAGE_KEY_LAYOUT)) || new Array(N).fill(false);

    for (let i = 0; i < N; i++){
      const el = document.createElement('button');
      el.className = 'sq';
      el.type = 'button';
      el.setAttribute('aria-label', 'Prst ' + (i + 1));
      
      if (savedState[i]) el.classList.add('on');

      el.addEventListener('click', () => {
        el.classList.toggle('on');
        saveLayout();
      });
      grid.appendChild(el);
    }

    // Funkce pro uložení rozložení
    function saveLayout() {
      const buttons = grid.querySelectorAll('.sq');
      const state = Array.from(buttons).map(btn => btn.classList.contains('on'));
      localStorage.setItem(STORAGE_KEY_LAYOUT, JSON.stringify(state));
    }

    // Funkce pro aplikování zoomu
    function applyZoom(level) {
      document.documentElement.style.setProperty('--zoom', level);
    }

    // Funkce pro uložení zoomu
    function saveZoom(level) {
      localStorage.setItem(STORAGE_KEY_ZOOM, level);
    }

    // Ovládání tlačítek +/-
    document.getElementById('zoomIn').addEventListener('click', () => {
      currentZoom = Math.min(currentZoom + 0.1, 2.0); // Max 200%
      applyZoom(currentZoom);
      saveZoom(currentZoom);
    });

    document.getElementById('zoomOut').addEventListener('click', () => {
      currentZoom = Math.max(currentZoom - 0.1, 0.5); // Min 50%
      applyZoom(currentZoom);
      saveZoom(currentZoom);
    });
  </script>
</body>
</html>
