<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hlas → jen 1 a 2 (continuous)</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        padding: 20px;
        max-width: 900px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      input[type="text"] {
        flex: 1;
        min-width: 320px;
        padding: 10px 12px;
        font-size: 16px;
      }
      button {
        padding: 10px 14px;
        font-size: 15px;
        cursor: pointer;
      }
      .status { margin-top: 10px; font-size: 14px; }
      textarea {
        width: 100%;
        min-height: 110px;
        padding: 10px 12px;
        font-size: 14px;
      }
      .muted { color: #666; font-size: 14px; margin-top: 8px; }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: #f1f1f1;
        font-size: 12px;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Hlas → jen 1 a 2 (jeden/jedna, dva/dvě)</h1>

    <div class="row">
      <input id="textInput" type="text" placeholder="Sem se bude dávat jen: jeden/jedna nebo dva/dvě…" />
      <button id="clearBtn" type="button">Vymazat</button>
      <button id="listenBtn" type="button">Spustit hlas</button>
      <button id="numbersBtn" type="button">Zobrazit jako čísla</button>
    </div>

    <div class="muted">
      Mikrofon běží v režimu continuous, dokud ho tlačítkem nevypneš.
    </div>

    <div class="status" id="status">Stav: připraveno.</div>

    <h2>Log</h2>
    <textarea id="log" readonly></textarea>

    <script>
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const inputEl = document.getElementById("textInput");

      const listenBtn = document.getElementById("listenBtn");
      const clearBtn = document.getElementById("clearBtn");
      const numbersBtn = document.getElementById("numbersBtn");

      let recognition = null;
      let listening = false;

      // Povolená slova -> číslice
      const allowedToDigit = {
        "jeden": "1",
        "jedna": "1",
        "dva": "2",
        "dvě": "2",
        "dve": "2" // někdy bez diakritiky
      };

      function log(msg) {
        logEl.value += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setStatus(msg) {
        statusEl.textContent = "Stav: " + msg;
      }

      // Necháme si z recognizovaného textu vytáhnout jen povolená slova,
      // a zbytek ignorujeme.
      function extractAllowedWords(text) {
        const tokens = text
          .toLowerCase()
          .replace(/[.,!?]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .split(" ")
          .filter(Boolean);

        const outTokens = [];
        for (const t of tokens) {
          if (allowedToDigit[t]) outTokens.push(t);
        }
        return outTokens;
      }

      // Z inputu vyrobí jen číslice 1 a 2
      function getNumberFromAllowedWords(text) {
        const tokens = text
          .toLowerCase()
          .replace(/[.,!?]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .split(" ")
          .filter(Boolean);

        let out = "";
        for (const t of tokens) {
          if (allowedToDigit[t] != null) out += allowedToDigit[t];
        }
        return out;
      }

      function setupRecognition() {
        if (!SpeechRecognition) {
          setStatus("SpeechRecognition nepodporuje tento prohlížeč (zkus Chrome/Edge).");
          listenBtn.disabled = true;
          return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = "cs-CZ";
        recognition.interimResults = true;   // průběžně
        recognition.continuous = true;      // běží, dokud ho nevypneš (pokud prohlížeč dovolí)

        recognition.onstart = () => {
          listening = true;
          listenBtn.textContent = "Vypnout hlas";
          setStatus("poslouchám… (microfon zapnutý)");
          log(">> start");
        };

        recognition.onerror = (e) => {
          setStatus("chyba: " + (e.error || "neznámá"));
          log("!! error: " + (e.error || ""));
        };

        recognition.onend = () => {
          listening = false;
          listenBtn.textContent = "Spustit hlas";
          setStatus("hotovo (můžeš znovu spustit).");
          log("<< end");
        };

        recognition.onresult = (event) => {
          // Skládáme si finální text jen z povolených slov.
          let interimText = "";
          let finalText = "";

          for (let i = event.resultIndex; i < event.results.length; i++) {
            const res = event.results[i];
            const transcript = res[0].transcript || "";
            if (res.isFinal) finalText += transcript + " ";
            else interimText += transcript + " ";
          }

          // Z filtrujeme jen povolené tokeny; cokoliv jiného ignorujeme.
          const interimAllowed = interimText ? extractAllowedWords(interimText) : [];
          const finalAllowed = finalText ? extractAllowedWords(finalText) : [];

          if (interimAllowed.length > 0) {
            // Může být lepší průběžně ukazovat jen povolená slova,
            // ale nepřepisovat finál, jen zobrazit interim (tohle je volitelné).
            inputEl.value = interimAllowed.join(" ");
          }

          if (finalAllowed.length > 0) {
            // Přidáme do inputu povolená slova z finální části.
            // (Tím pádem se postupně skládá tvoje "věta" jen z 1 a 2 slov.)
            const current = inputEl.value.trim();
            const add = finalAllowed.join(" ");
            inputEl.value = current ? (current + " " + add).trim() : add;
            log("[final allowed] " + finalAllowed.join(" "));
          }
        };
      }

      listenBtn.addEventListener("click", () => {
        if (!recognition) return;

        if (!listening) {
          try {
            recognition.start();
          } catch (err) {
            // Některé prohlížeče hodí chybu, když start přijde ve špatný okamžik.
            setStatus("Nelze spustit: " + (err && err.message ? err.message : "chyba"));
          }
        } else {
          recognition.stop();
        }
      });

      clearBtn.addEventListener("click", () => {
        inputEl.value = "";
        setStatus("vymazáno");
        log("[clear]");
        inputEl.focus();
      });

      numbersBtn.addEventListener("click", () => {
        const raw = inputEl.value.trim();
        if (!raw) {
          setStatus("input je prázdný");
          return;
        }
        const converted = getNumberFromAllowedWords(raw);
        // Zobrazíme číslice přímo do inputu
        inputEl.value = converted;
        setStatus("převod hotov");
        log("[converted] " + raw + " => " + converted);
        inputEl.focus();
      });

      setupRecognition();
      setStatus("připraveno");
      log("------------------------------------------------");
    </script>
  </body>
</html>
