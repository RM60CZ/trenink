<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hlas → čísla (jen 1 a 2)</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        padding: 20px;
        max-width: 900px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      input[type="text"] {
        flex: 1;
        min-width: 320px;
        padding: 10px 12px;
        font-size: 16px;
      }
      button {
        padding: 10px 14px;
        font-size: 15px;
        cursor: pointer;
      }
      .muted { color: #666; font-size: 14px; margin-top: 8px; }
      textarea {
        width: 100%;
        min-height: 110px;
        padding: 10px 12px;
        font-size: 14px;
      }
      .status { margin-top: 10px; font-size: 14px; }
    </style>
  </head>
  <body>
    <h1>Hlas → přepis do inputu + převod slov (jen 1 a 2)</h1>

    <div class="row">
      <input id="textInput" type="text" placeholder="Diktuj: jeden/dvě (a volitelně tečka/čárka)…" />
      <button id="clearBtn" type="button">Vymazat</button>
      <button id="listenBtn" type="button">Spustit hlas</button>
      <button id="numbersBtn" type="button">Zobrazit jako čísla</button>
    </div>

    <div class="muted">
      Funguje přes <b>Web Speech API</b> (typicky Chrome/Edge).
    </div>

    <div class="status" id="status">Stav: připraveno.</div>

    <h2>Log rozpoznání</h2>
    <textarea id="log" readonly></textarea>

    <script>
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const inputEl = document.getElementById("textInput");

      const listenBtn = document.getElementById("listenBtn");
      const clearBtn = document.getElementById("clearBtn");
      const numbersBtn = document.getElementById("numbersBtn");

      let recognition = null;
      let listening = false;

      function log(msg) {
        logEl.value += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setStatus(msg) {
        statusEl.textContent = "Stav: " + msg;
      }

      // Převod: jen 1 a 2 (jeden/jedna, dva/dvě)
      function getNumberFromCzechWords(text) {
        const map = {
          "jeden": "1",
          "jedna": "1",

          "dva": "2",
          "dvě": "2",
          "dve": "2", // někdy rozpoznávač vyplivne bez diakritiky
        };

        // Volitelné desetinné znaky (pokud nechceš, smaž i tyto 2 řádky + mapování)
        // map["tečka"] = ".";
        // map["tecku"] = ".";
        // map["čárka"] = ",";
        // map["carka"] = ",";

        const tokens = text
          .toLowerCase()
          .replace(/[.,!?]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .split(" ")
          .filter(Boolean);

        let out = "";
        for (const t of tokens) {
          const v = map[t];
          if (v != null) out += v;
        }
        return out;
      }

      function setupRecognition() {
        if (!SpeechRecognition) {
          setStatus("Tento prohlížeč nepodporuje SpeechRecognition (zkus Chrome/Edge).");
          return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = "cs-CZ";
        recognition.interimResults = true;
        recognition.continuous = false;

        recognition.onstart = () => {
          listening = true;
          setStatus("poslouchám…");
          listenBtn.textContent = "Stop hlas";
          log(">> start");
        };

        recognition.onerror = (e) => {
          listening = false;
          setStatus("chyba: " + (e.error || "neznámá"));
          listenBtn.textContent = "Spustit hlas";
          log("!! error: " + (e.error || ""));
        };

        recognition.onend = () => {
          listening = false;
          setStatus("hotovo (můžeš znovu spustit).");
          listenBtn.textContent = "Spustit hlas";
          log("<< end");
        };

        recognition.onresult = (event) => {
          let interim = "";
          let finalText = "";

          for (let i = event.resultIndex; i < event.results.length; i++) {
            const res = event.results[i];
            const transcript = res[0].transcript;
            if (res.isFinal) finalText += transcript;
            else interim += transcript;
          }

          if (interim) {
            inputEl.value = interim;
            log("[interim] " + interim);
          }
          if (finalText) {
            inputEl.value = finalText.trim();
            log("[final] " + finalText.trim());
          }
        };
      }

      listenBtn.addEventListener("click", () => {
        if (!recognition) return;
        if (!listening) {
          inputEl.focus();
          try { recognition.start(); } catch (err) {}
        } else {
          recognition.stop();
        }
      });

      clearBtn.addEventListener("click", () => {
        inputEl.value = "";
        log("[clear]");
        setStatus("vymazáno");
        inputEl.focus();
      });

      numbersBtn.addEventListener("click", () => {
        const raw = inputEl.value.trim();
        if (!raw) {
          setStatus("input je prázdný");
          return;
        }
        const converted = getNumberFromCzechWords(raw);
        inputEl.value = converted;
        log("[converted] " + raw + " => " + converted);
        setStatus("převod hotov");
        inputEl.focus();
      });

      setupRecognition();
      setStatus("připraveno");
      log("------------------------------------------------");
    </script>
  </body>
</html>
