<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hlas → čísla (jednoduchý demo)</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 20px; max-width: 900px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
      input[type="text"]{
        flex: 1;
        min-width: 320px;
        padding: 10px 12px;
        font-size: 16px;
      }
      button {
        padding: 10px 14px;
        font-size: 15px;
        cursor: pointer;
      }
      .muted { color: #666; font-size: 14px; margin-top: 8px; }
      textarea { width: 100%; min-height: 110px; padding: 10px 12px; font-size: 14px; }
      .status { margin-top: 10px; font-size: 14px; }
      code { background: #f6f6f6; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>Hlas → přepis do inputu</h1>

    <div class="row">
      <input id="textInput" type="text" placeholder="Diktuj čísla česky… (např. nula jedna dvě tečka pět)"/>
      <button id="clearBtn" type="button">Vymazat</button>
      <button id="listenBtn" type="button">Spustit hlas</button>
      <button id="numbersBtn" type="button">Zobrazit jako čísla</button>
    </div>

    <div class="muted">
      Funkční přes <b>Web Speech API</b> (typicky Chrome/Edge). V některých prohlížečích to nemusí fungovat.
    </div>

    <div class="status" id="status">Stav: připraveno.</div>

    <h2>Log rozpoznání</h2>
    <textarea id="log" readonly></textarea>

    <script>
      // --- Web Speech API (SpeechRecognition) ---
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const statusEl = document.getElementById('status');
      const logEl = document.getElementById('log');
      const inputEl = document.getElementById('textInput');

      const listenBtn = document.getElementById('listenBtn');
      const clearBtn = document.getElementById('clearBtn');
      const numbersBtn = document.getElementById('numbersBtn');

      let recognition = null;
      let listening = false;

      function log(msg) {
        logEl.value += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setStatus(msg) {
        statusEl.textContent = "Stav: " + msg;
      }

      function getNumberFromCzechWords(text) {
        // Minimalistický převod (jen demo):
        // - mapuje základní číslice (nula-jeden-dva-tři-...-devět)
        // - mapuje "tečka"->'.' a "čárka"->'.'
        // Později to můžeme rozšířit dle tvých pravidel.
        const map = {
          "nula": "0",
          "jedna": "1",
          "jeden": "1",
          "dva": "2",
          "dvě": "2",
          "tři": "3",
          "čtyři": "4",
          "pět": "5",
          "šest": "6",
          "sedm": "7",
          "sedmý": "7",
          "osm": "8",
          "devět": "9",

          "tečka": ".",
          "tecku": ".",
          "čárka": ".",
          "carka": ".",
          "desetinná": "."
        };

        // normalizace: mezery, diakritika necháme (většinou stačí)
        const tokens = text
          .toLowerCase()
          .replace(/[.,!?]/g, " ")
          .split(/\s+/)
          .filter(Boolean);

        let out = "";
        for (const t of tokens) {
          if (map[t] != null) out += map[t];
          else {
            // ignoruj neznámé tokeny
            // (alternativně bychom mohli logovat)
          }
        }
        return out;
      }

      if (!SpeechRecognition) {
        setStatus("Tento prohlížeč nepodporuje SpeechRecognition (zkus Chrome/Edge).");
      } else {
        recognition = new SpeechRecognition();
        recognition.lang = "cs-CZ";
        recognition.interimResults = true; // ukazuje průběžný text
        recognition.continuous = false;  // typicky "jedno spuštění" = jedno převyprávění

        recognition.onstart = () => {
          listening = true;
          setStatus("poslouchám…");
          listenBtn.textContent = "Stop hlas";
          log(">> start");
        };

        recognition.onerror = (e) => {
          setStatus("chyba: " + (e.error || "neznámá"));
          log("!! error: " + (e.error || ""));
          listening = false;
          listenBtn.textContent = "Spustit hlas";
        };

        recognition.onend = () => {
          listening = false;
          setStatus("hotovo (můžeš znovu spustit).");
          listenBtn.textContent = "Spustit hlas";
          log("<< end");
        };

        recognition.onresult = (event) => {
          let interim = "";
          let finalText = "";

          for (let i = event.resultIndex; i < event.results.length; i++) {
            const res = event.results[i];
            const transcript = res[0].transcript;
            if (res.isFinal) finalText += transcript;
            else interim += transcript;
          }

          // Zobrazíme průběžně do inputu, ale finální dodáme “na jistotu”
          if (interim) {
            inputEl.value = interim;
            log("[interim] " + interim);
          }
          if (finalText) {
            inputEl.value = finalText.trim();
            log("[final] " + finalText.trim());
          }
        };
      }

      listenBtn.addEventListener('click', () => {
        if (!recognition) return;
        if (!listening) {
          try {
            inputEl.focus();
            recognition.start();
          } catch (err) {
            // Některé prohlížeče vyhodí chybu když se start volá dvakrát
            setStatus("Nelze spustit znovu: " + err.message);
          }
        } else {
          recognition.stop();
        }
      });

      clearBtn.addEventListener('click', () => {
        inputEl.value = "";
        log("[clear]");
        setStatus("vymazáno");
        inputEl.focus();
      });

      numbersBtn.addEventListener('click', () => {
        const raw = inputEl.value.trim();
        if (!raw) {
          setStatus("input je prázdný");
          return;
        }
        const converted = getNumberFromCzechWords(raw);
        // zobrazíme výsledek přímo do inputu (jednoduše)
        inputEl.value = converted;
        log("[converted] " + raw + " => " + converted);
        setStatus("převod hotov");
        inputEl.focus();
      });
    </script>
  </body>
</html>
