<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hlas → jen 1 a 2</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        padding: 20px;
        max-width: 900px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      input[type="text"] {
        flex: 1;
        min-width: 320px;
        padding: 10px 12px;
        font-size: 16px;
      }
      button {
        padding: 10px 14px;
        font-size: 15px;
        cursor: pointer;
      }
      .status { margin-top: 10px; font-size: 14px; }
      textarea {
        width: 100%;
        min-height: 110px;
        padding: 10px 12px;
        font-size: 14px;
      }
      .muted { color: #666; font-size: 14px; margin-top: 8px; }

      /* stav tlačítka */
      #listenBtn.active {
        color: #fff;
        background: #e53935;
        border: 1px solid #c62828;
      }
      #listenBtn:not(.active) {
        color: #111;
        background: #f3f3f3;
        border: 1px solid #d6d6d6;
      }
    </style>
  </head>
  <body>
    <h1>Hlas → čísla (jen 1 a 2)</h1>

    <div class="row">
      <input id="textInput" type="text" placeholder="Zde se budou objevovat jen: 1 nebo 2" />

      <button id="clearBtn" type="button">Vymazat</button>

      <button id="listenBtn" type="button" class="inactive">Pauza</button>

      <button id="numbersBtn" type="button" style="display:none;">Zobrazit jako čísla</button>
    </div>

    <div class="muted">
      Do inputu se vkládají <b>jen</b> číslice: <b>1</b> při „jeden/jedna“ a <b>2</b> při „dva/dvě“.
      Ostatní slova se ignorují.
    </div>

    <div class="status" id="status">Stav: připraveno.</div>

    <h2>Log</h2>
    <textarea id="log" readonly></textarea>

    <script>
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const inputEl = document.getElementById("textInput");

      const listenBtn = document.getElementById("listenBtn");
      const clearBtn = document.getElementById("clearBtn");

      let recognition = null;
      let listening = false;

      // Povolené mapování: jen 1 a 2
      const wordToDigit = {
        "jeden": "1",
        "jedna": "1",
        "dva": "2",
        "dvě": "2",
        "dve": "2" // případně bez diakritiky
      };

      function log(msg) {
        logEl.value += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setStatus(msg) {
        statusEl.textContent = "Stav: " + msg;
      }

      function setListenUIActive(isActive) {
        listening = isActive;
        if (isActive) {
          listenBtn.classList.add("active");
          listenBtn.textContent = "Spuštěno";
          setStatus("poslouchám… (mikrofon zapnutý)");
        } else {
          listenBtn.classList.remove("active");
          listenBtn.textContent = "Pauza";
          setStatus("pauza (mikrofon vypnutý)");
        }
      }

      // Z textu vyrobíme jen číslice 1/2 a vše ostatní ignorujeme
      function extractDigits(text) {
        const tokens = (text || "")
          .toLowerCase()
          .replace(/[.,!?]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .split(" ")
          .filter(Boolean);

        let digits = "";
        for (const t of tokens) {
          const d = wordToDigit[t];
          if (d) digits += d;
        }
        return digits;
      }

      function setupRecognition() {
        if (!SpeechRecognition) {
          setStatus("SpeechRecognition nepodporuje tento prohlížeč (zkus Chrome/Edge).");
          listenBtn.disabled = true;
          return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = "cs-CZ";
        recognition.interimResults = true; // průběžné výsledky
        recognition.continuous = true;    // dokud nevypneš

        recognition.onstart = () => {
          setListenUIActive(true);
          log(">> start");
        };

        recognition.onerror = (e) => {
          log("!! error: " + (e.error || "neznámá"));
        };

        recognition.onend = () => {
          setListenUIActive(false);
          log("<< end");
        };

        recognition.onresult = (event) => {
          // DŮLEŽITÉ:
          // - chceme vkládat do inputu rovnou číslice
          // - ignorujeme všechna ostatní slova
          //
          // Doporučení:
          // v průběhu continuous se mohou výsledky objevovat opakovaně.
          // Tady je jednoduchá varianta: bereme jen finální výsledky.
          let finalDigits = "";

          for (let i = event.resultIndex; i < event.results.length; i++) {
            const res = event.results[i];
            const transcript = (res[0] && res[0].transcript) ? res[0].transcript : "";
            if (res.isFinal) {
              finalDigits += extractDigits(transcript);
            }
          }

          if (finalDigits) {
            // Přidáme číslice do existujícího obsahu (nepřepisujeme slovy)
            inputEl.value = (inputEl.value + finalDigits);
            log("[digits] " + finalDigits);
          }
        };
      }

      listenBtn.addEventListener("click", () => {
        if (!recognition) return;

        if (!listening) {
          try {
            recognition.start();
          } catch (err) {
            log("!! start error: " + (err && err.message ? err.message : String(err)));
          }
        } else {
          recognition.stop();
        }
      });

      clearBtn.addEventListener("click", () => {
        inputEl.value = "";
        log("[clear]");
        inputEl.focus();
      });

      setupRecognition();
      setListenUIActive(false);
      setStatus("připraveno");
      log("------------------------------------------------");
    </script>
  </body>
</html>
