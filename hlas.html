<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hlas → jen 1 a 2</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        padding: 20px;
        max-width: 900px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      input[type="text"] {
        flex: 1;
        min-width: 320px;
        padding: 10px 12px;
        font-size: 16px;
      }
      button {
        padding: 10px 14px;
        font-size: 15px;
        cursor: pointer;
      }
      .status { margin-top: 10px; font-size: 14px; }
      textarea {
        width: 100%;
        min-height: 110px;
        padding: 10px 12px;
        font-size: 14px;
      }
      .muted { color: #666; font-size: 14px; margin-top: 8px; }

      /* stav tlačítka */
      #listenBtn.active {
        color: #fff;
        background: #e53935;
        border: 1px solid #c62828;
      }
      #listenBtn:not(.active) {
        color: #111;
        background: #f3f3f3;
        border: 1px solid #d6d6d6;
      }
    </style>
  </head>
  <body>
    <h1>Hlas → jen čísla 1 a 2</h1>

    <div class="row">
      <input id="textInput" type="text" placeholder="Sem se budou dávat jen 'jeden/jedna' a 'dva/dvě' → pak až klikem 'Zobrazit jako čísla'." />

      <button id="clearBtn" type="button">Vymazat</button>

      <button id="listenBtn" type="button" class="inactive">Pauza</button>

      <button id="numbersBtn" type="button">Zobrazit jako čísla</button>
    </div>

    <div class="muted">
      Důležité: do výstupu se promítnou jen rozpoznaná slova <b>jeden/jedna</b> a <b>dva/dvě</b>.
      Ostatní ignorujeme (nevloží se vůbec).
    </div>

    <div class="status" id="status">Stav: připraveno.</div>

    <h2>Log</h2>
    <textarea id="log" readonly></textarea>

    <script>
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const inputEl = document.getElementById("textInput");

      const listenBtn = document.getElementById("listenBtn");
      const clearBtn = document.getElementById("clearBtn");
      const numbersBtn = document.getElementById("numbersBtn");

      let recognition = null;
      let listening = false;

      // Povolená slova -> číslice
      const allowedToDigit = {
        "jeden": "1",
        "jedna": "1",
        "dva": "2",
        "dvě": "2",
        "dve": "2" // někdy to SR vynechá diakritiku
      };

      function log(msg) {
        logEl.value += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setStatus(msg) {
        statusEl.textContent = "Stav: " + msg;
      }

      function setListenUIActive(isActive) {
        listening = isActive;
        if (isActive) {
          listenBtn.classList.add("active");
          listenBtn.textContent = "Spuštěno";
          listenBtn.setAttribute("aria-pressed", "true");
          setStatus("poslouchám… (mikrofon zapnutý)");
        } else {
          listenBtn.classList.remove("active");
          listenBtn.textContent = "Pauza";
          listenBtn.setAttribute("aria-pressed", "false");
          setStatus("pauza (mikrofon vypnutý)");
        }
      }

      // Vezmi text a vytáhni jen povolená slova (ignoruj všechno ostatní)
      function extractAllowedTokens(text) {
        const tokens = (text || "")
          .toLowerCase()
          .replace(/[.,!?]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .split(" ")
          .filter(Boolean);

        const out = [];
        for (const t of tokens) {
          // přísně jen allowedToDigit klíče
          if (Object.prototype.hasOwnProperty.call(allowedToDigit, t)) out.push(t);
        }
        return out;
      }

      // Z textu vyrob jen číslice 1 a 2 (ignoruje ostatní)
      function toDigitsOnly(text) {
        const tokens = (text || "")
          .toLowerCase()
          .replace(/[.,!?]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .split(" ")
          .filter(Boolean);

        let out = "";
        for (const t of tokens) {
          const d = allowedToDigit[t];
          if (d) out += d;
        }
        return out;
      }

      function setupRecognition() {
        if (!SpeechRecognition) {
          setStatus("SpeechRecognition nepodporuje tento prohlížeč (zkus Chrome/Edge).");
          listenBtn.disabled = true;
          return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = "cs-CZ";
        recognition.interimResults = true; // průběžně
        recognition.continuous = true;    // dokud ho nevypneš (dle prohlížeče)

        recognition.onstart = () => {
          setListenUIActive(true);
          log(">> start");
        };

        recognition.onerror = (e) => {
          log("!! error: " + (e.error || "neznámá"));
          // nechat uživateli možnost znovu zapnout
        };

        recognition.onend = () => {
          setListenUIActive(false);
          log("<< end");
        };

        recognition.onresult = (event) => {
          // Skládáme text z výsledků, ale do inputu vkládáme jen povolená slova.
          let interim = "";
          let finalText = "";

          for (let i = event.resultIndex; i < event.results.length; i++) {
            const res = event.results[i];
            const transcript = (res[0] && res[0].transcript) ? res[0].transcript : "";
            if (res.isFinal) finalText += transcript + " ";
            else interim += transcript + " ";
          }

          // Zobrazujeme jen povolené tokeny (přísně žádná jiná slova)
          const interimAllowed = interim ? extractAllowedTokens(interim) : [];
          const finalAllowed = finalText ? extractAllowedTokens(finalText) : [];

          // Pro průběžný displej: ukazujeme jen povolená slova, aby se tam nikdy neobjevilo "něco jiného".
          if (interimAllowed.length > 0 && !finalAllowed.length) {
            inputEl.value = interimAllowed.join(" ");
          }

          // Pro finál: přidáme povolená slova do inputu (ostatní ignorujeme úplně).
          if (finalAllowed.length > 0) {
            const current = inputEl.value.trim();
            const add = finalAllowed.join(" ");
            inputEl.value = current ? (current + " " + add).trim() : add;
            log("[final allowed] " + finalAllowed.join(" "));
          }
        };
      }

      listenBtn.addEventListener("click", () => {
        if (!recognition) return;

        if (!listening) {
          try {
            inputEl.focus();
            recognition.start();
          } catch (err) {
            // Některé prohlížeče vrátí chybu, když start voláš ve špatný čas
            log("!! start error: " + (err && err.message ? err.message : String(err)));
          }
        } else {
          recognition.stop();
        }
      });

      clearBtn.addEventListener("click", () => {
        inputEl.value = "";
        log("[clear]");
        inputEl.focus();
      });

      numbersBtn.addEventListener("click", () => {
        const raw = inputEl.value.trim();
        if (!raw) {
          setStatus("input je prázdný");
          return;
        }
        const converted = toDigitsOnly(raw);
        // Přepíšeme input pouze číslicemi (1 a 2), nic jiného
        inputEl.value = converted;
        log("[converted] " + raw + " => " + converted);
        setStatus("převod hotov");
      });

      setupRecognition();
      setListenUIActive(false);
      setStatus("připraveno");
      log("------------------------------------------------");
    </script>
  </body>
</html>
