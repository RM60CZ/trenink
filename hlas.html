<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hlas → přepis + převod 2</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        padding: 20px;
        max-width: 900px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      input[type="text"] {
        flex: 1;
        min-width: 320px;
        padding: 10px 12px;
        font-size: 16px;
      }
      button {
        padding: 10px 14px;
        font-size: 15px;
        cursor: pointer;
      }
      .status { margin-top: 10px; font-size: 14px; }
      textarea {
        width: 100%;
        min-height: 110px;
        padding: 10px 12px;
        font-size: 14px;
      }
      .muted { color: #666; font-size: 14px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Hlas → input + převod jen na 2</h1>

    <div class="row">
      <input id="textInput" type="text" placeholder="Diktuj… (např. 'dva' nebo 'dvě')" />
      <button id="clearBtn" type="button">Vymazat</button>
      <button id="listenBtn" type="button">Spustit hlas</button>
      <button id="numbersBtn" type="button">Zobrazit jako čísla</button>
    </div>

    <div class="muted">
      Používá Web Speech API (typicky Chrome/Edge).
    </div>

    <div class="status" id="status">Stav: připraveno.</div>

    <h2>Log</h2>
    <textarea id="log" readonly></textarea>

    <script>
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const inputEl = document.getElementById("textInput");

      const listenBtn = document.getElementById("listenBtn");
      const clearBtn = document.getElementById("clearBtn");
      const numbersBtn = document.getElementById("numbersBtn");

      let recognition = null;
      let listening = false;

      function log(msg) {
        logEl.value += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setStatus(msg) {
        statusEl.textContent = "Stav: " + msg;
      }

      // Jen: dva/dvě -> 2 (zatím nic víc)
      function getNumberFromCzechWords(text) {
        const map = {
          "dva": "2",
          "dvě": "2"
        };

        const tokens = text
          .toLowerCase()
          .replace(/[.,!?]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .split(" ")
          .filter(Boolean);

        let out = "";
        for (const t of tokens) {
          if (map[t] != null) out += map[t];
        }
        return out;
      }

      if (!SpeechRecognition) {
        setStatus("SpeechRecognition nepodporuje tento prohlížeč.");
      } else {
        recognition = new SpeechRecognition();
        recognition.lang = "cs-CZ";
        recognition.interimResults = true;
        recognition.continuous = false;

        recognition.onstart = () => {
          listening = true;
          setStatus("poslouchám…");
          listenBtn.textContent = "Stop hlas";
          log(">> start");
        };

        recognition.onerror = (e) => {
          listening = false;
          setStatus("chyba: " + (e.error || "neznámá"));
          listenBtn.textContent = "Spustit hlas";
          log("!! error: " + (e.error || ""));
        };

        recognition.onend = () => {
          listening = false;
          setStatus("hotovo (můžeš znovu spustit).");
          listenBtn.textContent = "Spustit hlas";
          log("<< end");
        };

        recognition.onresult = (event) => {
          let interim = "";
          let finalText = "";

          for (let i = event.resultIndex; i < event.results.length; i++) {
            const res = event.results[i];
            const transcript = res[0].transcript;
            if (res.isFinal) finalText += transcript;
            else interim += transcript;
          }

          if (interim) inputEl.value = interim;
          if (finalText) inputEl.value = finalText.trim();
        };
      }

      listenBtn.addEventListener("click", () => {
        if (!recognition) return;
        if (!listening) {
          inputEl.focus();
          try { recognition.start(); } catch (err) {}
        } else {
          recognition.stop();
        }
      });

      clearBtn.addEventListener("click", () => {
        inputEl.value = "";
        setStatus("vymazáno");
        log("[clear]");
        inputEl.focus();
      });

      numbersBtn.addEventListener("click", () => {
        const raw = inputEl.value.trim();
        if (!raw) {
          setStatus("input je prázdný");
          return;
        }
        const converted = getNumberFromCzechWords(raw);
        inputEl.value = converted;
        setStatus("převod hotov");
        log("[converted] " + raw + " => " + converted);
        inputEl.focus();
      });

      setStatus("připraveno");
      log("------------------------------------------------");
    </script>
  </body>
</html>
