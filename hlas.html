<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hlas → číslo po „tečce“ (0–9)</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        padding: 20px;
        max-width: 900px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      input[type="text"] {
        flex: 1;
        min-width: 320px;
        padding: 10px 12px;
        font-size: 16px;
      }
      button {
        padding: 10px 14px;
        font-size: 15px;
        cursor: pointer;
      }
      .status { margin-top: 10px; font-size: 14px; }
      textarea {
        width: 100%;
        min-height: 110px;
        padding: 10px 12px;
        font-size: 14px;
      }
      .muted { color: #666; font-size: 14px; margin-top: 8px; }

      #listenBtn.active {
        color: #fff;
        background: #e53935;
        border: 1px solid #c62828;
      }
      #listenBtn:not(.active) {
        color: #111;
        background: #f3f3f3;
        border: 1px solid #d6d6d6;
      }

      .buffer-display {
        background: #f8f9fa;
        padding: 4px 8px;
        border-radius: 4px;
        font-family: monospace;
        margin-top: 4px;
        font-size: 14px;
        color: #495057;
      }
    </style>
  </head>
  <body>
    <h1>Hlas → číslo (0–9, potvrzeno „tečkou“)</h1>

    <div class="row">
      <input id="textInput" type="text" placeholder="Řekni číslice 0–9, zakonči slovem „tečka“" />
      <button id="clearBtn" type="button">Vymazat</button>
      <button id="listenBtn" type="button">Pauza</button>
    </div>

    <div class="muted">
      Povolená slova: <b>nula, jedna/jeden, dva/dvě, tři, čtyři, pět, šest, sedm, osm, devět</b>.  
      Zakonči větu slovem <b>„tečka“</b> → číslo se vloží a buffer se vymaže.
    </div>

    <div class="status" id="status">Stav: připraveno.</div>
    <div><small>Buffer:</small> <span class="buffer-display" id="bufferDisplay"></span></div>

    <h2>Log</h2>
    <textarea id="log" readonly></textarea>

    <script>
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const inputEl = document.getElementById("textInput");
      const listenBtn = document.getElementById("listenBtn");
      const clearBtn = document.getElementById("clearBtn");
      const bufferDisplay = document.getElementById("bufferDisplay");

      let recognition = null;
      let isListening = false;
      let currentBuffer = "";

      // Mapování číslovek na číslice 0–9
      const wordToDigit = {
        // 0
        "nula": "0",

        // 1
        "jeden": "1",
        "jedna": "1",

        // 2
        "dva": "2",
        "dvě": "2",
        "dve": "2",

        // 3–9
        "tři": "3",
        "tri": "3",       // bez diakritiky

        "čtyři": "4",
        "ctyri": "4",     // bez diakritiky

        "pět": "5",
        "pet": "5",

        "šest": "6",
        "sest": "6",

        "sedm": "7",

        "osm": "8",

        "devět": "9",
        "devet": "9"
      };

      function log(msg) {
        logEl.value += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setStatus(msg) {
        statusEl.textContent = "Stav: " + msg;
      }

      function updateBufferDisplay() {
        bufferDisplay.textContent = currentBuffer || "(prázdný)";
      }

      function updateListenButton() {
        if (isListening) {
          listenBtn.classList.add("active");
          listenBtn.textContent = "Spuštěno";
          setStatus("poslouchám… (řekni číslice 0–9 a zakonči „tečkou“)");
        } else {
          listenBtn.classList.remove("active");
          listenBtn.textContent = "Pauza";
          setStatus("pauza (mikrofon vypnutý)");
        }
      }

      function processTranscript(text) {
        const words = text
          .toLowerCase()
          .replace(/[.,!?;:"']/g, " ")
          .split(/\s+/)
          .filter(w => w);

        for (const word of words) {
          if (word === "tečka" || word === "tecka") {
            if (currentBuffer) {
              inputEl.value += currentBuffer;
              log("[vloženo číslo] " + currentBuffer);
              currentBuffer = "";
              updateBufferDisplay();
            } else {
              log("[tečka] buffer byl prázdný");
            }
            return; // konec zpracování této věty
          }

          if (wordToDigit.hasOwnProperty(word)) {
            currentBuffer += wordToDigit[word];
            updateBufferDisplay();
            log("[do bufferu] " + word + " → " + wordToDigit[word]);
          }
          // Ostatní slova ignorujeme
        }
      }

      function setupRecognition() {
        if (!SpeechRecognition) {
          setStatus("SpeechRecognition není podporován (zkus Chrome/Edge).");
          listenBtn.disabled = true;
          return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = "cs-CZ";
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onstart = () => {
          isListening = true;
          updateListenButton();
          log(">> mikrofon zapnut");
        };

        recognition.onerror = (event) => {
          log("!! chyba: " + event.error);
        };

        recognition.onend = () => {
          if (isListening) {
            setTimeout(() => {
              try {
                recognition.start();
              } catch (e) {
                log("!! nelze restartovat: " + e.message);
                isListening = false;
                updateListenButton();
              }
            }, 300);
          } else {
            updateListenButton();
          }
          log("<< mikrofon ukončen nebo restart");
        };

        recognition.onresult = (event) => {
          const transcript = event.results[event.resultIndex][0].transcript.trim();
          log("[rozpoznáno] " + transcript);
          processTranscript(transcript);
        };
      }

      listenBtn.addEventListener("click", () => {
        if (!recognition) return;

        if (isListening) {
          isListening = false;
          recognition.stop();
        } else {
          isListening = true;
          try {
            recognition.start();
          } catch (e) {
            log("!! nelze spustit: " + e.message);
            isListening = false;
            updateListenButton();
          }
        }
      });

      clearBtn.addEventListener("click", () => {
        inputEl.value = "";
        currentBuffer = "";
        updateBufferDisplay();
        log("[vymazáno]");
      });

      setupRecognition();
      updateListenButton();
      updateBufferDisplay();
      log("------------------------------------------------");
    </script>
  </body>
</html>
