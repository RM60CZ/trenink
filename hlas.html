<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hlas → jen 1 a 2</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        padding: 20px;
        max-width: 900px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      input[type="text"] {
        flex: 1;
        min-width: 320px;
        padding: 10px 12px;
        font-size: 16px;
      }
      button {
        padding: 10px 14px;
        font-size: 15px;
        cursor: pointer;
      }
      .status { margin-top: 10px; font-size: 14px; }
      textarea {
        width: 100%;
        min-height: 110px;
        padding: 10px 12px;
        font-size: 14px;
      }
      .muted { color: #666; font-size: 14px; margin-top: 8px; }

      #listenBtn.active {
        color: #fff;
        background: #e53935;
        border: 1px solid #c62828;
      }
      #listenBtn:not(.active) {
        color: #111;
        background: #f3f3f3;
        border: 1px solid #d6d6d6;
      }
    </style>
  </head>
  <body>
    <h1>Hlas → čísla (jen 1 a 2)</h1>

    <div class="row">
      <input id="textInput" type="text" placeholder="Řekni: jeden/jedna → 1, dva/dvě → 2" />
      <button id="clearBtn" type="button">Vymazat</button>
      <button id="listenBtn" type="button">Pauza</button>
    </div>

    <div class="muted">
      Pouze slova <b>„jeden“, „jedna“, „dva“, „dvě“</b> se převedou na číslice. Vše ostatní se ignoruje.
    </div>

    <div class="status" id="status">Stav: připraveno.</div>

    <h2>Log</h2>
    <textarea id="log" readonly></textarea>

    <script>
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const inputEl = document.getElementById("textInput");
      const listenBtn = document.getElementById("listenBtn");
      const clearBtn = document.getElementById("clearBtn");

      let recognition = null;
      let isListening = false;

      // Povolená slova → číslice
      const allowedWords = {
        "jeden": "1",
        "jedna": "1",
        "dva": "2",
        "dvě": "2",
        "dve": "2" // pro případ bez diakritiky
      };

      function log(msg) {
        logEl.value += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setStatus(msg) {
        statusEl.textContent = "Stav: " + msg;
      }

      function updateListenButton() {
        if (isListening) {
          listenBtn.classList.add("active");
          listenBtn.textContent = "Spuštěno";
          setStatus("poslouchám… (mikrofon zapnutý)");
        } else {
          listenBtn.classList.remove("active");
          listenBtn.textContent = "Pauza";
          setStatus("pauza (mikrofon vypnutý)");
        }
      }

      function processTranscript(text) {
        const words = text
          .toLowerCase()
          .replace(/[.,!?;:"]/g, " ")
          .split(/\s+/)
          .filter(w => w);

        let result = "";
        for (const word of words) {
          if (allowedWords.hasOwnProperty(word)) {
            result += allowedWords[word];
          }
        }
        return result;
      }

      function setupRecognition() {
        if (!SpeechRecognition) {
          setStatus("SpeechRecognition není podporován (zkus Chrome/Edge).");
          listenBtn.disabled = true;
          return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = "cs-CZ";
        recognition.continuous = true;     // běží pořád
        recognition.interimResults = false; // NEUKAZUJEME interim → žádný text mezitím!

        recognition.onstart = () => {
          isListening = true;
          updateListenButton();
          log(">> mikrofon zapnut");
        };

        recognition.onerror = (event) => {
          log("!! chyba: " + event.error);
          if (event.error === "no-speech" || event.error === "audio-capture") {
            // Pokud nic nerozpoznal, nevypínáme – necháme běžet
          }
        };

        recognition.onend = () => {
          // Automaticky restartujeme, pokud jsme stále chtěli poslouchat
          if (isListening) {
            try {
              recognition.start();
            } catch (e) {
              log("!! restart failed: " + e.message);
              isListening = false;
              updateListenButton();
            }
          } else {
            updateListenButton();
          }
          log("<< mikrofon vypnut nebo restart");
        };

        recognition.onresult = (event) => {
          const transcript = event.results[event.resultIndex][0].transcript.trim();
          log("[rozpoznáno] " + transcript);

          const digits = processTranscript(transcript);
          if (digits) {
            inputEl.value += digits;
            log("[vloženo] " + digits);
          }
          // Pokud žádné povolené slovo → nic se nevloží
        };
      }

      listenBtn.addEventListener("click", () => {
        if (!recognition) return;

        if (isListening) {
          isListening = false;
          recognition.stop();
        } else {
          isListening = true;
          try {
            recognition.start();
          } catch (e) {
            log("!! nelze spustit: " + e.message);
            isListening = false;
            updateListenButton();
          }
        }
      });

      clearBtn.addEventListener("click", () => {
        inputEl.value = "";
        log("[vymazáno]");
      });

      setupRecognition();
      updateListenButton();
      log("------------------------------------------------");
    </script>
  </body>
</html>
